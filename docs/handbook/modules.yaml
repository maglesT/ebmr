# The module manifest behind the generated handbook pages (decision 0014). `pnpm handbook` reads it and writes
# code-map.md and reference/*.md; `pnpm handbook:check` (and tools/handbook/test) fails when a migration, a server
# feature, a contract file or a screen folder belongs to no module, when a handbook link is broken, or when a
# generated page is out of date.
#
# Matching is ordered: a file belongs to the FIRST module (in this file's order) whose pattern matches it.
# - migrations: per source directory, regular expressions on the file name.
# - server, contract, screens, src: paths (a directory claims every file under it; a file claims itself).
# - tests: globs (`**` any depth, `*` within one path segment); only *.test.ts and *.test.tsx files count.
# - page: the handbook page (relative to docs/handbook) that explains the module; it must be listed in README.md.

migration_sources:
  - packages/kernel/sql
  - packages/site-services/sql
  - packages/recipe-core/sql
  - apps/tablets-server/sql

# The highest migration number per source when the code map was built (14 October 2026). Migrations are immutable
# once merged, so the older ones are linked from the code map instead. A migration numbered above this mark must name
# its handbook page in a `-- Handbook: <page>` line within its first 10 lines.
migration_header_from:
  packages/kernel/sql: 1174
  packages/site-services/sql: 903
  packages/recipe-core/sql: 932
  apps/tablets-server/sql: 1209

# Handbook pages linked from the README that are still being written. A link to one of these may point at a file that
# does not exist yet; remove a page from this list as soon as it lands.
pending: []

