name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a branch (Actions > CI > Run workflow, or `gh workflow run ci.yml --ref <branch> -f e2e_groups=...`).
  # With e2e_groups (comma-separated, for example "route-w,rest") only those end-to-end groups run, on the pod, and
  # nothing else: a check of the affected groups before a pull request. Empty: the full run, as on a pull request.
  workflow_dispatch:
    inputs:
      e2e_groups:
        description: 'End-to-end groups only, comma-separated (route-w, route-d, route-s, route-b, gmp-batches, own-demotab, own-p3, p3-demo, library-wg-fc, library-dc, library-rabe-ec, library-caps, library-softgel, library-inj-vial, rest); empty = the full run'
        required: false
        default: ''
        type: string
      runner:
        description: 'Where this run goes, for this run only (github, ubicloud, pod, pod-all); empty = the repository variable CI_RUNNER'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# The runner of this run: the run-by-hand input `runner`, else the repository variable CI_RUNNER (the scripts in tools/ci
# read EBMR_CI_HOST: 'ubicloud' is a one-job VM of GitHub's image, like a GitHub-hosted runner).
env:
  EBMR_CI_HOST: ${{ (inputs.runner || vars.CI_RUNNER) == 'github' && 'github' || (inputs.runner || vars.CI_RUNNER) == 'ubicloud' && 'ubicloud' || 'pod' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Where the jobs run: CI_RUNNER 'ubicloud' (or the run-by-hand input runner=ubicloud) puts only the long jobs on
# Ubicloud's managed runners (the Ubicloud GitHub app on this repository; owner): the end-to-end groups on
# ubicloud-standard-4-ubuntu-2204 and the golden batches on ubicloud-standard-8-ubuntu-2204, with the two short jobs the
# end-to-end groups wait on (code or docs only, the end-to-end plan) on ubicloud-standard-2-ubuntu-2204 so they never wait
# in GitHub's queue. Everything else (the static checks, the eight test shards, supply chain, the reports, traceability)
# runs on GitHub-hosted
# ubuntu-latest, whose minutes cost nothing here; the shards finish within the end-to-end wall time. Each job names its
# label in its own `runs-on` (a literal size: `runs-on` cannot read the job's id, github.job is empty there, and a label
# with no size never starts; tools/register/test/ci-runners.test.ts checks every job's label). Ubicloud's VMs use
# GitHub's Ubuntu 22.04 image (its PostgreSQL is 14, so tools/ci/start-postgres.sh installs 16 from PGDG) and serve one
# job each, so the scripts in tools/ci treat them as GitHub-hosted (EBMR_CI_HOST). mutation.yml follows the same switch
# (standard-8, on its schedule or by hand only).
# Otherwise the heavy jobs (the end-to-end groups and the golden batches) run on the owner's self-hosted RunPod pod
# (runner label ebmr-pod: eight runners, pod-1 ... pod-8, on one 32-vCPU machine) and every other job (the static
# checks, the eight test shards, supply chain, code or docs only, the end-to-end plan, the reports, traceability) on
# GitHub-hosted ubuntu-latest (owner: heavy jobs on the good machine, light ones elsewhere; the pod's eight runners were
# the queue). With the repository variable CI_RUNNER 'github' every job runs on GitHub-hosted ubuntu-latest, exactly as
# before the pod. Set CI_RUNNER=github (Settings > Secrets and variables > Actions >
# Variables) while the pod is stopped, and delete it (or set it to anything else) when the pod is back; a job queued
# for the pod while it is stopped waits until it returns.
# CI_RUNNER 'pod-all' (or runner=pod-all) puts EVERY job on the pod, as before #156: for when GitHub-hosted runners are
# unavailable (lead, 8 Nov: billing). The light jobs' steps already handle the pod (runner-env.sh, start-postgres.sh,
# the shards' worker cap by runner.environment); the heavy jobs fall through to the pod in that mode as in pod mode.
# The pod differs from a GitHub-hosted runner in what the scripts in tools/ci handle: eight jobs share one machine and
# one user, so each job gets its own PostgreSQL cluster on a free port in its temporary directory
# (tools/ci/start-postgres.sh; on a GitHub-hosted runner the runner's own cluster, as before), each runner its own HOME
# and Playwright browsers (tools/ci/runner-env.sh), and the apt part of Playwright's --with-deps is serialised
# (tools/ci/playwright-install.sh). Each test shard runs 4 Vitest workers there (8 runners x 4 = the 32 vCPUs); a
# GitHub-hosted runner keeps Vitest's default.

jobs:
  checks:
    name: Static checks (typecheck, lint, boundaries, pins, register, web build)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_groups == '' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm pins:check
      - run: pnpm register:validate
      # The handbook's generated pages (code map, database catalogue, control map, error codes) are not committed: the
      # run writes them (failing on any handbook problem) and keeps them as an artifact.
      - run: pnpm handbook
      - name: Keep the generated handbook pages
        uses: actions/upload-artifact@v4
        with:
          name: handbook-generated
          path: |
            docs/handbook/code-map.md
            docs/handbook/reference/db-catalogue.md
            docs/handbook/reference/control-map.md
            docs/handbook/reference/error-codes.md
          retention-days: 14
      # A node built-in in the browser bundle fails the build (plan section 3).
      - run: pnpm build:web

  # Phase 7 slice 7d (ASVS V10.3, V14.2; docs/security/pentest-checklist.md): the dependency audit of what ships (a
  # known high or critical advisory in a production dependency fails the job; the development tools' advisories are
  # reported), the licence and secret scans, and the SBOM and release manifest signed with the release key. Without the
  # EBMR_RELEASE_SIGNING_KEY secret (a KMS-held key at deployment) the run signs with a DEMO-ONLY key made for it, and the
  # manifest says so; the signatures are verified before they are kept.
  supply-chain:
    name: Supply chain (dependency audit, licences, secrets, SBOM, signed manifest)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_groups == '' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies; high and critical fail)
        run: pnpm audit --prod --audit-level=high
      - name: Dependency audit of the development tools (reported, not shipped)
        run: pnpm audit --json > .reports-audit-dev.json || true
      - run: pnpm security:licences --out .reports/security
      - run: pnpm security:secrets --out .reports/security
      - name: SBOM and release manifest, signed
        env:
          EBMR_RELEASE_SIGNING_KEY: ${{ secrets.EBMR_RELEASE_SIGNING_KEY }}
        run: pnpm security:release --out .reports/release
      - run: pnpm security:verify --dir .reports/release
      - name: Keep the SBOM, the signed manifest and the scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            .reports/release
            .reports/security
            .reports-audit-dev.json
          include-hidden-files: true
          if-no-files-found: warn

  tests:
    name: Tests (shard ${{ matrix.shard }} of 8)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_groups == '' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    # The whole suite (about 2,700 tests, mostly against PostgreSQL) took 55 minutes on one 2-core runner at the end
    # of Phase 2 (run 37980059094), next to the job's 60-minute limit. Four shards, each with its own PostgreSQL,
    # run every test once; the report job merges their blob reports into the one Vitest report the trace reads.
    # Six shards since Phase 6 (16 October): with slices 6a to 6i the slowest of four reached the 45-minute limit.
    # Eight since Phase 7 slice 7p (23 October): the slowest of six took 40 minutes on main and passed 45 with 7p.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      # The migration-order check (tools/register/test/migration-order.test.ts, 6jc-R4) compares the branch's
      # migrations with origin/main's tree; the shallow checkout of a pull request does not hold it. One commit of
      # main is enough (only its tree is read); on GitHub Actions the test fails, not skips, without it.
      - name: Fetch origin/main for the migration-order check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # PostgreSQL 16 with pg_hba allowing replication from localhost: the physical-copy reproducer (review/f55) takes a
      # pg_basebackup of the running cluster and starts the copy with these binaries. GitHub-hosted: the runner's own
      # cluster on 5432; the pod: this job's own cluster (tools/ci/start-postgres.sh). Sets EBMR_PG_ADMIN_URL.
      - name: Start PostgreSQL 16
        run: bash tools/ci/start-postgres.sh start
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/8 ${{ runner.environment == 'self-hosted' && '--maxWorkers=4' || '' }} --reporter=default --reporter=blob --outputFile.blob=.vitest-blobs/blob-${{ matrix.shard }}.json
      - name: Stop PostgreSQL
        if: always()
        run: bash tools/ci/start-postgres.sh stop
      - name: Upload the group's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-blobs/blob-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error

  # The golden batches (Phase 3 slice 6c, D-S6-6): their PostgreSQL runs under a faked clock on its own cluster, so a
  # batch of many hours runs in minutes; the test moves the offset file forward only, and nothing in the GMP code reads
  # a test clock. The other jobs never preload the clock library; their golden tests do not run (runIf EBMR_FAKETIME_FILE).
  golden:
    name: Golden batches (golden clock cluster)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_groups == '' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'github' && 'ubuntu-latest' || (inputs.runner || vars.CI_RUNNER) == 'ubicloud' && 'ubicloud-standard-8-ubuntu-2204' || 'ebmr-pod' }}
    # GB-T-01 about 20 minutes on the runner, GB-T-02 about 5, GB-T-03 (slice 6j-b) about 8.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      # The golden clock library (tools/dev-env/golden-clock, slice 6j-b) in place of libfaketime, which reads its file
      # with fopen inside time calls PostgreSQL makes from its SIGALRM handler and so corrupted backends' heaps.
      # GitHub-hosted: a Debian cluster `golden` on 5433 whose environment file preloads it; the pod: this job's own
      # cluster started with it preloaded (tools/ci/start-postgres.sh --golden). Sets EBMR_PG_ADMIN_URL,
      # EBMR_FAKETIME_FILE and EBMR_GOLDEN_CLOCK_LIB (GB-T-03, slice 6j-b, starts its simulators and the site gateway
      # under the same clock library: connected.ts).
      - name: Start a PostgreSQL 16 cluster under the golden clock library
        run: bash tools/ci/start-postgres.sh start --golden
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One file at a time: the clock file is shared, and GB-T-01 (slice 6d) freezes it while the clock test reads it as
      # an offset.
      - run: pnpm vitest run apps/tablets-server/test/golden --no-file-parallelism --reporter=default --reporter=json --outputFile.json=.reports/vitest-golden.json
      - name: Stop PostgreSQL
        if: always()
        run: bash tools/ci/start-postgres.sh stop
      # The golden results are read by the trace beside the shards' report (tools/register cli --golden), so a clause
      # proven only by a golden batch counts (Phase 4 slice 7: GB-T-01 continued to release proves IN-16 and PR-22).
      - name: Upload the golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-golden
          path: .reports/vitest-golden.json
          include-hidden-files: true
          if-no-files-found: error

  # Keeps the name of the single Phase 2 job, so a required status check still finds it; it passes only when the
  # static checks and every test shard passed and the trace accepts the merged report.
  report:
    name: Typecheck, lint, boundaries, register, web build, tests, traceability
    needs: [checks, tests, golden]
    # Runs when a shard failed (to merge and summarise what did run) but not when the run was cancelled, for example by
    # a newer push to the same branch: there is nothing to report then; nor on a run of chosen end-to-end groups only.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.e2e_groups == '') }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Blob reports of the test shards
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-blobs
          merge-multiple: true
      # A missing shard fails here: the trace below must see every test of the suite.
      - name: Merge the shard reports into .reports/vitest.json
        run: |
          test "$(ls .vitest-blobs/blob-*.json | wc -l)" -eq 8
          # On the pod each runner works in its own folder (/workspace/runners/pod-N/_work/ebmr/ebmr), and a shard's
          # blob names its files from there; rewritten to this job's workspace, every file is named from the repository
          # root as on GitHub-hosted runners, where they all share one path (a no-op there).
          sed -i -E "s#/workspace/runners/[^/\"]+/_work/ebmr/ebmr#${GITHUB_WORKSPACE}#g" .vitest-blobs/blob-*.json
          mkdir -p .reports
          pnpm vitest run --mergeReports=.vitest-blobs --reporter=json --outputFile=.reports/vitest.json
      # The stamp beside each report (R3-VAL-2): the commit checked out here (every job of a run checks out the same
      # one), whether the tree is clean, and the report's SHA-256. The evidence bundle takes only a report stamped on
      # its commit, from a clean tree, for those bytes; a stale report is refused.
      - name: Stamp the Vitest report
        if: ${{ !cancelled() && hashFiles('.reports/vitest.json') != '' }}
        run: pnpm -s validation:stamp .reports/vitest.json
      - name: Failed tests (summary)
        if: failure()
        run: |
          node -e '
            const r = require("./.reports/vitest.json");
            for (const f of r.testResults) for (const t of f.assertionResults)
              if (t.status === "failed") console.log(`FAILED ${f.name.replace(process.cwd() + "/", "")} > ${t.fullName}\n  ${(t.failureMessages || []).join("\n").split("\n").slice(0, 12).join("\n  ")}`);
            console.log(`${r.numFailedTests} failed, ${r.numPassedTests} passed, ${r.numTotalTests} total`);
          '
      - name: The static checks, every shard and the golden batches passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.tests.result }}" = success && test "${{ needs.golden.result }}" = success
      # The Vitest report alone: listed end-to-end tests are checked against a run in the traceability job below.
      - name: Golden-batch report of the golden job
        uses: actions/download-artifact@v4
        with:
          name: vitest-golden
          path: .reports
      # The golden job ran on another pod runner: its report names files from that runner's folder (see the merge above).
      - run: sed -i -E "s#/workspace/runners/[^/\"]+/_work/ebmr/ebmr#${GITHUB_WORKSPACE}#g" .reports/vitest-golden.json
      # Stamped after the rewrite above, which changes its bytes (same run, same commit as the golden job).
      - run: pnpm -s validation:stamp .reports/vitest-golden.json
      - run: pnpm trace --require-golden
      - name: OpenAPI document of the frozen contract
        run: pnpm openapi
      - name: Upload traceability matrix and OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix
          # Named files, as the e2e job does: given the hidden directory itself (.reports/), upload-artifact v4 finds
          # no files (hidden files are left out by default) and, with ignore, uploads nothing; the traceability job
          # downloads this artifact for vitest.json.
          path: |
            .reports/vitest.json
            .reports/vitest.json.stamp.json
            .reports/vitest-golden.json
            .reports/vitest-golden.json.stamp.json
            .reports/trace-matrix.md
            .reports/openapi.json
          if-no-files-found: ignore

  # The end-to-end groups of this run: all of them, or on a run by hand the ones its e2e_groups input names (an unknown
  # name fails here). The full list is the e2e job's matrix as it was; a new group is added here.
  # Cost (owner): a pull request that changes only Markdown files outside test folders skips the end-to-end groups (most
  # of the Ubicloud minutes). The static checks, every test shard, the golden batches and the Vitest trace still run:
  # many tests and the handbook check read Markdown. A push to main and a run by hand always run everything.
  changes:
    name: Code or docs only
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || (inputs.runner || vars.CI_RUNNER) == 'ubicloud' && 'ubicloud-standard-2-ubuntu-2204' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/ci/changes.sh

  e2e-plan:
    name: End-to-end groups to run
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || (inputs.runner || vars.CI_RUNNER) == 'ubicloud' && 'ubicloud-standard-2-ubuntu-2204' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - id: plan
        env:
          ALL: route-w route-d route-s route-b gmp-batches own-demotab own-p3 p3-demo library-wg-fc library-dc library-rabe-ec library-caps library-softgel library-inj-vial rest
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_groups || '' }}
        run: |
          set -euo pipefail
          want=$(echo "$CHOSEN" | tr ',' ' ' | xargs)
          [ -n "$want" ] || want="$ALL"
          json=""
          for g in $want; do
            case " $ALL " in *" $g "*) ;; *) echo "::error::unknown end-to-end group '$g' (known: $ALL)"; exit 1 ;; esac
            json="$json${json:+,}\"$g\""
          done
          echo "groups=[$json]" >> "$GITHUB_OUTPUT"
          echo "end-to-end groups: [$json]"

  e2e:
    name: End-to-end (Playwright, chromium, ${{ matrix.group }})
    needs: [e2e-plan]
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'github' && 'ubuntu-latest' || (inputs.runner || vars.CI_RUNNER) == 'ubicloud' && 'ubicloud-standard-4-ubuntu-2204' || 'ebmr-pod' }}
    # 45: the set-up builds the release path through real signed acts (Phase 4 slice 7b), about 10 minutes more.
    # In groups since slice 7k (P7K-5): one job passed 74 tests and still reached 75 minutes. Each group runs the global
    # set-up on its own PostgreSQL and the spec files tools/e2e/playwright.config.ts (E2E_GROUPS) names; 'rest' runs
    # every other spec. A file is never split, so its tests keep their order. A new group is added in both places.
    # 150 since slice 7r: the own-demotab group runs Demotab from its materials to the released lot (its sandbox test
    # runs, the GMP batch and its packaging order, QC, review and release) in one file, about 80 minutes of tests.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-plan.outputs.groups) }}
    env:
      CI: 'true'
      EBMR_E2E_BLOB: '1'
      EBMR_E2E_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      # PostgreSQL 16 as in the tests job (not a service container): the runner's own, or on the pod this job's own.
      - name: Start PostgreSQL 16
        run: bash tools/ci/start-postgres.sh start
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright 1.56.1 installs chromium revision 1194, the one preinstalled on the development machine. On the pod
      # into this runner's own browsers directory, with the apt part serialised across the eight runners.
      - name: Playwright chromium and its system libraries
        run: bash tools/ci/playwright-install.sh
      - run: pnpm --filter @ebmr/e2e test --pass-with-no-tests
      - name: Stop PostgreSQL
        if: always()
        run: bash tools/ci/start-postgres.sh stop
      - name: Upload the group's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.group }}
          path: .reports/blob/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload the group's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.group }}
          path: .reports/playwright-output/
          include-hidden-files: true
          if-no-files-found: ignore

  # The groups' blob reports merged into the reports of one run (P7K-5): .reports/playwright.json for the trace and
  # .reports/e2e-evidence.json for the validation pack. A missing group leaves its tests out, and the trace fails on them.
  e2e-report:
    name: End-to-end reports merged
    needs: [e2e-plan, e2e]
    if: ${{ !cancelled() && needs.e2e-plan.result == 'success' }}
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Blob reports of the end-to-end groups
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: .reports/blob
          merge-multiple: true
      - run: pnpm --filter @ebmr/e2e exec playwright merge-reports --config merge.config.ts ../../.reports/blob
      # Its stamp (R3-VAL-2; see the report job).
      - name: Stamp the Playwright report
        if: ${{ !cancelled() && hashFiles('.reports/playwright.json') != '' }}
        run: pnpm -s validation:stamp .reports/playwright.json
      - name: Upload end-to-end reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            .reports/playwright.json
            .reports/playwright.json.stamp.json
            .reports/e2e-evidence.json
          if-no-files-found: ignore

  # The trace on both reports (review F15, round 2): every end-to-end test a control lists ran, and every passing
  # end-to-end test tagged with a control is in its list. The Playwright report is required here.
  traceability:
    name: Traceability with the end-to-end results
    needs: [checks, report, e2e-report]
    runs-on: ${{ (inputs.runner || vars.CI_RUNNER) == 'pod-all' && 'ebmr-pod' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Per-runner directories (self-hosted pod)
        run: bash tools/ci/runner-env.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest report of the report job
        uses: actions/download-artifact@v4
        with:
          name: trace-matrix
          path: .reports
      - name: Playwright report of the e2e job
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: .reports
      # The reports were written on other pod runners (the Playwright report's rootDir, the Vitest files): their
      # folders become this job's workspace, as in the report job (a no-op on GitHub-hosted runners).
      - run: sed -i -E "s#/workspace/runners/[^/\"]+/_work/ebmr/ebmr#${GITHUB_WORKSPACE}#g" .reports/*.json
      - run: pnpm trace:e2e
      - name: Upload the traceability matrix with the end-to-end results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix-e2e
          path: .reports/trace-matrix.md
          if-no-files-found: ignore
