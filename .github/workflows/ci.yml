name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, boundaries, register, web build, tests, traceability
    runs-on: ubuntu-latest
    # Phase 2 adds the web build and the application suites to the Phase 1 checks. The suite (about 2,600 tests,
    # mostly against PostgreSQL) takes about 13 minutes on 4 cores and about twice that on a 2-core runner; with
    # typecheck and lint the job ran past 30 minutes, so it has 60.
    timeout-minutes: 60
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The runner's own PostgreSQL 16 (Debian layout, pg_hba allows replication from localhost): the physical-copy
      # reproducer (review/f55) takes a pg_basebackup of the running cluster and starts the copy with these binaries.
      - name: Start PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role ebmr_dev superuser login password 'ebmr_dev'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm pins:check
      - run: pnpm register:validate
      # A node built-in in the browser bundle fails the build (plan section 3).
      - run: pnpm build:web
      - run: pnpm test:json
      - name: Failed tests (summary)
        if: failure()
        run: |
          node -e '
            const r = require("./.reports/vitest.json");
            for (const f of r.testResults) for (const t of f.assertionResults)
              if (t.status === "failed") console.log(`FAILED ${f.name.replace(process.cwd() + "/", "")} > ${t.fullName}\n  ${(t.failureMessages || []).join("\n").split("\n").slice(0, 12).join("\n  ")}`);
            console.log(`${r.numFailedTests} failed, ${r.numPassedTests} passed, ${r.numTotalTests} total`);
          '
      - run: pnpm trace
      - name: OpenAPI document of the frozen contract
        run: pnpm openapi
      - name: Upload traceability matrix and OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix
          path: .reports/
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      # The runner's own PostgreSQL 16, as in the checks job (not a service container).
      - name: Start PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role ebmr_dev superuser login password 'ebmr_dev'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright 1.56.1 installs chromium revision 1194, the one preinstalled on the development machine.
      - run: pnpm --filter @ebmr/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @ebmr/e2e test
      - name: Upload end-to-end reports, evidence and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            .reports/playwright.json
            .reports/e2e-evidence.json
            .reports/playwright-output/
          if-no-files-found: ignore
