name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks (typecheck, lint, boundaries, pins, register, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm pins:check
      - run: pnpm register:validate
      # A node built-in in the browser bundle fails the build (plan section 3).
      - run: pnpm build:web

  # Phase 7 slice 7d (ASVS V10.3, V14.2; docs/security/pentest-checklist.md): the dependency audit of what ships (a
  # known high or critical advisory in a production dependency fails the job; the development tools' advisories are
  # reported), the licence and secret scans, and the SBOM and release manifest signed with the release key. Without the
  # EBMR_RELEASE_SIGNING_KEY secret (a KMS-held key at deployment) the run signs with a DEMO-ONLY key made for it, and the
  # manifest says so; the signatures are verified before they are kept.
  supply-chain:
    name: Supply chain (dependency audit, licences, secrets, SBOM, signed manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production dependencies; high and critical fail)
        run: pnpm audit --prod --audit-level=high
      - name: Dependency audit of the development tools (reported, not shipped)
        run: pnpm audit --json > .reports-audit-dev.json || true
      - run: pnpm security:licences --out .reports/security
      - run: pnpm security:secrets --out .reports/security
      - name: SBOM and release manifest, signed
        env:
          EBMR_RELEASE_SIGNING_KEY: ${{ secrets.EBMR_RELEASE_SIGNING_KEY }}
        run: pnpm security:release --out .reports/release
      - run: pnpm security:verify --dir .reports/release
      - name: Keep the SBOM, the signed manifest and the scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            .reports/release
            .reports/security
            .reports-audit-dev.json
          include-hidden-files: true
          if-no-files-found: warn

  tests:
    name: Tests (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    # The whole suite (about 2,700 tests, mostly against PostgreSQL) took 55 minutes on one 2-core runner at the end
    # of Phase 2 (run 37980059094), next to the job's 60-minute limit. Four shards, each with its own PostgreSQL,
    # run every test once; the report job merges their blob reports into the one Vitest report the trace reads.
    # Six shards since Phase 6 (16 October): with slices 6a to 6i the slowest of four reached the 45-minute limit.
    # Eight since Phase 7 slice 7p (23 October): the slowest of six took 40 minutes on main and passed 45 with 7p.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The migration-order check (tools/register/test/migration-order.test.ts, 6jc-R4) compares the branch's
      # migrations with origin/main's tree; the shallow checkout of a pull request does not hold it. One commit of
      # main is enough (only its tree is read); on GitHub Actions the test fails, not skips, without it.
      - name: Fetch origin/main for the migration-order check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # The runner's own PostgreSQL 16 (Debian layout, pg_hba allows replication from localhost): the physical-copy
      # reproducer (review/f55) takes a pg_basebackup of the running cluster and starts the copy with these binaries.
      - name: Start PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role ebmr_dev superuser login password 'ebmr_dev'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=blob --outputFile.blob=.vitest-blobs/blob-${{ matrix.shard }}.json
      - name: Upload the group's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-blobs/blob-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error

  # The golden batches (Phase 3 slice 6c, D-S6-6): their PostgreSQL runs under a faked clock on its own cluster, so a
  # batch of many hours runs in minutes; the test moves the offset file forward only, and nothing in the GMP code reads
  # a test clock. The other jobs never preload the clock library; their golden tests do not run (runIf EBMR_FAKETIME_FILE).
  golden:
    name: Golden batches (golden clock cluster)
    runs-on: ubuntu-latest
    # GB-T-01 about 20 minutes on the runner, GB-T-02 about 5, GB-T-03 (slice 6j-b) about 8.
    timeout-minutes: 60
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5433/postgres
      EBMR_FAKETIME_FILE: /var/lib/postgresql/faketime-golden/offset
      # GB-T-03 (slice 6j-b) starts its simulators and the site gateway under the same clock library (connected.ts).
      EBMR_GOLDEN_CLOCK_LIB: /usr/local/lib/ebmr/golden-clock.so
    steps:
      - uses: actions/checkout@v4
      # The golden clock library (tools/dev-env/golden-clock, slice 6j-b) in place of libfaketime, which reads its file
      # with fopen inside time calls PostgreSQL makes from its SIGALRM handler and so corrupted backends' heaps.
      - name: Start a PostgreSQL 16 cluster under the golden clock library
        run: |
          sudo install -d -m 0755 /usr/local/lib/ebmr
          bash tools/dev-env/golden-clock/build.sh "$RUNNER_TEMP/golden-clock.so"
          sudo install -m 0755 "$RUNNER_TEMP/golden-clock.so" /usr/local/lib/ebmr/golden-clock.so
          sudo pg_createcluster 16 golden --port 5433 --locale C.UTF-8
          sudo install -d -m 0777 /var/lib/postgresql/faketime-golden
          echo '+0s' | sudo tee "$EBMR_FAKETIME_FILE" > /dev/null
          sudo chmod 0666 "$EBMR_FAKETIME_FILE"
          printf "LD_PRELOAD = '%s'\nFAKETIME_TIMESTAMP_FILE = '%s'\n" \
            /usr/local/lib/ebmr/golden-clock.so "$EBMR_FAKETIME_FILE" | sudo tee -a /etc/postgresql/16/golden/environment
          sudo pg_ctlcluster 16 golden start
          until pg_isready -h localhost -p 5433; do sleep 1; done
          sudo -u postgres psql -p 5433 -v ON_ERROR_STOP=1 -c "create role ebmr_dev superuser login password 'ebmr_dev'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One file at a time: the clock file is shared, and GB-T-01 (slice 6d) freezes it while the clock test reads it as
      # an offset.
      - run: pnpm vitest run apps/tablets-server/test/golden --no-file-parallelism --reporter=default --reporter=json --outputFile.json=.reports/vitest-golden.json
      # The golden results are read by the trace beside the shards' report (tools/register cli --golden), so a clause
      # proven only by a golden batch counts (Phase 4 slice 7: GB-T-01 continued to release proves IN-16 and PR-22).
      - name: Upload the golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-golden
          path: .reports/vitest-golden.json
          include-hidden-files: true
          if-no-files-found: error

  # Keeps the name of the single Phase 2 job, so a required status check still finds it; it passes only when the
  # static checks and every test shard passed and the trace accepts the merged report.
  report:
    name: Typecheck, lint, boundaries, register, web build, tests, traceability
    needs: [checks, tests, golden]
    # Runs when a shard failed (to merge and summarise what did run) but not when the run was cancelled, for example by
    # a newer push to the same branch: there is nothing to report then.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Blob reports of the test shards
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-blobs
          merge-multiple: true
      # A missing shard fails here: the trace below must see every test of the suite.
      - name: Merge the shard reports into .reports/vitest.json
        run: |
          test "$(ls .vitest-blobs/blob-*.json | wc -l)" -eq 8
          mkdir -p .reports
          pnpm vitest run --mergeReports=.vitest-blobs --reporter=json --outputFile=.reports/vitest.json
      - name: Failed tests (summary)
        if: failure()
        run: |
          node -e '
            const r = require("./.reports/vitest.json");
            for (const f of r.testResults) for (const t of f.assertionResults)
              if (t.status === "failed") console.log(`FAILED ${f.name.replace(process.cwd() + "/", "")} > ${t.fullName}\n  ${(t.failureMessages || []).join("\n").split("\n").slice(0, 12).join("\n  ")}`);
            console.log(`${r.numFailedTests} failed, ${r.numPassedTests} passed, ${r.numTotalTests} total`);
          '
      - name: The static checks, every shard and the golden batches passed
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.tests.result }}" = success && test "${{ needs.golden.result }}" = success
      # The Vitest report alone: listed end-to-end tests are checked against a run in the traceability job below.
      - name: Golden-batch report of the golden job
        uses: actions/download-artifact@v4
        with:
          name: vitest-golden
          path: .reports
      - run: pnpm trace --require-golden
      - name: OpenAPI document of the frozen contract
        run: pnpm openapi
      - name: Upload traceability matrix and OpenAPI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix
          # Named files, as the e2e job does: given the hidden directory itself (.reports/), upload-artifact v4 finds
          # no files (hidden files are left out by default) and, with ignore, uploads nothing; the traceability job
          # downloads this artifact for vitest.json.
          path: |
            .reports/vitest.json
            .reports/vitest-golden.json
            .reports/trace-matrix.md
            .reports/openapi.json
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright, chromium, ${{ matrix.group }})
    runs-on: ubuntu-latest
    # 45: the set-up builds the release path through real signed acts (Phase 4 slice 7b), about 10 minutes more.
    # In groups since slice 7k (P7K-5): one job passed 74 tests and still reached 75 minutes. Each group runs the global
    # set-up on its own PostgreSQL and the spec files tools/e2e/playwright.config.ts (E2E_GROUPS) names; 'rest' runs
    # every other spec. A file is never split, so its tests keep their order. A new group is added in both places.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [route-w, route-d, route-s, route-b, gmp-batches, rest]
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
      CI: 'true'
      EBMR_E2E_BLOB: '1'
      EBMR_E2E_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      # The runner's own PostgreSQL 16, as in the checks job (not a service container).
      - name: Start PostgreSQL 16
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "create role ebmr_dev superuser login password 'ebmr_dev'"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright 1.56.1 installs chromium revision 1194, the one preinstalled on the development machine.
      - run: pnpm --filter @ebmr/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @ebmr/e2e test --pass-with-no-tests
      - name: Upload the group's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.group }}
          path: .reports/blob/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload the group's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.group }}
          path: .reports/playwright-output/
          include-hidden-files: true
          if-no-files-found: ignore

  # The groups' blob reports merged into the reports of one run (P7K-5): .reports/playwright.json for the trace and
  # .reports/e2e-evidence.json for the validation pack. A missing group leaves its tests out, and the trace fails on them.
  e2e-report:
    name: End-to-end reports merged
    needs: [e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Blob reports of the end-to-end groups
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: .reports/blob
          merge-multiple: true
      - run: pnpm --filter @ebmr/e2e exec playwright merge-reports --config merge.config.ts ../../.reports/blob
      - name: Upload end-to-end reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            .reports/playwright.json
            .reports/e2e-evidence.json
          if-no-files-found: ignore

  # The trace on both reports (review F15, round 2): every end-to-end test a control lists ran, and every passing
  # end-to-end test tagged with a control is in its list. The Playwright report is required here.
  traceability:
    name: Traceability with the end-to-end results
    needs: [checks, report, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest report of the report job
        uses: actions/download-artifact@v4
        with:
          name: trace-matrix
          path: .reports
      - name: Playwright report of the e2e job
        uses: actions/download-artifact@v4
        with:
          name: e2e-reports
          path: .reports
      - run: pnpm trace:e2e
      - name: Upload the traceability matrix with the end-to-end results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-matrix-e2e
          path: .reports/trace-matrix.md
          if-no-files-found: ignore
