name: Mutation testing

# Full mutation runs are too slow for every pull request (build outline 9.1: incremental in CI,
# full weekly). This workflow runs them weekly and on demand: StrykerJS on the kernel's TypeScript
# logic, and the SQL mutation harness on the database-enforced guards, one job per group.

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      groups:
        description: 'SQL groups to run, comma-separated (empty: every group)'
        required: false
        default: ''
      typescript:
        description: 'Also run StrykerJS on the kernel TypeScript'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  typescript:
    name: StrykerJS (kernel TypeScript)
    # The weekly run always; a run started by hand only when asked for.
    if: github.event_name == 'schedule' || inputs.typescript
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebmr_dev
          POSTGRES_PASSWORD: ebmr_dev
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ebmr_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation:ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-ts
          path: .reports/mutation/
          include-hidden-files: true
          if-no-files-found: ignore

  sql:
    name: SQL guards (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # checks: write for the check run each group's report is published as (readable through the API, unlike the
    # artifact, whose download redirects to a blob host).
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # Every group of tools/sql-mutation/src/targets.ts (tools/sql-mutation/test/harness.test.ts checks the list).
        group: [audit-trail, actor-validation, signing, signature-invalidation, segregation-and-grants,
                authentication-events, retention-and-purge, site-values-and-policies, protected-numbers,
                mbr-lifecycle, market-authorisation-and-issue, execution-commands, execution-state-binding,
                evidence-source-and-entries, execution-steps-and-order, system-facts-and-time, exceptions-and-dispositions,
                limit-exceptions, involvement-and-independence, weighing, signed-content, sandbox-and-import,
                device-readings, evidence-listener, manual-weighing-gate, read-authorisation, tablets-sessions,
                designer-guards, site-zone, signing-failure-and-reasons, connection-roles, batch-number-register,
                stale-commands-and-readings, exception-source, entry-references-and-schema, late-witness-and-step-times,
                execution-row-shape, state-engine-rows,
                plant-equipment-and-areas, output-containers, change-paths-and-hand-over, gmp-batch-issue, lots-and-lims,
                deviations, erp-interfaces, reprocessing, formulas, process-devices-and-status, tablets-dispensing,
                tablets-granulation, tablets-compression, tablets-ipc, tablets-coating, tablets-forming,
                packaging-g21-rules, packaging-printing-and-serialisation, packaging-blister, packaging-bottle,
                platform-scope, tablets-core-checks, release-gate, release-gate-market-items, manufacturer-release,
                tablets-release-items, us-disposition, qp-certification, market-changes, after-release-suspension,
                after-release-decisions, shipping-interlock, record-lock-and-amendment, bulk-and-bright-stock,
                execution-complete-forms, india-licences, india-issue-gate, india-expiry, india-h2-and-allocation,
                records-evidence-export, records-contingency-forms, pqr-extract, inbound-adapters-and-mirrors,
                erp-wms-receipt-and-stock, qms-capa-lims-cmms, equipment-data-and-alarms, plant-rules,
                packaging-labels-and-line-completion, serialisation-l3, genealogy-and-recall, controlled-substance-mode,
                governance-change-control, governance-support-and-contract-giver, india-dsc, reporting-and-training,
                transfer-and-federation, analytics-foundation,
                analytics-method-change, analytics-inputs, analytics-audit,
                analytics-rate-inputs, analytics-review-inputs, analytics-profile-inputs, analytics-mspc-reference, analytics-exit,
                release-identity, gateway-feed-signature, plant-rule-approval, controlled-reads, batch-scope-remaining,
                full-export, evaluation-pack]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebmr_dev
          POSTGRES_PASSWORD: ebmr_dev
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ebmr_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EBMR_PG_ADMIN_URL: postgres://ebmr_dev:ebmr_dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A run started by hand with a list of groups runs only those; the other jobs end at once.
      - name: Mutation run
        id: mut
        if: inputs.groups == '' || inputs.groups == null || contains(format(',{0},', inputs.groups), format(',{0},', matrix.group))
        run: pnpm mutation:sql --group ${{ matrix.group }} --workers 2 --own-cluster --out .reports/sql-mutation/${{ matrix.group }}
      # The group's score, its row of summary.md and every mutant not killed, as a check run on the commit
      # (tools/sql-mutation/src/check-run.ts): success when the group met its threshold, neutral otherwise or without a
      # report, never failure; the job's own result stays the run's.
      - name: Publish the report as a check run
        if: always() && steps.mut.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm -s exec tsx tools/sql-mutation/src/check-run.ts ${{ matrix.group }} .reports/sql-mutation/${{ matrix.group }} ${{ github.sha }} > "$RUNNER_TEMP/payload.json"
          gh api repos/${{ github.repository }}/check-runs --input "$RUNNER_TEMP/payload.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-sql-${{ matrix.group }}
          path: .reports/sql-mutation/
          include-hidden-files: true
          if-no-files-found: ignore
