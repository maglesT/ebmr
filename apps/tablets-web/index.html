<!doctype html>
<html lang="en" data-density="office">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- react-aria injects an inline <style> for pressable elements unless this id exists; tokens.css carries the rule (strict CSP). -->
    <meta id="react-aria-pressable-style" name="ebmr-pressable-style" content="provided by tokens.css" />
    <title>Batchwright</title>
    <!-- Decision 0020: the Batchwright icon (docs/brand/batchwright-icon.svg) for the browser tab and the installed app. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D4553A" />
    <meta name="application-name" content="Batchwright" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
