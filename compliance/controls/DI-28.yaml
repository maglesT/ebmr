id: DI-28
title: Contemporaneous capture, immediate durable commit, late entries and offline buffering
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
