tests:
  - "apps/tablets-server/test/records/archive-routes.test.ts > archive over HTTP (slice 6b) > [DI-43][PR-16] a contingency pack issued for a running batch blocks completion until every sheet is used and verified or voided; the transcriber does not verify"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43] a batch with no contingency form issued reconciles trivially: nothing blocks its completion"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43][PR-16][PR-11] issue 3 contingency sheets and return 2: completion is blocked and the message names the sheet not reconciled"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43][PR-16] every sheet used and verified or voided, then the signed reconciliation: the batch may complete"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43] a sheet reported missing blocks completion and is voided only with the reference of the deviation raised for it"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43] the life cycle is enforced: no transcription without a reference, the transcriber does not verify, a used sheet is not voided"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43] a pack is issued only with the permission, its batch, template, destination and reason, 1 to 50 pages, and the stage at a stage start"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43][DI-35] the reconciliation is signed with FORMS_RECONCILED of the current forms by the person who records it"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43][DI-41] the contingency forms of a batch are copied as a true copy that verifies offline (records-schema tables named as the audit trail names them)"
  - "packages/kernel/test/records/contingency-forms.test.ts > contingency packs (kernel 1170) > [DI-43][INV-27] the tables are written only by the definers and the serial sequence is protected"
  - "apps/tablets-server/test/records/archive-routes.test.ts > archive over HTTP (slice 6b) > [DI-43][DI-35] QA signs the reconciliation (FORMS_RECONCILED); the batch may then complete as far as its paper forms go"
  - "packages/recipe-core/test/lifecycle/execution-complete-forms.test.ts > EXECUTION_COMPLETE waits for the contingency forms (DI-43, PR-16) > [DI-43][PR-16] a batch with no contingency form issued completes as before"
  - "packages/recipe-core/test/lifecycle/execution-complete-forms.test.ts > EXECUTION_COMPLETE waits for the contingency forms (DI-43, PR-16) > [DI-43][PR-16] completion is refused while a form is issued and not returned, returned and not verified, or reported missing without its deviation reference; it passes once every form is reconciled and FORMS_RECONCILED is signed"
  - "packages/recipe-core/test/lifecycle/execution-complete-forms.test.ts > EXECUTION_COMPLETE waits for the contingency forms (DI-43, PR-16) > [DI-43][PR-16] the application role cannot write the completion around the gate nor switch the gate off"
  - "apps/tablets-server/test/records/archive-routes.test.ts > archive over HTTP (slice 6b) > [DI-43] the database refuses a contingency pack for a batch that has ended, whoever calls it"
