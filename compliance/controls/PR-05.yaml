  - "packages/recipe-core/test/lifecycle/concurrency.test.ts > [INV-17][PR-05] a market activation racing the retirement of its version never leaves a retired version CURRENT"
  - "packages/recipe-core/test/lifecycle/issue.test.ts > [PR-05][INV-01] once v2 is CURRENT, a new batch cannot be pinned to v1"
  - "packages/recipe-core/test/lifecycle/issue.test.ts > [PR-05] a retired master blocks new batches; every executed record stays retrievable and verifiable"
  - "packages/recipe-core/test/lifecycle/issue.test.ts > [PR-05][INV-01] approving a successor needs a disposition for every issued or running batch of an earlier version"
  - "packages/recipe-core/test/lifecycle/machine.test.ts > [PR-02][PR-05][INV-04] every event in every state is accepted by the engine exactly when XState allows it"
  - "packages/recipe-core/test/lifecycle/market.test.ts > [INV-17][PR-05] the successor supersedes the predecessor for its market and scope in the same transaction; partial scope leaves the rest CURRENT"
  - "packages/recipe-core/test/lifecycle/market.test.ts > [PR-05][INV-17] withdrawal ends the authorisation; retirement ends every open authorisation and the version"
  - "packages/recipe-core/test/lifecycle/review-inventory.test.ts > [PR-05] an overdue review is on the overdue list (recipe.overdue_reviews) until the review is recorded"
  - "packages/recipe-core/test/lifecycle/review-inventory.test.ts > [PR-05] only approved versions are reviewed; a retired version leaves the overdue list"
  - "packages/recipe-core/test/lifecycle/review-inventory.test.ts > [PR-05][PR-02] the inventory export lists every version with ID, version, status and dates, and reconciles with the site document list"
  - "packages/recipe-core/test/lifecycle/review-inventory.test.ts > [PR-05] where-used lists the batches pinned to a version"
  - "packages/recipe-core/test/lifecycle/audit-reason.test.ts > the reason of a market-authorisation command (EBMR-AUDIT-002) > [DI-22][DI-24][PR-05][INV-17] a retirement needs the QA person's own reason, both halves, whether or not a cell is open: without them it is refused (EBMR-AUDIT-002), no cell ends and the version stays APPROVED; with both halves each cell update records them exactly"
  - "packages/recipe-core/test/lifecycle/audit-reason.test.ts > the reason of a market-authorisation command (EBMR-AUDIT-002) > [DI-22][DI-24][PR-05] a RETIRE made directly through the engine (platform.transition, open to the application role) needs the QA person's own reason, both halves, as recipe.retire_version does: without them the guard refuses it, the version stays APPROVED and no audit entry remains; with both halves the state row's audit entry and history record exactly that reason, and none the engine wrote"
  - "packages/recipe-core/test/lifecycle/audit-reason.test.ts > the reason of a life-cycle transition of an MBR version (kernel 0960, recipe-core 0301) > [DI-22][DI-24][PR-05] a WITHDRAW of an APPROVED version that was never authorised, made through platform.transition (lc.withdrawVersion), needs the QA person's own reason, both halves: without them the kernel guard and the recipe guard both refuse it, the version stays APPROVED and no audit entry remains; with both halves the state row's audit entry and history record exactly that reason, and none the engine wrote"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > the activation and withdrawal of a market authorisation > [INV-17][PR-02][PR-05] validity starts at the effective instant: a version serves from exactly then, an authorisation withdrawn before it starts never does, a record is withdrawn once"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > the activation and withdrawal of a market authorisation > [INV-17][PR-05] a version is CURRENT once per market and scope; its successor may take effect at the predecessor's start but never before it"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > the selection at issue (recipe.select_version_for_issue, recipe.valid_cells, recipe.version_state_at) > [INV-01][PR-05] the state of a version at an instant counts a transition made at exactly that instant"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > an issue racing the market authorisation or the retirement of its family > [INV-01][PR-05] an issue racing the retirement of its version waits for it and is refused"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > in-flight dispositions of an earlier version's batches (recipe.record_in_flight_disposition, recipe.in_flight_disposition_guard, mbr_version.in_flight_dispositioned) > [PR-05][INV-01] a disposition names a known successor and an issued or running batch pinned to an earlier version of the same family"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > in-flight dispositions of an earlier version's batches (recipe.record_in_flight_disposition, recipe.in_flight_disposition_guard, mbr_version.in_flight_dispositioned) > [PR-05][INV-01] the successor is approved only once every issued or running batch of an earlier version has a disposition of its own; a withdrawn successor takes none"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > in-flight dispositions of an earlier version's batches (recipe.record_in_flight_disposition, recipe.in_flight_disposition_guard, mbr_version.in_flight_dispositioned) > [PR-05][INV-01][INV-17] no batch is pinned to the version under approval: with a forged APPROVED history row, the activation and the cell written around the command for it are refused and the issue finds no version; a batch of that version, on the state planted with every trigger off, is no batch of an earlier version: it takes no in-flight disposition and the approval does not wait for one"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > periodic review and the overdue list (recipe.record_periodic_review, recipe.overdue_reviews) > [PR-05] a review names a known version and a next due date after today; the overdue list shows whether a version is in use and when it was last reviewed"
  - "packages/recipe-core/test/mutation/mbr-lifecycle.test.ts > the table guards of the MBR version, content, draft cycle and evidence hold for owner-level writers > [PR-05][INV-04] the identity of a version (id, family, number, author, predecessor) never changes, whichever column is rewritten (EBMR-RCP-024)"
  - "packages/recipe-core/test/mutation/mbr-lifecycle.test.ts > the guards of the version machine, on the version they are asked about > [PR-05] the periodic-review due date is after the effective date in the site zone: the same day is refused, the next day accepted"
  - "packages/recipe-core/test/mutation/market-authorisation-and-issue.test.ts > D10: an activation and its cells are written only as the activation command writes them, whoever writes them (recipe.market_authorisation_activation_guard, recipe.authorisation_cell_activation_guard) > [INV-17][PR-05][PR-04] a cell is refused for a version that is not APPROVED, for a withdrawn record, when it supersedes anything but its predecessor ending where it begins, when its predecessor names a cell written before it, and for a BRIDGING the successor did not supersede; the command's own supersession, written by an owner-level writer, is accepted"
clauses:
