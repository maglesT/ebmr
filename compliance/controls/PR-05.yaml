id: PR-05
title: Master versioning, supersession, periodic review, retirement and document inventory
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 98
  - 627
  - 217
sources: "US: 211.100(a); 211.186(a); 211.68(b) | EU: Ch.4 4.3; 4.5; 4.20; 4.21; 4.32; Annex 11 section 10 | ICH/EMA/draft: ICH Q10 1.6.1 and 3.1 (s)"
behaviour: |-
  - Once version n+1 becomes effective, no new batch can start on version n.
  - Batches already in progress follow a configured rule. Default: finish on the issued version; migration to the new version only under change control. The record shows which version governed each step.
  - Every master carries a periodic-review due date and an overdue alert.
  - A retired master blocks new batches, but every executed record stays retrievable and printable.
  - The system exports an inventory of its controlled documents (masters, templates, forms, label templates, embedded instructions) with ID, version, status, effective date and review date.
catalog_test: After v2 is effective, starting a batch on v1 is blocked. An overdue review appears on the dashboard. The inventory export reconciles with the site document list.
implemented_by:
  modules:
    - "packages/recipe-core/sql/0160_market_authorisation.sql (supersession per market and scope in the same transaction, withdrawal, recipe.retire_version)"
    - "packages/recipe-core/sql/0170_batch_issue.sql (selection at issue, pin record, in-flight dispositions)"
    - "packages/recipe-core/sql/0180_review_inventory_invariants.sql (periodic review, overdue list, document inventory, where-used)"
    - "packages/recipe-core/src/lifecycle/inventory.ts (CSV export, reconciliation with the site document list)"
  invariants:
    - "INV-01"
    - "INV-17"
  guards:
    - "batch_mbr_pin trigger: a new batch pins only the version the selection gives at the issue instant; after v2 is CURRENT, v1 is refused (EBMR-RCP-101)"
    - "mbr_version.review_due_set: every approved master carries a review due date after its effective date; recipe.overdue_reviews lists the overdue ones (the dashboard that shows them comes with Phase 6: open, see phase-2-open-questions F13.2)"
    - "mbr_version.no_open_authorisation and recipe.retire_version: retirement ends every open authorisation; retired versions are never selected, issued records stay readable (recipe.verify_control_recipe)"
    - "mbr_version.in_flight_dispositioned: issued and running batches of earlier versions get CONTINUE (default), HOLD_FOR_ASSESSMENT or CANCEL_UNSTARTED before a successor is approved"
  db_constraints:
    - "authorisation_cell_one_current (unique partial index) and authorisation_cell_current_no_overlap (exclusion constraint)"
    - "batch_mbr_pin.batch_id unique; control_recipe insert-only"
