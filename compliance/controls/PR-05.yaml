      reason: "Phase 2 keeps the overdue list in the database (recipe.overdue_reviews, tested in recipe-core lifecycle review-inventory); dashboards come in Phase 6 (build outline 11; decision F13.2)."
  - clause: "The inventory export reconciles with the site document list."
    tests:
      - "packages/recipe-core/test/lifecycle/review-inventory.test.ts > [PR-05][PR-02] the inventory export lists every version with ID, version, status and dates, and reconciles with the site document list"
expert_decision:
