sources: "Revised Schedule M Part XII 11.3.1 to 11.3.4; ICH Q7 (EU GMP Part II) 11.40 to 11.43. API plan docs/build-plan/api/plan.md sections 4 (C3) and 6."
behaviour: "An authentic certificate of analysis can be issued for each batch on request. It gives the product's name and grade, the batch number, the release date, the retest or expiry date, each test with its limits and numerical result, and the original manufacturer's name, address and telephone, and the quality unit dates and signs it."
catalog_test: "Prepare a CoA for a lot that is not released, or that has a required test without an approved result; refused."
