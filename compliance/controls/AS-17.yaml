id: AS-17
title: "Certificate of analysis of an API batch"
part: D
group: API edition
editions:
  - substance
type:
  - ENFORCED
target_phase: 7
target_phase_source: default
requirement_rows: []
sources: "ICH Q7 (Step 4, 10 November 2000; EU GMP Part II) section 11.4, Certificates of Analysis, 11.40 to 11.43, checked against the official text (database.ich.org, Q7 Guideline.pdf). 11.44 (new certificates from repackers, reprocessors, agents or brokers) does not apply to a manufacturer running Batchwright (plan section 5). API plan docs/build-plan/api/plan.md row C3."
behaviour: "11.40: \"authentic Certificates of Analysis\" for each batch \"on request\". 11.41: the name of the API with its grade where appropriate, the batch number and the date of release; the expiry date, or the retest date, when the API has one. 11.42: each test performed, with its acceptance limits and its numerical result. 11.43: \"dated and signed by authorised personnel of the quality unit\", with the name, address and telephone number of the original manufacturer."
catalog_test: "Prepare a CoA for a lot that is not released, or that has a required test without an approved result; refused."
implemented_by:
  modules:
    - "substance 5005 (substance.coa_document, prepare_coa, sign_coa: a true copy read from the records, signed COA_APPROVED); tablets 1904 (read class); site-services 1735 (licence holder telephone); CoaPage on the lot release."
tests:
  - "apps/tablets-server/test/substance/api-chain.test.ts > API plan A1a: one API batch from library blocks to a released lot, over the routes > [AS-17][AS-18][IN-05][DI-35][DI-41] the CoA of the released API lot says the product, grade, lot, release, retest or expiry date, each test with its limits and approved result and the manufacturer from the licence; the authorised person prepares it as a true copy and signs it COA_APPROVED once"
  - "apps/tablets-server/test/substance/api-chain.test.ts > API plan A1a: one API batch from library blocks to a released lot, over the routes > [AS-17][IN-05][DI-41] a CoA fails closed: a lot that is no API finished lot has no CoA and none is prepared for it"
  - "apps/tablets-server/test/substance/api-chain.test.ts > API plan A1a: one API batch from library blocks to a released lot, over the routes > [AS-17][IN-30][DI-35] the licence holder's telephone is optional free text: a licence recorded without one signs the same content as before (no telephone member) and gives the CoA no telephone; a telephone with ; or = is refused (site-services 1735)"
expert_decision:
  status: PENDING
  pack_version: "api-0.1"
build_status: IMPLEMENTED
scope: "API edition (substance) only; slice A3 of the API plan."
