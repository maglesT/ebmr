    - "packages/site-services/sql/0740_lims_lite.sql"
    - "packages/recipe-core/sql/0601_gmp_deviation_references.sql"
  guards:
    - "A failing IPC result and its re-test are both kept; the failing result governs and its exception stays open until an investigation invalidates it"
    - "G-12: sample ids and labels are system-generated; an unplanned sampling point is refused (G12-NOT-PLANNED)"
    - "On a GMP batch an invalidation cites an OOS or investigation record linked to the batch and concluded by QA with an assignable cause (site.deviation_ref_problem INVALIDATION; EBMR-EXE-602); an approved lot test failure is resolved only by such an OOS record"
  invariants:
    - "INV-41"
