id: IN-20
title: Deviations, OOS and investigation scope
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 244
  - 659
  - 230
sources: Schedule M Part I 18.2.2 (written approval of any departure by a designated person, QC involved where appropriate); 18.5.12 (review before AP; investigation extended to other batches); section 1 PQS list (root cause, CAPA effectiveness); 19.1-19.3 (QC independence; records of sampling and testing; review of production documentation in product assessment); 19.6.6 (sample label items); 19.6.7 (OOS investigated under an approved procedure).
behaviour: "(a) A deviation is captured at the point of occurrence and linked to the step; a planned or unplanned departure from the MBR cannot continue until a designated role approves it by e-signature (QC co-approval configurable, on by default for product-impacting categories). (b) Closure requires root cause (or most probable cause), CAPA reference and conclusion; the impact assessment can list other batches and products, which are then flagged. (c) IPC results that are specification tests follow the same OOS workflow as QC results: the original result stays in the record, a re-entered passing value never replaces it, and the OOS stays open until the approved investigation closes. (d) Sampling steps print sample labels with material name, batch/lot number, container number, sample number, sampler identity (e-signature) and date. (e) QC results used for release are approved by a checker different from the analyst."
catalog_test: enter an out-of-specification IPC assay and then a passing re-test; both remain visible and the OOS stays open.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/data.ts, packages/recipe-core/src/engine/corrections.ts (repeats and invalidation)"
    - "packages/recipe-core/src/blocks/generic/recording.ts (G-13)"
    - "packages/recipe-core/src/blocks/generic/process.ts (G-12)"
  guards:
    - "A failing IPC result and its re-test are both kept; the failing result governs and its exception stays open until an investigation invalidates it"
    - "G-12: sample ids and labels are system-generated; an unplanned sampling point is refused (G12-NOT-PLANNED)"
  invariants:
    - "INV-41"
tests:
  - "packages/recipe-core/test/blocks/process.test.ts > G-05 observation capture and G-13 IPC > [PR-29][IN-20][DI-29] a failing categorical IPC stops the step until a deviation is linked, and a passing re-test never replaces it"
  - "packages/recipe-core/test/blocks/process.test.ts > G-12 sampling > [IN-20][PR-29] sample ids are system-generated and the label carries product, batch, sample, sampler and time; an unplanned point is refused"
  - "packages/recipe-core/test/engine/corrections.test.ts > paths (b) void and (c) invalidation; repeats (DI-29, INV-41) > [DI-29][IN-20] invalidating a result needs an investigation and QA approval; the original stays, the next attempt governs"
expert_decision:
