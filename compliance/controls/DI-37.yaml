    - "apps/tablets-server/src/features/esig/badges.ts"
    - "apps/tablets-server/src/features/esig/views.ts (manifestation from the stored copy)"
    - "apps/tablets-web/src/features/access/ceremony.tsx (SignatureCeremonyPort)"
    - "packages/ui-kit/src/machines/ceremony.ts"
    - "packages/ui-kit/src/identity/SignatureDialog.tsx"
    - "packages/ui-kit/src/identity/SignableContent.tsx"
    - "packages/ui-kit/src/identity/Manifestation.tsx"
    - "packages/recipe-core/src/engine/signing-content.ts (batch_step, batch_stage, batch_exception, batch_point content; kernel envelope)"
    - "packages/recipe-core/sql/0200_execution_store.sql, 0210_execution_writers.sql (versioned signed content tables registered with esig; content providers; disposition proposals)"
    - "apps/tablets-server/src/features/execution/signable.ts (ENGINE_COMMAND: preview, prepare, dry run, apply)"
    - "packages/api-contract/src/common.ts (storableText, unstorableTextIssues: text no record can hold), packages/api-contract/src/route.ts (defineRoute applies it)"
    - "apps/tablets-server/src/platform/db/pools.ts (refuseUnstorableParameters), apps/tablets-server/src/platform/http/json-body.ts (strict UTF-8 request bodies), apps/tablets-server/src/platform/http/errors.ts (unstorableTextRefusal)"
    - "apps/tablets-web/src/features/designer/model/ops.ts (an edit that would bring text no record can hold into the MBR content is refused, naming the field, so the designer never hashes such content; review F31 round 2)"
  invariants:
    - "INV-09"
    - "INV-10"
  guards:
    - "esig.create_challenge: the server rebuilds the canonical content and refuses a displayed hash or version that differs (EBMR-ESIG-012, 013)"
    - "esig.sign: the record must still have the challenged version and hash (EBMR-ESIG-012); signing and changing a record are serialised by a transaction lock"
    - "esig.on_signed_content_change (trigger on every registered signed table): a permitted change supersedes every affected signature in the same transaction through an insert-only SUPERSEDED_BY_CHANGE row"
    - "esig.assert_signature and esig.platform_signature_check: a signature is used only for its own record and meaning and only while valid (EBMR-ESIG-070)"
    - "esig.assert_change_triggers_ok: no challenge or signature while an invalidation trigger is missing or disabled (EBMR-ESIG-008)"
    - "The preview is the content prepared at database time (sweep and PERFORMED finalisation); the challenge prepares it for real and the kernel refuses a differing hash (EBMR-ESIG-013)"
    - "An exception disposition signs its proposed outcome, justification and deviation (proposedDisposition in the batch_exception content); a differing action at signing is refused (EBMR-EXE-086)"
    - "apply asserts the signed content is unchanged by the command; any failure rolls back signature, seal and row together (EBMR-EXE-082, 083)"
    - "canonicalJson (kernel esig/canonical.ts, expr evidence/hash.ts): text no record can hold (U+0000, a UTF-16 surrogate without its other half) has no canonical form and is refused (EBMR-ESIG-004; UnstorableTextError), as esig.canonical_json can never receive it, so no client hashes content the server cannot store (review F31)"
    - "API contract (defineRoute applies storableText): the params, query and body of every route refuse such text at any depth, naming the field (400 INVALID_INPUT); the preview refuses it in the decision it decodes (parseIntent); the server refuses bodies that are not UTF-8 and any query parameter holding such text; jsonb and text refuse it in the database (22P05, 22P02, 22021), answered 400, never 500 (review F30, F32, F33)"
  db_constraints:
    - "esig.signature_invalidation: insert-only and audited; one per signature"
    - "esig.signature: auth_event_id and challenge_id unique; seal required before commit (deferred constraint trigger esig_signature_sealed)"
    - "esig.verify_signatures(): integrity job (seal payload digest, manifestation, challenge, authentication event, authority evaluation, audit event, register, current content hash); zero rows expected"
    - "esig.invariant_violations(): INV-03, INV-09, INV-10, INV-27 queries; zero rows expected"
  policies:
    - "esig.challenge_validity_seconds"
