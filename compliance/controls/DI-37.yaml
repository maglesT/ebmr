id: DI-37
title: Signature-record linking and invalidation on change
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 55
  - 162
  - 171
sources: "US: 11.70; 11.10(e) | EU: Annex 11 §14(b) (permanently linked) | ICH/EMA/draft: draft Annex 11 §13 (hybrid: later change must invalidate the signature) (draft)(s)"
behaviour: |-
  - A signature record binds the signer ID, the manifestation, the meaning, the timestamp and a cryptographic hash of the exact content version it signs.
  - No UI or API path can cut, copy or transfer a signature to another record. An integrity job detects any DB-level transplant.
  - A permitted change to signed content automatically:
  - marks the signature "superseded by change";
  - shows the element as unsigned;
  - requires re-signing by the relevant signer(s).
  The history stays in the audit trail.
  - Wet-ink signing on printouts is avoided. If it cannot be avoided, the scanned signed page is indexed to the record ID and version hash under an SOP. A wet-ink signature never substitutes for an e-signature the MBR requires.
catalog_test: Correct a signed value. The signature shows as superseded and re-signing is required. Copy a signature row to another record in a test DB. The integrity check fails.
implemented_by:
  modules:
    - "packages/kernel/sql/0200_esig_foundation.sql (canonical JSON, content hash, content-provider registry)"
    - "packages/kernel/sql/0220_esig_signatures.sql (esig.register_signed_table, esig.content_changed, esig.signature_invalidation, seals)"
    - "packages/kernel/sql/0230_esig_sign.sql (esig.create_challenge, esig.sign, esig.assert_signature, esig.platform_signature_check, esig.resigning_required)"
    - "packages/kernel/sql/0240_esig_integrity.sql (esig.verify_signatures, esig.invariant_violations)"
    - "packages/kernel/src/esig/canonical.ts"
    - "packages/kernel/src/esig/keys.ts"
    - "packages/kernel/src/esig/signing.ts"
    - "packages/kernel/src/esig/integrity.ts (verifySignatures, verifySeal)"
    - "apps/tablets-server/src/features/esig/index.ts (content, challenge, sign: authenticate, dry-run, esig.sign and seal, apply in one command; failures logged after rollback)"
    - "apps/tablets-server/src/features/esig/badges.ts"
    - "apps/tablets-server/src/features/esig/views.ts (manifestation from the stored copy)"
    - "apps/tablets-web/src/features/access/ceremony.tsx (SignatureCeremonyPort)"
    - "packages/ui-kit/src/machines/ceremony.ts"
    - "packages/ui-kit/src/identity/SignatureDialog.tsx"
    - "packages/ui-kit/src/identity/SignableContent.tsx"
    - "packages/ui-kit/src/identity/Manifestation.tsx"
  invariants:
    - "INV-09"
    - "INV-10"
  guards:
    - "esig.create_challenge: the server rebuilds the canonical content and refuses a displayed hash or version that differs (EBMR-ESIG-012, 013)"
    - "esig.sign: the record must still have the challenged version and hash (EBMR-ESIG-012); signing and changing a record are serialised by a transaction lock"
    - "esig.on_signed_content_change (trigger on every registered signed table): a permitted change supersedes every affected signature in the same transaction through an insert-only SUPERSEDED_BY_CHANGE row"
    - "esig.assert_signature and esig.platform_signature_check: a signature is used only for its own record and meaning and only while valid (EBMR-ESIG-070)"
    - "esig.assert_change_triggers_ok: no challenge or signature while an invalidation trigger is missing or disabled (EBMR-ESIG-008)"
  db_constraints:
    - "esig.signature_invalidation: insert-only and audited; one per signature"
    - "esig.signature: auth_event_id and challenge_id unique; seal required before commit (deferred constraint trigger esig_signature_sealed)"
    - "esig.verify_signatures(): integrity job (seal payload digest, manifestation, challenge, authentication event, authority evaluation, audit event, register, current content hash); zero rows expected"
    - "esig.invariant_violations(): INV-03, INV-09, INV-10, INV-27 queries; zero rows expected"
  policies:
    - "esig.challenge_validity_seconds"
