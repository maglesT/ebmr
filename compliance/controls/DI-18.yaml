  guards:
    - "iam.check_static_segregation: no person holds an ADMINISTRATION and a GMP permission through any account or scope; a role never mixes the two (EBMR-IAM-033)"
    - "nobody administers their own person, account, credentials, badge or grants (EBMR-IAM-003)"
    - "iam.assert_not_administrator: GMP data write paths refuse administrator roles and break-glass accounts (EBMR-IAM-042)"
    - "break-glass: requested by its holder, approved by a second person, time-limited, authentication only inside the window, BREAK_GLASS_USED critical alert on every use, never signs, reviewed after the window"
    - "iam.assert_not_administrator runs before the permission check in every GMP write path of market (rule tables, site values, policies, pins, evaluations, stub master data), records, continuity (restore approval, number ceilings) and the site batch-number register (EBMR-IAM-042); IT functions (restore operation, backup catalogue, hardening attestations, continuity alarms) are ADMINISTRATION or GOVERNANCE permissions without it"
  db_constraints:
    - "iam.role_grant and iam.role_permission triggers hold for the table owner too"
    - "iam.directory_scan(): ADMINISTRATOR_AND_GMP_ROLE finding"
  policies:
    - "breakglass.max_window_minutes"
