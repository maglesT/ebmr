id: DI-18
title: System-administration segregation (administrators independent of record content)
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 645
  - 62
  - 168
sources: "US: 11.10(d), 11.10(g); 211.68(b); FDA DI Q&A Q4 (administrator rights assigned to people independent of record content) | EU: Annex 11 §12.1, §12.2 | ICH/EMA/draft: draft Annex 11 §11 segregation of duties, §12 privileged functions only for administrators independent of GMP work (draft)(s)"
behaviour: |-
  - No account in a tenant can hold both a system-administration permission and a GMP data permission. The engine rejects the assignment.
  - System-administration permissions: user/role management, configuration, interface settings, audit-related settings, file or DB access.
  - GMP data permissions: execute, verify, review, approve, release, MBR authoring.
  - Administrators cannot change GMP data values, cannot sign GMP records, and cannot grant themselves any role. Every role grant needs a second approver.
  - Break-glass accounts are sealed and time-limited, need dual authorisation, raise an alarm when used, and are reviewed afterwards. They cannot perform GMP actions.
  - Privileged actions go to a protected system log. That log is covered by periodic review (DI-11) and by the configuration audit trail.
  - The product has no in-built exception for small sites: FDA Q4 offers no fallback. Any compensating arrangement is owned by the firm (see open questions).
catalog_test: Assign an administrator role to a user who holds a QA role. Refused. An administrator tries to edit a GMP value through the UI or API. Refused and logged. A break-glass login raises an alarm and cannot sign.
implemented_by:
  modules:
    - "packages/kernel/sql/0120_iam_roles_grants.sql"
    - "packages/kernel/sql/0130_iam_qualifications_authority.sql"
    - "packages/kernel/sql/0150_iam_credentials_badges.sql"
    - "packages/kernel/sql/0160_iam_authentication_sessions.sql"
  invariants:
    - "INV-11"
  guards:
    - "iam.check_static_segregation: no person holds an ADMINISTRATION and a GMP permission through any account or scope; a role never mixes the two (EBMR-IAM-033)"
    - "nobody administers their own person, account, credentials, badge or grants (EBMR-IAM-003)"
    - "iam.assert_not_administrator: GMP data write paths refuse administrator roles and break-glass accounts (EBMR-IAM-042)"
    - "break-glass: requested by its holder, approved by a second person, time-limited, authentication only inside the window, BREAK_GLASS_USED critical alert on every use, never signs, reviewed after the window"
  db_constraints:
    - "iam.role_grant and iam.role_permission triggers hold for the table owner too"
    - "iam.directory_scan(): ADMINISTRATOR_AND_GMP_ROLE finding"
  policies:
    - "breakglass.max_window_minutes"
tests:
  - "packages/kernel/test/identity/access.test.ts > [DI-16][DI-18] the requester never approves, nobody approves their own grant, nobody requests a role for themselves"
  - "packages/kernel/test/identity/access.test.ts > [DI-18] GMP data write paths refuse every administrator role, whatever the permission check says"
  - "packages/kernel/test/identity/access.test.ts > [DI-18] a break-glass login needs a second person's approval, raises an alarm, cannot sign and is reviewed afterwards"
  - "packages/kernel/test/identity/access.test.ts > [DI-18] an administrator's attempt to change a GMP value is refused and logged"
  - "packages/kernel/test/identity/access.test.ts > [DI-18][INV-11] assigning an administrator role to a person who holds a QA role is refused, and the reverse"
  - "packages/kernel/test/identity/access.test.ts > [DI-18][INV-11] the rule spans every account of the person: a GMP user's break-glass account cannot be an administrator"
  - "packages/kernel/test/identity/accounts.test.ts > [INV-11][DI-18] nobody creates or administers their own account"
