    - "iam.assert_not_administrator runs before the permission check in every GMP write path of market (rule tables, site values, policies, pins, evaluations, stub master data), records, continuity (restore approval, number ceilings) and the site batch-number register (EBMR-IAM-042); IT functions (restore operation, backup catalogue, hardening attestations, continuity alarms) are ADMINISTRATION or GOVERNANCE permissions without it"
