id: PR-07
title: Quality-risk-management linkage for risk-based settings
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 204
  - 205
  - 206
  - 207
  - 211
  - 210
  - 109
sources: "US: none binding (Q9 is FDA guidance (s)) | EU: Annex 11 section 6 (criticality via risk management); Ch.5 5.20-5.21 | ICH/EMA/draft: ICH Q9(R1) sections 3, 4.3, 4.6, 5.1-5.3, Annex II (s); EU Ch.4 draft 4.13 (draft)"
behaviour: |-
  - Scope: this applies to risk-based settings in a master, namely criticality, verification mode, IPC frequency and sample size, hard vs soft limits, review-by-exception scope, and campaign or concurrency rules. Each cites a risk assessment by ID and version.
  - Scoring scales are controlled master data.
  - Assessments store the formality level and its reasons, and keep hazard, harm, probability, severity and detectability as separate fields.
  - Linked events raise a re-review task, and review-by-exception for the affected step pauses until QA confirms. Linked events are repeated deviations on a step, a PQR finding, or a change.
  - Reducing IPC frequency requires change control that cites trend data.
catalog_test: Submitting a master with a critical parameter and no linked assessment is blocked. Three deviations on a low-risk step open a re-review task and pause review-by-exception for that step.
implemented_by:
  modules:
    - "packages/recipe-core/sql/0110_mbr_family_version.sql (risk_assessment stub: id, risk class, rationale reference; mbr_risk_link per element or whole master)"
    - "packages/recipe-core/sql/0130_mbr_guards.sql (guard critical_elements_risk_assessed)"
  guards:
    - "mbr_version.critical_elements_risk_assessed (IN_VERIFICATION -> SUBMITTED): every CRITICAL parameter and calculation is covered by a linked risk assessment"
tests:
  - "packages/recipe-core/test/lifecycle/approval.test.ts > [PR-07] submitting a master with a critical parameter and no linked risk assessment is blocked"
  - "packages/recipe-core/test/mutation/mbr-lifecycle.test.ts > draft attributes, risk links and change records (PR-06, PR-07) > [PR-07] a risk link names a recorded assessment (EBMR-RCP-061) and subjects that are ids; only a linked assessment is unlinked; nothing is written by a refusal"
  - "packages/recipe-core/test/mutation/mbr-lifecycle.test.ts > a command on one version never waits for a command on another (decision 0003) > [PR-07][PR-06] a risk link of one version is recorded while another version's content revision is still open"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > TB-11 periodic IPC scheduler > [IN-35][PR-07][PR-29] a compression plan whose most frequent test plus the grace exceeds 30 min is refused, as is a plan without its QRM reference or a compression run without its station sweep"
  - "apps/tablets-server/test/blocks/ipc/db-guards.test.ts > the IPC blocks in the database (tablets 0890 to 0893) > [IN-35][PR-29][PR-07] TB-11: the run starts only on a plant press in use for the batch; a passing check is recorded for its stream and vouches for the containers closed before it; a failing check holds every container of the press since the last passing check (the slice 1 hold), and a passing check cannot be recorded past the scheduler"
  - "apps/tablets-server/test/blocks/forming/blocks.test.ts > TB-06 roller compaction > [PR-29][PR-07] the MBR names the compactor, a ribbon interval and grace with its risk assessment and at least one ribbon parameter, a sane recycle limit and yield range"
  - "apps/tablets-server/test/blocks/blister/tb-22-edges.test.ts > TB-22 definition checks > [PR-29][IN-38][PR-07] a positive interval and grace, a QRM reference, ordered method ranges with both ends, each track once and none LINE"
  - "apps/tablets-server/test/blocks/forming/tb-06-edges.test.ts > TB-06 PERFORMED and definition > [PR-29][PR-07][IN-36] the definition: a compactor used, a ribbon interval and grace above zero with its risk assessment and parameters, screens once, a recycle limit up to 100, ordered yield limits"
  - "apps/tablets-server/test/blocks/ipc/tb-11-edges.test.ts > TB-11 entries > [PR-29][PR-07][DI-28] a check is of a planned test, gives the press counter when its interval is by count, and the counter never goes back (equal allowed)"
  - "apps/tablets-server/test/blocks/ipc/tb-11-edges.test.ts > TB-11 definition checks > [IN-35][PR-29][PR-07] streams and tests once each, a grace and intervals above zero, a QRM reference and a configuration per planned test"
  - "packages/recipe-core/test/review/review.test.ts > review by exception paused after three deviations on a step (PR-07) > [PR-07] three deviations on a low-risk step open a re-review task and pause review-by-exception for that step"
clauses:
  - clause: "Submitting a master with a critical parameter and no linked assessment is blocked."
    tests:
      - "packages/recipe-core/test/lifecycle/approval.test.ts > [PR-07] submitting a master with a critical parameter and no linked risk assessment is blocked"
  - clause: "Three deviations on a low-risk step open a re-review task and pause review-by-exception for that step."
    deferred:
      phase: 4
      reason: "Phase 2 records no deviations (a deviation is linked by its number only) and has no review by exception; re-review tasks raised by repeated deviations come with production and QA review and the deviation stand-in in Phase 4 (build outline 11; recipe-core lifecycle README, Later phases)."
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: This is guidance level in both regions. EU GMP Part III incorporates Q9 (s). The default is a recommended configuration, not a legal minimum.
type_detail: "CONFIGURABLE. Default: every master element classified critical must cite an approved, versioned risk assessment. Allowed: extend the requirement to all elements. Not allowed: removing it for critical elements."
