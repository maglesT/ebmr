id: ST-45
title: Sterile-state tracking of items and carriers; sterile packaging and hold
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 487
  - 489
sources: "EU Annex 1: 8.44, 8.46, 8.48 | US: 211.113(b)."
behaviour: |-
  - Every carrier and item carries ID, product/batch and state: to be sterilised / sterilised, pending review / released / rejected.
  - Point-of-use scanners refuse anything not "released sterile". Process indicators (tape, dots) are recorded but never serve as release evidence on their own.
  - Packing time, sterilisation time and sterile expiry are tracked, and the maximum packing-to-sterilisation time and sterile hold are enforced.
  - At use, the operator confirms sterile-barrier integrity for each item or rejects and replaces it.
catalog_test: Scan a tray whose cycle is unreviewed at Grade A entry → refused.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > what the approved MODIFY decisions keep, in the I-1 blocks (slice I-6.3) > [ST-45] each sterilisation and depyrogenation cycle block is signed by the operator and checked or verified by a second person of another role, so a cycle is not complete until it is reviewed"
clauses:
  - clause: "Scan a tray whose cycle is unreviewed at Grade A entry → refused."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Carrier state scanning; packing-to-sterilisation timer"
