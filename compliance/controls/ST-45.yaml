  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "Cycle blocks with SIGN + CHECKED; holds by CALC (4.2)"
build_status: SPECIFIED
jurisdiction: EU is explicit. FDA-AP has equivalent expectations in IX.C.
scope: all
type_detail: ENFORCED. Packing-to-sterilisation and sterile-hold limits are CONFIGURABLE as validated.
