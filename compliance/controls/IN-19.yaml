  - "packages/recipe-core/test/blocks/reprocessing.test.ts > G-24@2 reprocessing and recovery gate on the database facts > [PR-47][IN-19][DI-33] an addition without prior authorisation, by its authoriser, of another product, over the MBR percentage, age or source-batch count, from a source holding recovered material, from material of another status, or from ad-hoc material is refused"
