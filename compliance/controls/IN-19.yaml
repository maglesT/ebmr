id: IN-19
title: Rework, reprocessing and recovery
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 249
sources: Schedule M Part I 14.32-14.34.
behaviour: "(a) Rework of a rejected batch is modelled as a new batch with a new number and a parent-child link to the rejected batch(es); it requires an approved rework procedure/protocol and a linked risk evaluation; a record of the rework is part of the new batch record. (b) Adding an earlier in-specification batch (recovery) into a later batch of the same product is allowed only at an MBR-defined stage, with prior authorisation, a risk evaluation that addresses shelf-life impact, and recording of source batch numbers and quantities. The expiry of the receiving batch requires QA confirmation; the default proposal is not later than the earliest expiry of any recovered input (design choice). (c) QC receives an automatic flag to consider additional testing of any finished batch that was reworked, reprocessed or contains recovered material. (d) US-market batches: reprocessing also needs quality-unit approval."
catalog_test: add recovered material without prior authorisation; the step is blocked.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/process.ts (G-24)"
    - "packages/recipe-core/src/blocks/generic/reprocessing.ts (G-24@2 and the addition rules)"
    - "apps/tablets-server/src/blocks/tb-08.ts (TB-08)"
    - "packages/recipe-core/sql/0620_g24_database_path.sql to 0624_whole_batch_reprocessing.sql"
    - "apps/tablets-server/sql/1020_tb08_registers.sql to 1022_recovered_expiry_cap.sql"
  guards:
    - "G-24: start needs a prior QA authorisation by another person citing an investigation and a risk evaluation (G24-NOT-AUTHORISED, G24-SELF-AUTHORISED); same product, MBR age, percentage and source-batch limits; chained recovery blocked; the QC decision on extra testing is a release-blocking exception"
    - "recipe-core 0622, tablets 1021: addition limits, chained recovery and authorisation enforced in the database"
    - "recipe-core 0624, tablets 1022: source expiry from the product master; the printed expiry is capped at the earliest recovered input (recipe.recovered_expiry_cap)"
