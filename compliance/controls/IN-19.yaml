  - "apps/tablets-server/test/blocks/reprocessing/db-guards.test.ts > reprocessing and recovery additions in the database (recipe-core 0620 to 0622, tablets 1020, 1021) > [IN-19][PR-47] chained recovery is blocked: a source batch that itself received recovered material cannot be a source, past a forged engine"
