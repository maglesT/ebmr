id: IN-39
title: "OSD room environment: pressure differentials, temperature and humidity"
part: D
group: Tablets edition
editions:
  - tablets
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 3
target_phase_source: outline
requirement_rows:
  - 265
  - 677
sources: Schedule M Part VIII 1.5, 1.14 (non-overlapping limits, 5-15 Pa vs 15-30 Pa example), 1.17, 1.25, 1.27-1.28.
behaviour: Each step records room ID and captures differential pressure, temperature and RH at start and during long steps (manual entry or BMS/EMS import) against room-specific alert and action limits. The room master data validator refuses pressure ranges of adjacent rooms that overlap (e.g., 5-15 Pa next to 15-30 Pa is rejected). An excursion notifies Production and QA immediately and links to the batch as a deviation. Moisture-sensitive products may carry tighter product-specific RH limits.
catalog_test: enter a differential pressure below the action limit at compression start; the step is blocked or a deviation opens and both departments are notified.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/recording.ts (G-11)"
  guards:
    - "G-11: a value outside its action limit raises LIMIT_BREACH and ENVIRONMENT_EXCURSION, stops the step until a deviation is linked, and notifies production and QA"
tests:
  - "packages/recipe-core/test/blocks/process.test.ts > G-11 environmental condition check > [IN-39][PR-25] a pressure difference below its action limit stops the step, links a deviation and notifies production and QA"
  - "apps/tablets-server/test/notifications/notification-centre.test.ts > the notification centre (slice 3c, recipe-core 0810) > [IN-39] a recorded manufacturer decision notifies both departments, production and QA, naming the signature and its signer, for a release and a rejection; a signature without a recorded decision notifies nobody"
  - "apps/tablets-server/test/notifications/notification-centre.test.ts > the notification centre (slice 3c, recipe-core 0810) > [IN-39] the application role cannot write, change or delete a notification or an acknowledgement, nor call the notifying definer"
  - "apps/tablets-server/test/notifications/notification-centre.test.ts > the notification centre (slice 3c, recipe-core 0810) > [IN-39] QA lists its own department's notifications; the lot's list shows both departments"
  - "apps/tablets-server/test/notifications/notification-centre.test.ts > the notification centre (slice 3c, recipe-core 0810) > [IN-39] a person of the department acknowledges once, as themselves (audited); another department's person cannot"
  - "apps/tablets-server/test/seed/release-seed.test.ts > the release demo of the set-up CLI (demo seed) > [IN-05][IN-39] the AP rejects the NOT_READY lot over HTTP on the epoch shown; production and QA are notified and each acknowledges"
  - "apps/tablets-web/test/release/release.test.tsx > notification centre > [IN-39] lists the department's notifications; the acknowledgement is the person's own, with a fresh badge tap on a shared terminal"
  - "apps/tablets-server/test/notifications/excursion-notifications.test.ts > excursion notifications (IN-39, recipe-core 1051) > [IN-39] both departments are notified: an excursion at a room check is delivered to production and QA with the exception that caused it"
  - "apps/tablets-server/test/notifications/excursion-notifications.test.ts > excursion notifications (IN-39, recipe-core 1051) > [IN-39] the application role cannot write, change or delete an excursion notification, nor call the notifying trigger function"
