id: ST-24
title: EM/PM completeness and review as a release prerequisite
part: C
group: "Theme 2: Cleanroom/area status and environmental and personnel monitoring linked to the batch window"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 540
  - 580
sources: "EU Annex 1: 9.1–9.3, 10.10 | US: 211.192; FDA-AP XII."
behaviour: |-
  - The release package assembles, for every room, zone and line used and the whole processing window: viable and total-particle EM, PM, T/RH, DP, and APS status.
  - Certification is blocked while any result is outstanding, for example plates still incubating, or while an out-of-trend event is open.
  - An explicit "EM and trend data reviewed" signature is required.
  - Exception: the short-shelf-life path (ST-69).
catalog_test: Attempt certification while two filling-window plates are still incubating → blocked.
