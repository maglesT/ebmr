id: IN-47
title: Sterilisation cycle records and revalidation
part: D
group: Injectables edition
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 257
sources: Schedule M Part II 6.3-6.11 (6.5 at least annual verification; 6.8 carrier labelling; 6.10 records approved in batch release; 6.11.1 heat sterilisation recording and faults; chamber leak tests).
behaviour: Steriliser/autoclave/tunnel/EO/irradiation interfaces import each cycle into the batch record (cycle ID, validated load pattern selected from a list, trace, coolest-point temperature with independent second probe where fitted, pressure, F0 where used, alarms; for EO also time, pressure, temperature, humidity, gas concentration and biological indicators; for irradiation dosimeter results). A reviewer signs each cycle before batch release, and cycle faults must be dispositioned. A steriliser whose revalidation (at least yearly and after significant change) or chamber leak test is overdue cannot be selected. Carrier labels (basket, tray) print material name, batch number and sterilised/not-sterilised status. Cooling fluid in contact with product must be recorded as sterile.
catalog_test: select a steriliser whose annual revalidation lapsed; blocked. Import a cycle with an alarm; release is blocked until the alarm is dispositioned.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables-routes.test.ts > the Injectables catalogue (slice I-4, other containers and routes) > [ST-49][ST-61][IN-47] terminal sterilisation by radiation consumes every filled tray into its numbered load and, per load, records the certificate, the lowest and highest dose measured against the firm's limits (checked by a second person), the dosimeters read, the dose within its period and the package indicators, and registers the irradiated load; ultraviolet is not offered; for the EU market its own block records each load's loading pattern, reconciliation and the plant's signed records; a dose outside its limits or a failed check is an exception"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "INJ-05, -06, -21 typed NUM, SIGN + CHECKED; revalidation and leak test as due dates (4.2, 4.3)"
build_status: SPECIFIED
jurisdiction: yearly revalidation of every process is **stricter** than EU Annex 1 (2022) 8.39 (at least yearly for worst-case load patterns; others per CCS) [chk] and FDA (periodic) [gk]; chamber leak testing **weaker** than EU 8.60 (normally weekly when a vacuum phase is used) [chk], where India only says "regular".
notes: "Source check: P (6.3-6.11.1.4 re-read)."
