id: PR-16
title: Record completeness gate (processing complete / packaging complete)
part: B
group: B. Batch record issuance and execution
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 39
sources: "US: 211.188(b)(1)-(13) | EU: Ch.4 4.20(a)-(i); 4.21(a)-(i) | ICH/EMA/draft: none"
behaviour: |-
  "Processing complete" and "Packaging complete" are allowed only when two conditions hold.
  - Every step is in one of three states: executed; marked N/A by the system (branch not taken); or marked N/A by an authorised user with a reason and signature.
  - Every applicable item of Section (a)-3 or (a)-4 is present. The items are: dates and times; equipment unit IDs; component lots and quantities; IPC and lab results; packaging-area checks before and after use; yields; labeling specimens; container/closure description; sampling; performer and checker IDs; investigations; 211.134 results; the responsible production person's approval.
  Category checks depend on step type; for example, packaging-area checks apply only to packaging orders.
catalog_test: Removing one label specimen or one checker signature blocks completion, and the message names the gap.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/steps.ts (signPerformed, signOffStage)"
    - "packages/recipe-core/src/engine/advance.ts (execution completion)"
  guards:
    - "PERFORMED only with mandatory data and calculations present (ENG-MANDATORY-DATA) and a signature from every person who entered data"
    - "A stage closes only with the responsible person's sign-off; execution is complete only with every step terminal and verified and every stage signed off"
