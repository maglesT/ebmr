  - "apps/tablets-server/test/execution/db-guards-stage-summary.test.ts > F01: the database binds a stage sign-off to its summary (DI-37, IN-15, PR-16) > [DI-37][IN-15][PR-16] a SIGN_OFF_STAGE row recording another summary than its signature covers is refused (EBMR-EXE-135); the honest row is accepted"
