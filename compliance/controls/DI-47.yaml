id: DI-47
title: Retention periods, holds and controlled disposal
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 32
