jurisdiction: "**same** as EU 5.44 and 5.61 [chk] and FDA 211.103 [gk], 211.125(c) and 211.192 [chk]. FDA 211.125(c) waives label reconciliation for cut or roll labeling when 100% examination is done [chk]; India has no such waiver, so India is **stricter** there and the waiver is not offered."
