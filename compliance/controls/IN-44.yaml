id: IN-44
title: Clean-area sanitation, disinfectants and water monitoring
part: D
group: Injectables edition
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
