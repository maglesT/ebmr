id: DI-16
title: "Access lifecycle: recorded grants, point-in-time access lists, recertification, prompt removal"
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 644
  - 159
  - 62
  - 47
  - 173
sources: "US: 11.10(d); 211.68(b); FDA DI Q&A Q4 (documented list of authorised personnel and privileges) | EU: Annex 11 §12.3 | ICH/EMA/draft: draft Annex 11 §11 (timely handling and review of access rights) (draft)(s)"
behaviour: |-
  - Every grant, change and revocation of access rights is recorded in a protected log with requester, approver, date and reason. The requester and the approver must be different people (design).
  - The system reports the current and point-in-time (any past date) list of users, roles, privileges and sites for each system. This is the "authorised users and privileges" list.
  - A leaver event from HR or the IdP disables the account. DESIGN-CHOICE default: the same business day. No rule sets a time.
  - Periodic access recertification by the area owners records the reviewer, the outcome and each user's last activity. DESIGN-CHOICE default: every 6 months; allowed 3-12 months.
catalog_test: Produce the role list as of a past date and reconcile it with the access-request records. Disable a leaver, then try to log in and to sign. Both fail.
implemented_by:
  modules:
    - "packages/kernel/src/identity/admin.ts"
    - "packages/kernel/sql/0120_iam_roles_grants.sql"
    - "packages/kernel/sql/0180_iam_lifecycle.sql"
    - "apps/tablets-server/sql/0400_session_role_withdrawn.sql"
    - "apps/tablets-server/sql/0480_bind_session_needs_live_role.sql"
  guards:
    - "iam.role_grant_guard: requester, approver and grantee are three different persons; reason recorded; request, approval and revocation times from the database clock"
    - "iam.access_list(at): point-in-time list of persons, accounts, roles, permissions and scopes with the access-request record behind each row"
    - "iam.revoke_role_grant: effective at the revocation instant for commands and authority evaluations"
    - "iam.recertify_account and iam.recertification_due: reviewer, outcome, last activity and next due date; a REVOKED outcome revokes at once"
    - "iam.deactivate_account and iam.process_leaver: disable, revoke grants, end sessions, revoke credentials and badges in one transaction"
    - "tab.resolve_session (tablets 0400): a session whose declared role is no longer granted now (revoked or past valid_to), or whose account holds no live role, resolves no role (state ROLE_WITHDRAWN); the server ends it at its next request (tab.end_withdrawn_session, ADMIN_TERMINATED)"
    - "tab.keep_session_alive and tab.unlock_session (tablets 0400) refuse such a session (EBMR-TAB-017); the application role has no EXECUTE on iam.keep_session_alive and iam.unlock_session"
    - "tab.bind_session (tablets 0480): with no role named, a session whose account holds no role that is valid now is never bound to a cookie (EBMR-TAB-021); the server refuses such a login first (403 NO_ROLE)"
  db_constraints:
    - "iam.role_grant check constraints and guard trigger; grants audited on the account chain"
    - "iam.access_recertification insert-only and audited"
  policies:
    - "recertification.interval_months"
