id: DI-16
title: "Access lifecycle: recorded grants, point-in-time access lists, recertification, prompt removal"
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 644
  - 159
  - 62
  - 47
  - 173
sources: "US: 11.10(d); 211.68(b); FDA DI Q&A Q4 (documented list of authorised personnel and privileges) | EU: Annex 11 §12.3 | ICH/EMA/draft: draft Annex 11 §11 (timely handling and review of access rights) (draft)(s)"
behaviour: |-
  - Every grant, change and revocation of access rights is recorded in a protected log with requester, approver, date and reason. The requester and the approver must be different people (design).
  - The system reports the current and point-in-time (any past date) list of users, roles, privileges and sites for each system. This is the "authorised users and privileges" list.
  - A leaver event from HR or the IdP disables the account. DESIGN-CHOICE default: the same business day. No rule sets a time.
  - Periodic access recertification by the area owners records the reviewer, the outcome and each user's last activity. DESIGN-CHOICE default: every 6 months; allowed 3-12 months.
catalog_test: Produce the role list as of a past date and reconcile it with the access-request records. Disable a leaver, then try to log in and to sign. Both fail.
implemented_by:
  modules:
    - "packages/kernel/src/identity/admin.ts"
    - "packages/kernel/sql/0120_iam_roles_grants.sql"
    - "packages/kernel/sql/0180_iam_lifecycle.sql"
    - "apps/tablets-server/sql/0400_session_role_withdrawn.sql"
    - "apps/tablets-server/sql/0480_bind_session_needs_live_role.sql"
  guards:
    - "iam.role_grant_guard: requester, approver and grantee are three different persons; reason recorded; request, approval and revocation times from the database clock"
    - "iam.access_list(at): point-in-time list of persons, accounts, roles, permissions and scopes with the access-request record behind each row"
    - "iam.revoke_role_grant: effective at the revocation instant for commands and authority evaluations"
    - "iam.recertify_account and iam.recertification_due: reviewer, outcome, last activity and next due date; a REVOKED outcome revokes at once"
    - "iam.deactivate_account and iam.process_leaver: disable, revoke grants, end sessions, revoke credentials and badges in one transaction"
    - "tab.resolve_session (tablets 0400): a session whose declared role is no longer granted now (revoked or past valid_to), or whose account holds no live role, resolves no role (state ROLE_WITHDRAWN); the server ends it at its next request (tab.end_withdrawn_session, ADMIN_TERMINATED)"
    - "tab.keep_session_alive and tab.unlock_session (tablets 0400) refuse such a session (EBMR-TAB-017); the application role has no EXECUTE on iam.keep_session_alive and iam.unlock_session"
    - "tab.bind_session (tablets 0480): with no role named, a session whose account holds no role that is valid now is never bound to a cookie (EBMR-TAB-021); the server refuses such a login first (403 NO_ROLE)"
  db_constraints:
    - "iam.role_grant check constraints and guard trigger; grants audited on the account chain"
    - "iam.access_recertification insert-only and audited"
  policies:
    - "recertification.interval_months"
tests:
  - "packages/kernel/test/identity/access.test.ts > [DI-16] a disabled leaver can neither log in nor sign, and loses sessions, grants and badges at once"
  - "packages/kernel/test/identity/access.test.ts > [DI-16] a newly granted role is usable at once and appears in the access list"
  - "packages/kernel/test/identity/access.test.ts > [DI-16] recertification records reviewer, outcome, last activity and the due date; a REVOKED outcome removes access at once"
  - "packages/kernel/test/identity/access.test.ts > [DI-16] revocation is effective immediately: the next command and authority check fail"
  - "packages/kernel/test/identity/access.test.ts > [DI-16] the recertification interval is a policy value allowed between 3 and 12 months"
  - "packages/kernel/test/identity/access.test.ts > [DI-16] the role list as of a past date reconciles with the access-request records"
  - "packages/kernel/test/identity/access.test.ts > [DI-16][DI-18] the requester never approves, nobody approves their own grant, nobody requests a role for themselves"
  - "packages/kernel/test/identity/accounts.test.ts > [INV-27][DI-16] a rehired person keeps the same person record, needs a new identity check and gets a new login name"
  - "apps/tablets-server/test/audit/read-authorisation.test.ts > F35: the audit viewer serves only the chains the session may read > [DI-17][DI-16] an operator on a kiosk reads no colleague's access chain (the grant revocation and its reason), and lists no account, person, badge or terminal chain"
  - "apps/tablets-server/test/session/role-withdrawn.test.ts > F36: the database, for a session whose role is withdrawn (tablets 0400) > [DI-16][DI-38] resolves no role (state ROLE_WITHDRAWN), refuses to extend or unlock it (EBMR-TAB-017), and ends it"
  - "apps/tablets-server/test/session/role-withdrawn.test.ts > F36: the server, after the role a session works in is withdrawn > [DI-16][DI-17] a revoked office session reads nothing more: the next request ends it, and a new login of the account is refused"
  - "apps/tablets-server/test/session/role-withdrawn.test.ts > F36: the server, after the role a session works in is withdrawn > [DI-16][DI-38] a session locked before the revocation is not unlocked with the person's own password, and keep-alive does not extend another"
  - "apps/tablets-server/test/session/role-withdrawn.test.ts > F36: the server, after the role a session works in is withdrawn > [DI-16][DI-38] a time-limited grant (AUDITOR_READONLY) that passes its valid_to ends the session at its next request"
  - "apps/tablets-server/test/session/role-withdrawn.test.ts > F36: the server, after the role a session works in is withdrawn > [DI-16][DI-38] on a kiosk, a revoked operator's session ends at its next request, the keep-alive tap included"
  - "apps/tablets-web/test/session/sign-in-screens.test.tsx > F10: an account that holds no role now is told so, not offered an empty role choice > [DI-16] the role choice says there is no role to choose, why, and who handles role grants, and offers sign-out"
  - "apps/tablets-web/test/session/sign-in-screens.test.tsx > F10: an account that holds no role now is told so, not offered an empty role choice > [DI-16] control: an account with several roles is offered each of them"
  - "apps/tablets-server/test/session/no-role-binding.test.ts > F10: no browser session for an account that holds no role now (tablets 0480) > [DI-16][DI-38] GMP: the database refuses to bind such a session with no role named (EBMR-TAB-021) or with its former role (EBMR-TAB-013)"
  - "apps/tablets-server/test/session/no-role-binding.test.ts > F10: no browser session for an account that holds no role now (tablets 0480) > [DI-16][DI-38] SANDBOX: the database refuses to bind such a session with no role named (EBMR-TAB-021) or with its former role (EBMR-TAB-013)"
