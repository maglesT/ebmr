jurisdiction: 'acceptance **same** as FDA 2004 (plus FDA: under 5,000 units, one contaminated unit is cause for revalidation after investigation) [chk]; **weaker** than EU Annex 1 (2022) 9.46 (any contaminated unit is a failed APS, normally three successful repeats) [chk]. Frequency: India only "defined intervals"; FDA 2004 semi-annual per line and each authorised person at least yearly [chk]; EU 9.38 twice a year per process, line and shift, and each operator at least one successful APS per year [chk] (both **stricter**).'
