id: ST-56
title: "In-process controls: fill weight/volume and device functional tests"
part: C
group: "Theme 9: Filling, fill weight/volume checks, stoppering and capping"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 386
  - 311
  - 86
sources: "EU Annex 1: 8.101, 8.115 (fill volume as a CPP for FFS/BFS) | US: 211.110(a) (binding); FDA-AP IV.E, VI.B.2; 21 CFR Part 4 (unverified)."
behaviour: |-
  - **IPC definition.** The MBR defines each IPC: trigger (time or unit count), sample size, method, equipment, limits and reaction rules. Examples: fill weight/volume, stopper seating, seal checks. In-line automatic checkweighing is the preferred design because it avoids interventions.
  - **Execution.** A missed IPC is flagged. An out-of-limit result raises a deviation and a 211.192 investigation (ST-63).
  - **Manual checks in ISO 5.** A manual weight check inside ISO 5/Grade A is also logged as an intervention with its duration.
  - **Device presentations.** Scheduled functional IPCs, such as delivery volume and break-loose/glide or activation where relevant. Device-component genealogy is kept (plunger rods, subassemblies).
  - The 21 CFR Part 4 cross-references for combination products are **not verified** (see Open questions).
catalog_test: Miss a 15-min fill-weight check → flagged. Record a manual weight check in ISO 5 → also logged as an intervention.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the Injectables catalogue (slice I-1) > [ST-56][ST-57] filling judges the fill weight at each round and the volume from the bulk density; the stopper-height check is asked for vials only; each unit's fill weight is judged on the mean and on every unit"
