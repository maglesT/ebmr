id: ST-49
title: Radiation- and ethylene-oxide-sterilised materials; UV excluded
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 503
  - 504
  - 505
  - 506
  - 307
sources: "EU Annex 1: 8.71 (UV not acceptable), 8.72–8.78 | US: 211.94(d), 211.113(b); FDA-AP VI.B.1."
behaviour: |-
  - **UV** is not offered as a sterilisation method. It can be logged only as a bioburden-reduction aid.
  - **Irradiated items** record the certificate, processing lot and a dose within the validated range. A dose below the minimum rejects the lot.
  - **EO-sterilised items** cannot be issued until all of the following are recorded:
    - a justification that no other method is practicable;
    - the cycle record: preconditioning time, temperature and RH; gas concentration, pressure and quantity; exposure time;
    - BI results at every validated location, with a positive control per cycle;
    - aeration start, end and conditions, with the **validated minimum aeration elapsed**;
    - residual EO and reaction-product results within limits.
catalog_test: Set a component's method to UV → option unavailable. Issue an EO lot with residuals pending → blocked.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > the Injectables catalogue (slice I-2, aseptic processing and EM) > [ST-40][ST-49] a supplier-sterilised component is accepted by its released lot, named where it is used and verified by a second person, with its sterilisation method (no UV), certificate and dose or cycle reference; a damaged wrap, or for the EU market an indicator that has not changed, is an exception"
  - "packages/recipe-core/test/library/seed-injectables-routes.test.ts > the Injectables catalogue (slice I-4, other containers and routes) > [ST-49][ST-61][IN-47] terminal sterilisation by radiation consumes every filled tray into its numbered load and, per load, records the certificate, the lowest and highest dose measured against the firm's limits (checked by a second person), the dosimeters read, the dose within its period and the package indicators, and registers the irradiated load; ultraviolet is not offered; for the EU market its own block records each load's loading pattern, reconciliation and the plant's signed records, signed by the operator; a dose outside its limits or a failed check is an exception"
clauses:
  - clause: "Set a component's method to UV → option unavailable."
    tests:
      - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > the Injectables catalogue (slice I-2, aseptic processing and EM) > [ST-40][ST-49] a supplier-sterilised component is accepted by its released lot, named where it is used and verified by a second person, with its sterilisation method (no UV), certificate and dose or cycle reference; a damaged wrap, or for the EU market an indicator that has not changed, is an exception"
      - "packages/recipe-core/test/library/seed-injectables-routes.test.ts > the Injectables catalogue (slice I-4, other containers and routes) > [ST-49][ST-61][IN-47] terminal sterilisation by radiation consumes every filled tray into its numbered load and, per load, records the certificate, the lowest and highest dose measured against the firm's limits (checked by a second person), the dosimeters read, the dose within its period and the package indicators, and registers the irradiated load; ultraviolet is not offered; for the EU market its own block records each load's loading pattern, reconciliation and the plant's signed records, signed by the operator; a dose outside its limits or a failed check is an exception"
  - clause: "Issue an EO lot with residuals pending → blocked."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Full EO cycle record, aeration timer, residual results"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "INJ-03 certificate; INJ-21 radiation variant (dose min and max); UV not a CHOICE value (4.2, 4.3)"
build_status: SPECIFIED
jurisdiction: "EU is stricter: EO only as a last resort, and an explicit UV ban."
scope: all
type_detail: ENFORCED (UV exclusion is [EU hard])
