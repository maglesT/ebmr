id: PR-15
title: Competence, role and area authorisation
part: B
group: B. Batch record issuance and execution
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 142
  - 4
  - 634
sources: "US: 211.25(a)-(c); 211.28(c); 11.10(g) | EU: Ch.5 5.1; 5.2; 5.16; EU Ch.2 (s) | ICH/EMA/draft: EU Annex 1 (gowning) (s)"
behaviour: |-
  A user can perform, verify or approve only if they hold a role permitted for that action, step type, MBR and site. Performer and verifier are separate permissions. Optional interlocks:
  - current training on the governing SOP or master version;
  - authorisation for the restricted area where the step runs.
  [I] Gowning and APS qualification for aseptic areas come from Annex 1 and the FDA 2004 aseptic guidance, not from 211.28 (see sterile catalog).
catalog_test: A user whose training has lapsed is refused on the step. A user without area authorisation cannot sign a step in the filling suite.
implemented_by: {}
tests:
  - "apps/tablets-server/test/alarms/area-authorisation-matrix.test.ts > area authorisation in the qualification matrix (PR-15) > [PR-15] area authorisations are recorded in the qualification matrix by the training coordinator, never for oneself, and withdrawn with a reason"
  - "apps/tablets-server/test/alarms/area-authorisation-signature.test.ts > area authorisation at the step (PR-15) > [PR-15] a user without area authorisation cannot sign a step in the controlled area"
  - "apps/tablets-server/test/execution/refusals-and-room-views.test.ts > a QA act on an exception, seen by an operator (R10 #8) > [DI-17][PR-15] the disposition of an exception is never the operator's primary action: it names who may give it; QA sees it as the primary action"
  - "apps/tablets-web/test/office/screen-gaps.test.tsx > plant alarms, equipment data, rooms and reagents > [PR-15] a QA reviewer is offered neither a room rule nor an adjacency"
  - "apps/tablets-web/test/office/screen-gaps.test.tsx > plant alarms, equipment data, rooms and reagents > [PR-15][PR-25][PR-35] the master-data steward saves a room's rules and records an adjacency; a refusal is shown in the database's words"
  - "apps/tablets-web/test/plant-status/area-authorisations.test.tsx > area authorisations (PR-15) > [PR-15] recording oneself is refused by the server and the refusal is shown"
  - "apps/tablets-web/test/plant-status/area-authorisations.test.tsx > area authorisations (PR-15) > [PR-15] the qualification matrix shows each controlled area's authorisations, records a person and withdraws with a reason"
  - "apps/tablets-web/test/plant-status/plant-status.test.tsx > plant displays and rooms > [PR-25][PR-27][PR-15] rooms show cleaning state, clean hold, controlled area and open spills; a room shows its conditions and records a spill"
  - "packages/kernel/test/identity/area-authorisation.test.ts > area authorisation (kernel 1190) > [PR-15][INV-26] an area authorisation counts from its recording, while valid and until withdrawn; a person never records their own"
  - "packages/kernel/test/identity/area-authorisation.test.ts > area authorisation (kernel 1190) > [PR-15][INV-26] an authorisation mirrored from the LMS counts only while the mirror is fresh"
  - "packages/kernel/test/identity/authority.test.ts > qualification at the moment of action (DI-21, INV-26) > [DI-21][INV-26][PR-15] expiring a user's SOP training blocks both execution and verification and names the missing item"
  - "packages/kernel/test/mutation/plant-rules.test.ts > an area authorisation at the edges of its window (kernel 1190) > [PR-15][INV-26] it counts from the microsecond it was recorded and the first microsecond of its validity, and not at the microsecond it ends or is withdrawn"
  - "packages/recipe-core/test/plant-rules/room-rules.test.ts > area authorisation at the step signature (PR-15, kernel 1190) > [PR-15] a user without area authorisation cannot sign a step in the controlled area"
clauses:
  - clause: "A user whose training has lapsed is refused on the step."
    tests:
      - "packages/kernel/test/identity/authority.test.ts > qualification at the moment of action (DI-21, INV-26) > [DI-21][INV-26][PR-15] expiring a user's SOP training blocks both execution and verification and names the missing item"
  - clause: "A user without area authorisation cannot sign a step in the filling suite."
    tests:
      - "packages/recipe-core/test/plant-rules/room-rules.test.ts > area authorisation at the step signature (PR-15, kernel 1190) > [PR-15] a user without area authorisation cannot sign a step in the controlled area"
      - "apps/tablets-server/test/alarms/area-authorisation-signature.test.ts > area authorisation at the step (PR-15) > [PR-15] a user without area authorisation cannot sign a step in the controlled area"
deferred_scope:
  - scope: "The clause's own area: the refusal shown in the Injectables filling suite. Area authorisation is generic and is proven now on a Tablets controlled area (a potent-product suite)."
    phase: 5
    reason: "The filling suite is an Injectables area, built with that edition after Phase 7 (decision 0010); Phase 6 plan D-P6b-5 and owner question 6 (default: the filling-suite test comes with Injectables)."
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: EU 5.16 restricts access to all production premises. US 211.28(c) covers only areas designated as limited-access. EU is broader. Hygiene and illness rules in 211.28(a),(b),(d) are organisational controls, not eBMR controls.
type_detail: "ENFORCED (role/authority check at the moment of each action) + CONFIGURABLE (training-currency interlock and restricted-area interlock). Default: both interlocks ON. Allowed: OFF only where the evidence is controlled in another validated system that the eBMR queries."
