sources: "US: 211.25(a)-(c); 211.28(c); 11.10(g) | EU: Ch.5 5.1; 5.2; 5.16; EU Ch.2 (s) | ICH/EMA/draft: EU Annex 1 (gowning) (s)"
behaviour: |-
  A user can perform, verify or approve only if they hold a role permitted for that action, step type, MBR and site. Performer and verifier are separate permissions. Optional interlocks:
  - current training on the governing SOP or master version;
  - authorisation for the restricted area where the step runs.
  [I] Gowning and APS qualification for aseptic areas come from Annex 1 and the FDA 2004 aseptic guidance, not from 211.28 (see sterile catalog).
catalog_test: A user whose training has lapsed is refused on the step. A user without area authorisation cannot sign a step in the filling suite.
