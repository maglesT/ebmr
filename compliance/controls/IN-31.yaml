id: IN-31
title: Finished-pack label content and coding verification
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 252
sources: Schedule M Part I 17.3.1 (items (a)-(g), including expiry and manufacture date uncoded); Drugs Rules Rule 96 (S).
behaviour: "(a) Artwork templates are typed by destination class: India domestic (Schedule M 17.3.1 plus Drugs Rules Rules 96/97, section C), India export (Rule 94), US, EU. (b) The India-domestic template cannot be approved without fields for: drug name; active ingredients with INN and amount each, and net contents; batch number; **date of manufacture and expiry date in plain (uncoded) form**; special storage/handling; directions, warnings and precautions; name and address of the manufacturer and of the party placing the product on the market. (c) The packaging-record coding check compares every printed variable (batch, manufacturing date, expiry, MRP where applicable) against batch data at start, at intervals and at end. (d) Status labels on containers, equipment and premises follow the company format, optionally colour-coded."
catalog_test: load an India-domestic template without a manufacturing-date field; approval fails. Print an expiry one month off; the coding check fails.
implemented_by: {}
tests:
  - "packages/kernel/test/review/f23.test.ts > F23: a PACK scope resolves a PER_DESTINATION key only for its own destination > [IN-52][IN-31][INV-28] an India-domestic pack cannot be resolved under the US label rule by naming destination US"
  - "apps/tablets-server/test/blocks/packaging/completion.test.ts > G-21 when time passes and steps and the batch close (recipe-core 0581, tablets 0952) > [IN-31] an MRP a person gives is checked by a second person before a print job carries it, and its giver, though holding the rights to check and release, neither checks nor releases"
  - "apps/tablets-server/test/blocks/packaging/db-guards.test.ts > G-21 in the database (recipe-core 0580 to 0582, tablets 0950 to 0952) > [PR-36][IN-31][PR-35][IN-16][PR-42] a print job carries only the record's data, bound to the packaging order and artwork set the line runs; the gateway's echo must equal it or the load is refused; the first print is approved by another person than the one who released the job; a batch-data change voids the job and holds the output since the last good check (L-29)"
  - "packages/recipe-core/test/blocks/g21-edges.test.ts > G-21 PERFORMED and definition > [PR-42][IN-31] GTIN check digits, the configuration as read"
  - "apps/tablets-server/test/india/india-routes.test.ts > the record side over HTTP (Phase 4 slice 6a) > [IN-18][IN-31][PR-43] an issued batch is in the allocation register with its licence; its label particulars and H2 payload come from the record; a payload is issued on the batch and verified, another refused"
  - "apps/tablets-web/test/office/india.test.tsx > the allocation register and the label particulars > [IN-31] a batch's label particulars and its H2 payload are shown as the server computed them"
  - "packages/api-contract/test/india.test.ts > the india namespace (Phase 4 slice 6a) > [IN-30][IN-18][IN-31] every india route lives under /api/india on the GMP installation and has an example that parses"
  - "packages/recipe-core/test/release/india.test.ts > India-domestic label particulars and the Schedule H2 payload stub (recipe-core 0894; IN-31, D-P4-14) > [IN-31] the label particulars and the H2 payload come from the record: plain manufacture and expiry dates, the manufacturer and its licence; refused without a licence basis or a shelf life"
  - "packages/recipe-core/test/release/india.test.ts > India-domestic label particulars and the Schedule H2 payload stub (recipe-core 0894; IN-31, D-P4-14) > [IN-31] H2 payload binding: only the payload computed from the batch record and issued for printing on that batch passes; another batch's, an altered or a never-issued payload is refused; an administrator issues none"
  - "apps/tablets-server/test/mutation/packaging-print-serial-gateway.test.ts > print jobs and events at the gateway (tablets 0951) > [PR-36][IN-31][DI-31] the gateway fetches the released jobs of its own active printers; acknowledges a job of its own once, in form: LOADED only when the echo is the job's data (else REFUSED), MISMATCH and FAILED as reported; the same acknowledgement again is a duplicate"
  - "packages/recipe-core/test/mutation/india-h2-and-allocation.test.ts > the label particulars of a batch (recipe-core 0894, recipe.india_label_particulars) > [IN-31] a batch planned but not issued, or a batch of the sandbox, has no label particulars"
  - "packages/recipe-core/test/mutation/india-h2-and-allocation.test.ts > the label particulars of a batch (recipe-core 0894, recipe.india_label_particulars) > [IN-31] [IN-30] a batch without a licence basis of its own takes its packaging parent's, never another batch's; without either it has no particulars"
  - "packages/recipe-core/test/mutation/india-h2-and-allocation.test.ts > the H2 payload (recipe-core 0894, recipe.h2_payload, recipe.h2_payload_problem) > [IN-31] a value the payload cannot carry is refused: none, one that is not printable text, one with ; or ="
  - "packages/recipe-core/test/mutation/india-h2-and-allocation.test.ts > the H2 payload (recipe-core 0894, recipe.h2_payload, recipe.h2_payload_problem) > [IN-31] an unknown batch has no payload; a payload computed now that was never issued fails although an earlier payload of the batch was issued"
clauses:
  - clause: "load an India-domestic template without a manufacturing-date field; approval fails."
    deferred:
      phase: 6
      reason: "There is no label template with its own fields to approve (print data always carries the record's dates), so no template approval can fail; label templates come in Phase 6 (owner decision 0011)."
  - clause: "Print an expiry one month off; the coding check fails."
    tests:
      - "apps/tablets-server/test/blocks/packaging/db-guards.test.ts > G-21 in the database (recipe-core 0580 to 0582, tablets 0950 to 0952) > [PR-36][IN-31][PR-35][IN-16][PR-42] a print job carries only the record's data, bound to the packaging order and artwork set the line runs; the gateway's echo must equal it or the load is refused; the first print is approved by another person than the one who released the job; a batch-data change voids the job and holds the output since the last good check (L-29)"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: "**stricter** than FDA (lot number and expiration date required under 21 CFR 201.17 and 211.137; no manufacturing date) [gk] and EU Directive 2001/83/EC Article 54 (expiry and batch number; no manufacturing date) [gk]. Applies to India-domestic packs; export packs follow IN-52 destination rules and Rule 94."
type_detail: ENFORCED (per destination template); CONFIGURABLE (template contents per market).
notes: "Source check: P for Schedule M (item list re-read); S for Rule 96."
