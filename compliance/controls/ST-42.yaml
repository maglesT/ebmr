id: ST-42
title: Product-contact parts sterile and traceable; aseptic assembly and connections
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 431
  - 336
  - 462
  - 463
  - 371
sources: "EU Annex 1: 5.5, 8.12–8.14 | US: 211.67, 211.113(b) (binding); FDA-AP IX.C, Appendix 1.E."
behaviour: |-
  - The MBR lists every **direct and indirect** product-contact item: needles, pumps, manifolds, tubing, filter housings, stopper bowls, guides and hoppers.
  - At fill start each item must resolve to a passed sterilisation record (steriliser, cycle, validated load pattern), a SIP record or a supplier irradiation certificate. It must also be within sterile hold with packaging intact. Otherwise fill start is blocked and the item is named.
  - Each item declares its method: SIP, autoclave, dry heat or irradiation. *Surface decontamination* (for example VHP) is allowed for a product-contact surface only on heat-labile items **and** only with a validation reference showing **≥6-log** reduction. Heat-tolerant items cannot be assigned decontamination.
  - Unwrapping, assembly and line set-up are "aseptic" steps. They force Grade A with a Grade B background (isolator background per ST-74), aseptic-qualified operators, and intervention and EM linkage.
  - Each aseptic connection records its method:
    - open, in Grade A with Grade B background;
    - post-connection SIP (cycle ID);
    - intrinsic sterile connector (type, lot).

    An open connection outside Grade A is blocked.
catalog_test: Leave one pump head without an autoclave link → fill start blocked with the item named. Assign VHP to a stainless needle → MBR approval refused.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > the Injectables catalogue (slice I-2, aseptic processing and EM) > [ST-42][ST-46] aseptic assembly records each connection of the formulation's list as made under Grade A and, for the EU market in its own block, the transfer into Grade A/B by the validated method; either answered no is an exception"
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > the Injectables catalogue (slice I-2, aseptic processing and EM) > [ST-48][ST-42] sterilisation in place records the cycle values from the printout as critical values with limits, checked by a second person; a temperature or exposure below the minimum is an exception"
