id: ST-41
title: "Container and closure preparation: wash, rinse, siliconisation, sterilisation/depyrogenation, hold"
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 303
  - 304
  - 305
  - 308
  - 29
sources: "EU Annex 1: 8.18(i)-(ii) | US: 211.94(c)-(d) (binding); FDA-AP VI (text box), VI.B.1."
behaviour: |-
  - Each container or closure lot needs a complete preparation record before the filler can accept it. The record contains:
    - wash program ID and water point, with water status in specification (parenterals: final rinse at WFI quality; stoppers: first washes with low-endotoxin purified water or better, final rinse with WFI);
    - wash-end, drying-end and sterilisation-start timestamps, with a maximum wash-to-sterilise time;
    - silicone lot (must be released);
    - validated stopper load configuration (bag count, fill level) and penetration-validated recipe;
    - depyrogenation or sterilisation cycle ID, equipment and load.
  - At cycle end a use-by time is computed from the MBR hold limit for that item and pack type. Use after it is blocked or deviation-gated.
  - The preparation process's revalidation due date is checked at line clearance.
catalog_test: Stoppers sterilised at T0 with a 72 h hold are used at T0+73 h → blocked. A stopper load with a wash record but no sterilisation cycle → refused at the filler.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the Injectables catalogue (slice I-1) > [ST-41][ST-43][ST-47][ST-61] values typed from a device printout (washer, depyrogenation, parts and terminal sterilisation) are judged against the firm's limits, critical where a clause names the value (the sterilising temperature, hold time and F0, the depyrogenation temperature), and a second person of another role checks them against the printout"
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the master's time limits between injectables steps (slice I-6.3) > [ST-41] stoppers sterilised with a 72 h use-by and used 73 h later: the use-by is breached, filling cannot start, and the exception needs a deviation and QA's disposition"
