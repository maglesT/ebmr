clauses:
  - clause: "Configure a Grade B active-air action limit of 15 CFU/m³ → rejected."
    # Binding per market (paraphrased; checked against docs/regulatory/sources-extracted/):
    #   EU (EU-market batches): EU GMP Annex 1 (2022) 9.30 and Table 6 set the Grade B maximum action limits for
    #     viable contamination: active air 10 CFU/m3; settle plate (90 mm, 4 h), contact plate (55 mm) and glove
    #     print (5 fingers) 5 CFU each.
    #   India (every batch): Schedule M Part II 4.9 and Table 3 give the same Grade B numbers (10, 5, 5, 5), counted
    #     as binding under docs/build-plan/injectables/control-decisions.md (Q0; IN-42).
    #   Both rows are HARD in compliance/rule-tables/sterile/sterile.v1.yaml (ST-20.EU.B.*, ST-20.IN.B.*).
    tests:
      - "apps/tablets-server/test/designer/market-set.test.ts > Grade B viable action limits of an injectables master, per market (ST-01, ST-20) > [ST-01][ST-20] EU: an EU-market master with a Grade B active-air action limit of 15 CFU/m3 is refused by Annex 1 Table 6 (10, governed by EU and IN); exactly 10 is accepted"
      - "apps/tablets-server/test/designer/market-set.test.ts > Grade B viable action limits of an injectables master, per market (ST-01, ST-20) > [ST-01][ST-20] India: an India-only master with a Grade B active-air action limit of 15 CFU/m3 is refused by Schedule M Table 3 (10, governed by IN); exactly 10 is accepted"
      - "packages/kernel/test/market/site-values.test.ts > tighten only > [ST-01][ST-20] EU: Annex 1 Table 6 binds a Grade B active-air action limit of 10 CFU/m3 (settle, contact and glove 5) as HARD for a site and a batch serving the EU; 15 is refused with or without a CCS reference and QA approval, one above each limit is refused, and exactly the limit is accepted"
      - "packages/kernel/test/market/site-values.test.ts > tighten only > [ST-01][ST-20] India: Schedule M Part II Table 3 binds a Grade B active-air action limit of 10 CFU/m3 (settle, contact and glove 5) as HARD for an India-only site and batch; 15 is refused with or without a CCS reference and QA approval, one above each limit is refused, and exactly the limit is accepted"
  - clause: "Configure a 7 Pa B/C differential → accepted only with a CCS reference and QA e-signature."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "guidance values are plain formulation values"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "hard numbers from binding tables only; guidance values are plain formulation values"
build_status: SPECIFIED
jurisdiction: EU is stricter. It turns stated numbers into minimums, while FDA-AP allows justified alternative microbial action levels.
scope: all
type_detail: ENFORCED (floor table locked). Individual site values are CONFIGURABLE only in the tightening direction.
