  - "packages/kernel/test/market/site-values.test.ts > QA approval of a loosening (F24, F76) and what it covers (F25) > [IN-52][ST-01][DI-09] the person who sets the loosening cannot approve it, even holding a QA role"
  - "packages/kernel/test/market/site-values.test.ts > QA approval of a loosening (F24, F76) and what it covers (F25) > [IN-52][ST-01] an operator cannot sign a site-value loosening approval: only the quality unit can"
  - "packages/kernel/test/market/site-values.test.ts > QA approval of a loosening (F24, F76) and what it covers (F25) > [IN-52][ST-01] an approved loosening applies only while the resolution departs from the approved value; after a tightened table it is flagged, not applied, and listed on the impact list"
