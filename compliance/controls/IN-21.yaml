  - "packages/recipe-core/test/plant/area.test.ts > the verifier signs the recorded finding (S23, S24) > [IN-21][INV-15] the verifier's signature covers the performer's finding: a FAILED clearance cannot be verified as PASSED, and a signature of one clearance verifies no other"
  - "packages/recipe-core/test/plant/area.test.ts > a clearance follows the cleaning it checks (INV-15) > [INV-15][IN-21] a clearance recorded before the area was dirtied and cleaned again does not clear it"
