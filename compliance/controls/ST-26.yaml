id: ST-26
title: "Water for injection: draw record, daily sampling, excursions and sanitisation hold"
part: C
group: "Theme 3: Utilities (WFI, clean steam, gases)"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
