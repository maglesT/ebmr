    - "apps/tablets-server/src/features/access/index.ts (lock, unlock by the same person on the same terminal, keep-alive with a tap, switch user by badge and PIN)"
    - "apps/tablets-server/sql/0100_tab_attribution.sql (attribution method per shop-floor class, audited history)"
    - "apps/tablets-web/src/features/access/controller.tsx (BadgeTapPort, switch offers, lock overlay, session poll)"
    - "packages/ui-kit/src/machines/kiosk-lock.ts"
    - "packages/ui-kit/src/identity/LockOverlay.tsx"
    - "packages/ui-kit/src/identity/BadgePrompt.tsx"
    - "apps/tablets-server/sql/0550_session_terminal_key.sql"
    - "apps/tablets-web/src/api/page-binding.ts"
  invariants:
    - "INV-11"
    - "INV-40"
  guards:
    - "iam.check_static_segregation (triggers on iam.role_grant and iam.role_permission): generic and READONLY_DISPLAY accounts hold READ permissions only; SERVICE and INTEGRATION accounts never hold SIGN or ACKNOWLEDGE permissions"
    - "kernel.validate_actor_context: generic and read-only display accounts can never start a command (EBMR-IAM-106); sources SYSTEM and INTEGRATION only for service accounts, UI and API only for people"
    - "iam.authn_resolve: service keys only for service accounts on SERVER devices, interactive methods never for service accounts, read-only accounts never authenticate to act or sign (alerted)"
    - "INV-40: every command on a SHARED or GRADE_A_B device consumes a fresh authentication event of its own person made on that device (kernel.validate_actor_context, iam.use_auth_event_for_command)"
    - "pageBindingRefusal (bind.ts) on tab.resolve_session's terminal key (tablets 0550): a request whose page names its terminal key or the person its session started with is served as nobody when the cookie's session was opened on another terminal (401 SESSION_OTHER_TERMINAL) or is another person's (401 SESSION_CHANGED); the SPA names both on every request (page-binding.ts, the person kept per tab) and then shows the sign-in form or says that its sign-in changed, never working in that session (review F41, round 4; residuals in decision F41.1)"
  db_constraints:
    - "iam.account_one_gmp_account_per_person (partial unique index)"
    - "iam.directory_scan(): invariant query, zero rows expected"
  policies:
    - "attribution.freshness_seconds.SHARED"
    - "attribution.freshness_seconds.GRADE_A_B"
    - "session.idle_timeout_seconds.SHARED"
    - "session.idle_timeout_seconds.GRADE_A_B"
