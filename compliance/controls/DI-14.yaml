id: DI-14
title: Unique personal accounts; no shared write-capable accounts
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 63
  - 173
  - 226
  - 47
  - 159
sources: "US: 11.10(d), 11.10(g), 11.100(a), 11.300(a); 211.68(b), 211.188(b)(11), 211.194(a)(7)-(8); FDA DI Q&A Q5 | EU: Annex 11 §12.1, §12.4 | ICH/EMA/draft: draft Annex 11 §11 identity and access management (shared accounts read-only only) (draft)(s)(u)"
behaviour: |-
  - Every GMP action requires an individually assigned, authenticated account. GMP actions are create, change, verify, review, approve, sign and acknowledge (including alarm acknowledgment).
  - An account flagged generic or shared cannot be given any write, sign, verify or acknowledge permission. The engine checks this when a role is assigned, not only by policy.
  - A shared read-only view (e.g., a line-status display) is allowed only if it is technically unable to create, change, sign, verify or acknowledge anything.
  - Interface and service accounts are non-interactive and cannot sign. Their entries are attributed to the interface or device.
  - On shared terminals, each entry is attributed to the person who authenticated for that entry. Re-authentication is fast (e.g., badge plus PIN).
  - Injectables: cleanroom terminals use a method that works with gloves (badge/RFID plus PIN, or biometrics), so a shared login is never needed.
catalog_test: Assign a write permission to an account flagged generic. Refused. A service account attempts a signature. Blocked. A directory scan finds no generic account holding GMP permissions.
implemented_by:
  modules:
    - "packages/kernel/src/identity/authority.ts"
    - "packages/kernel/src/identity/sessions.ts"
    - "packages/kernel/sql/0120_iam_roles_grants.sql"
    - "packages/kernel/sql/0160_iam_authentication_sessions.sql"
    - "packages/kernel/sql/0180_iam_lifecycle.sql"
    - "packages/kernel/sql/0190_iam_actor_context.sql"
  invariants:
    - "INV-11"
    - "INV-40"
  guards:
    - "iam.check_static_segregation (triggers on iam.role_grant and iam.role_permission): generic and READONLY_DISPLAY accounts hold READ permissions only; SERVICE and INTEGRATION accounts never hold SIGN or ACKNOWLEDGE permissions"
    - "kernel.validate_actor_context: generic and read-only display accounts can never start a command (EBMR-IAM-106); sources SYSTEM and INTEGRATION only for service accounts, UI and API only for people"
    - "iam.authn_resolve: service keys only for service accounts on SERVER devices, interactive methods never for service accounts, read-only accounts never authenticate to act or sign (alerted)"
    - "INV-40: every command on a SHARED or GRADE_A_B device consumes a fresh authentication event of its own person made on that device (kernel.validate_actor_context, iam.use_auth_event_for_command)"
  db_constraints:
    - "iam.account_one_gmp_account_per_person (partial unique index)"
    - "iam.directory_scan(): invariant query, zero rows expected"
  policies:
    - "attribution.freshness_seconds.SHARED"
    - "attribution.freshness_seconds.GRADE_A_B"
    - "session.idle_timeout_seconds.SHARED"
    - "session.idle_timeout_seconds.GRADE_A_B"
tests:
