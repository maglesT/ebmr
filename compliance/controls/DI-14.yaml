  - "packages/kernel/test/identity/attribution.test.ts > [DI-14] every GMP action needs a real, active, individually assigned account, its own live session and a role it holds"
  - "packages/kernel/test/identity/attribution.test.ts > [DI-14] service identities act only with source SYSTEM or INTEGRATION and people never do"
  - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-14] a kiosk session locks after the idle timeout and only its own person can unlock it"
  - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-14] a login event opens one session only, on the device where it was made, and never after the secret must change"
  - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-14] extending a shop-floor session before the lock needs a badge tap of the session owner"
  - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-14] one active shop-floor session per person: a login on another terminal ends the old one"
  - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-14] the absolute timeout ends a session whatever its activity; logout ends it at once"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] a directory scan finds no generic account holding GMP permissions, and it would find one"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] a line display owned by a shop-floor worker does not end the worker's personal kiosk session"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] a read-only display account can log in to view but is technically unable to start any command"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] a service account attempting a signature is blocked everywhere"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] assigning a write permission to an account flagged generic is refused at assignment"
  - "packages/kernel/test/identity/generic.test.ts > [DI-14] on a shared terminal each entry belongs to the person who authenticated for that entry"
  - "packages/kernel/test/identity/seed.test.ts > [DI-14] a seeded operator on a personal device runs a GMP command attributed to their person, account, session and device"
  - "packages/kernel/test/identity/seed.test.ts > [DI-14] a seeded service account runs commands with source SYSTEM"
  - "packages/kernel/test/identity/seed.test.ts > [DI-14] the installation bootstrap yields an administrator and a process owner who can run commands"
  - "packages/kernel/test/identity/seed.test.ts > [DI-14][INV-40] a seeded operator on a shared device runs one command per fresh badge tap"
