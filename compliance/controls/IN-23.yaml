    tests:
      - "packages/recipe-core/test/blocks/material.test.ts > G-07 weighing and dispensing > [PR-18][IN-23] a quarantined lot, an expired lot, a lot past retest and the wrong material are hard-blocked with no override"
      - "apps/tablets-server/test/blocks/dispensing/tb-01.test.ts > TB-01@1 potency-adjusted dispensing (engine) > [PR-18][IN-23][IN-24] a quarantined lot, a lot past its retest date, an expired lot and the wrong material are hard-blocked in the calculation and at the balance, with no override; without an identity result a batch for the US is refused"
