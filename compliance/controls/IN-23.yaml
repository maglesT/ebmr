id: IN-23
title: Dispensing
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 3
target_phase_source: outline
requirement_rows:
  - 248
sources: Schedule M Part I 14.14, 14.16-14.20.
behaviour: Container-level barcode identity check; hard block on any lot not released by QC, expired, or past retest; only users in the designated-dispenser role may dispense; each weighing or measurement is independently checked by a second person or by a validated balance interface configured as the independent check; dispensed materials for a batch are kept and labelled together with a kit label linked to the batch.
catalog_test: scan a quarantined lot, an expired lot and a lot past retest; all refused.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/material.ts (G-07)"
  guards:
    - "G-07: quarantined, expired and past-retest lots and the wrong material are hard-blocked with no override (G07-LOT-STATUS, G07-LOT-EXPIRED, G07-LOT-RETEST, G07-WRONG-MATERIAL); status arrives with the entry until Phase 3 checks it at the database"
tests:
  - "packages/recipe-core/test/blocks/material.test.ts > G-07 weighing and dispensing > [PR-18][IN-23] a quarantined lot, an expired lot, a lot past retest and the wrong material are hard-blocked with no override"
  - "packages/recipe-core/test/mutation/entry-references-and-schema.test.ts > recipe-core 0330: the checklists, the lot and the entry its block builds (DI-05, DI-10, DI-30, PR-14, PR-18, PR-23, PR-29, PR-34, PR-47) > [PR-18][IN-23][PR-21] a lot is of the material its BOM line names even where the line names null (sql 0372): the engine refuses that lot (G07-WRONG-MATERIAL), and so does the database, for the lot and for the row that stores its charge"
  - "apps/tablets-server/test/blocks/dispensing/tb-01-db.test.ts > TB-01 end to end in a test run (sandbox) > [PR-18][IN-23] a quarantined lot and a lot past its retest date are refused in the calculation; a lot without an approved result blocks it"
  - "apps/tablets-server/test/blocks/dispensing/tb-01-gmp.test.ts > TB-01 on the GMP installation (site lots, reservations, consumption) > [PR-18][IN-23] a quarantined lot of the site register is refused in the calculation; the released lot's approved result raises the active target and lowers the filler"
  - "apps/tablets-server/test/blocks/dispensing/tb-01.test.ts > TB-01@1 potency-adjusted dispensing (engine) > [PR-18][IN-23][IN-24] a quarantined lot, a lot past its retest date, an expired lot and the wrong material are hard-blocked in the calculation and at the balance, with no override; without an identity result a batch for the US is refused"
clauses:
