jurisdiction: Apply both. EU adds sampling on every Grade B exit and after critical interventions, followed by a glove change. FDA-AP adds daily or per-lot glove sampling and forbids sanitising gloves just before sampling.
scope: aseptic
type_detail: "ENFORCED (sampling after critical interventions and at Grade B exit, outer-glove change). Frequencies are CONFIGURABLE, never below: gloves at least daily or per lot (FDA allows either), and on each Grade B exit."
