id: PR-02
title: Master preparation, independent check and quality-unit approval
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 97
  - 618
sources: "US: 211.186(a); 211.100(a); 211.22(c); 11.1(c); 11.100(c) | EU: Ch.4 Principle (instructions error-free and in writing); 4.1; 4.2; 4.3; 4.4 | ICH/EMA/draft: none"
behaviour: |-
  Master lifecycle is Draft -> Checked -> Approved -> Effective. The minimum route is:
  - the preparer's dated e-signature;
  - an independent checker's dated e-signature (a different individual from the preparer);
  - a quality-unit approval e-signature.
  Before the checker can sign, automated consistency checks run: BOM total against batch size, unit consistency, formula syntax, limits within registered values, and a typed entry field for every data point. The effective date is mandatory, and approval does not make the master executable before that date. Every master and every rendered output carries a unique document ID and version. Customers may add signers but cannot remove the minimum. A "skip review" switch exists only in non-GMP test mode.
catalog_test: When the same user tries to prepare and check a master, the check is refused. A master with no effective date cannot be approved. A seeded unit error is caught before the check signature.
implemented_by:
  modules:
    - "packages/recipe-core/src/lifecycle/machine.ts (MBR version machine: SUBMIT with Sig PREPARED, CHECK with Sig CHECKED, APPROVE with Sig APPROVED)"
    - "packages/recipe-core/sql/0140_machine_mbr_version_v1.sql (transition table generated from the XState machine)"
    - "packages/recipe-core/sql/0110_mbr_family_version.sql (versions, draft attributes, draft cycles, version log)"
    - "packages/recipe-core/sql/0130_mbr_guards.sql (signed content of a version, guards)"
    - "packages/recipe-core/sql/0120_mbr_evidence.sql (validator result stored with the exact content hash)"
    - "packages/recipe-core/sql/0180_review_inventory_invariants.sql (document ID and version in recipe.document_inventory; recipe.inv04_violations)"
    - "packages/recipe-core/src/lifecycle/commands.ts, packages/recipe-core/src/lifecycle/verification.ts"
  invariants:
    - "INV-04"
  guards:
    - "mbr_version.validator_passed (DRAFT -> IN_VERIFICATION): the automated consistency checks of the static validator (units, formulae, limits, BOM, data entry) pass with zero errors and justified warnings on the exact content, before any check signature is possible"
    - "mbr_version.prepared_by_author and mbr_version.signed_in_state: PREPARED by the version author, every signature applied at its own step"
    - "mbr_version.checker_independent and mbr_version.approver_independent (INV-04): author, checker and approver are three persons; nobody who edited since the last entry into DRAFT signs CHECKED or APPROVED; checker = approver only with S4"
    - "mbr_version.effective_date_set: no approval without an effective date; a market authorisation never takes effect before the version effective date (recipe.activate_market_authorisation)"
  db_constraints:
    - "State changes only through platform.transition along the published machine; the application role writes no recipe or state table"
    - "Signatures only through esig with the mbr_version content provider (content hash plus key fields); every signed table registered, so a change supersedes them (INV-09)"
    - "recipe.inv04_violations() recomputes INV-04 from the state history, signatures and version log"
  policies:
    - "mbr.checker_may_approve (S4, market policy engine; missing or NOT_ALLOWED = checker and approver differ)"
