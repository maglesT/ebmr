id: DI-13
title: Security baseline, confidentiality and non-repudiation evidence
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 176
  - 615
sources: "US: 11.10 introductory text (authenticity, integrity, confidentiality when appropriate, non-repudiation), 11.30; 211.68(b) (backup data secure from alteration, erasure, loss) | EU: Annex 11 §7.1, §12.1, §12.2 | ICH/EMA/draft: draft Annex 11 §15 security incl. reported 15.19 penetration testing (draft)(s); draft Annex 11 §10 encryption, §11 MFA for remote access (draft)(s)"
behaviour: |-
  - Encryption:
  - TLS on all client and interface connections; plain HTTP is refused.
  - Encryption at rest for the DB, attachments, backups and archives.
  - Access to confidential data (formula composition, personal data) is restricted by role and site.
  - Shop-floor clients are hardened: kiosk mode, removable storage disabled.
  - Platform hygiene:
  - malware protection and patch SLAs;
  - segmentation between the OT line network and the IT network;
  - isolation of unsupported platforms.
  - MFA is required for all remote access and all privileged access.
  - Internet-exposed or SaaS deployments are penetration-tested periodically.
  - RTO and RPO are documented per module. The execution module has the tightest RPO (Injectables: continuous aseptic filling).
  - Each signature has a non-repudiation evidence package: identity-verification record, authentication event, manifestation and audit trail.
catalog_test: A non-TLS connection is refused. USB storage on a kiosk is blocked. A user without formula permission cannot open the composition. For a sampled signature, the evidence package can be produced.
implemented_by:
  modules:
    - "packages/kernel/src/continuity/security-baseline.ts (assertProductionConfig, assertEncryptedDatabaseSession, checkPgHba, checkPostgresqlConf)"
    - "packages/kernel/src/continuity/hardening.ts"
    - "packages/kernel/src/continuity/backup-drill.ts (AES-256-GCM encryption of backups at rest)"
    - "ops/postgres/pg_hba.conf.template"
    - "ops/postgres/postgresql.tls.conf.template"
    - "docs/security/security-baseline.md"
    - "docs/security/threat-model.md"
    - "docs/security/asvs-l2-review.md"
  guards:
    - "continuity.assert_device_hardened (enrolment guard for SHARED and GRADE_A_B devices; wiring into device enrolment by the lead)"
    - "assertProductionConfig refuses non-TLS database URLs, non-HTTPS servers, plain-HTTP serving, weak cookies and plain-text integration endpoints"
    - "assertEncryptedDatabaseSession refuses a database session that pg_stat_ssl reports as not encrypted"
  db_constraints:
    - "continuity.device_hardening_attestation: PASS only if USB mass storage blocked, malware protection active, OS patched and (SHARED, GRADE_A_B) kiosk mode enforced; insert-only and audited"
    - "continuity.record_hardening_attestation: re-attestation interval 30-365 days"
tests:
  - "packages/kernel/test/continuity/hardening.test.ts > [DI-13] a SHARED or GRADE_A_B device without a hardening attestation cannot be enrolled"
  - "packages/kernel/test/continuity/hardening.test.ts > [DI-13] USB storage on a kiosk is blocked: an attestation that finds USB mass storage enabled fails and blocks enrolment"
  - "packages/kernel/test/continuity/hardening.test.ts > [DI-13] kiosk mode, malware protection and patch level are required on grade A/B terminals"
  - "packages/kernel/test/continuity/hardening.test.ts > [DI-13] a newer failing attestation, a revocation or expiry ends the permission to enrol"
  - "packages/kernel/test/continuity/hardening.test.ts > [DI-13] attestations are recorded only through the attestation function, with a bounded re-attestation interval"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] a database URL that would allow a connection without TLS is refused"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] a server configuration that would serve plain HTTP or weak sessions is refused"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] interface connections must use encrypted transports"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] a complete TLS configuration passes; the same gaps in development are only warnings"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] a non-TLS database session is refused by the server-side check"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] a client that requires a verified TLS connection never falls back to plain text"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] an encrypted session passes the server-side check (when the database server offers TLS)"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] the pg_hba.conf template admits network connections only over TLS with SCRAM or certificates"
  - "packages/kernel/test/continuity/security-baseline.test.ts > [DI-13] the postgresql.conf template turns TLS on with TLS 1.2 or later and SCRAM hashing"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: The 2011 texts set general protection duties. The draft Annex 11 is prescriptive, and the kernel designs to it.
type_detail: "ENFORCED for TLS, encryption at rest, and MFA on remote/privileged access (designed to the stricter draft; no conflict). CONFIGURABLE for RTO/RPO values and pen-test frequency (DESIGN-CHOICE defaults: annual pen test; RPO set by risk)."
