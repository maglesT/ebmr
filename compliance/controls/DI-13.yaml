  guards:
    - "continuity.assert_device_hardened (enrolment guard for SHARED and GRADE_A_B devices; wiring into device enrolment by the lead)"
    - "assertProductionConfig refuses non-TLS database URLs, non-HTTPS servers, plain-HTTP serving, weak cookies and plain-text integration endpoints"
    - "assertEncryptedDatabaseSession refuses a database session that pg_stat_ssl reports as not encrypted"
    - "esig.evidence_package: signature row, stored manifestation, authentication event (components, method, terminal, time; no secret, verifier or badge UID), identity-verification record, signer as at signing, authority and segregation evaluations, delegation, invalidation, seal with payload check, integrity problems and the audit chains of the record and its signatures with their verification"
    - "installSecurity: an API request that carries this installation's session or CSRF cookie more than once is served as nobody (401 COOKIE_DUPLICATED) and the copies other pages set are removed; helmet's headers are set before the gate, and Fastify's framework errors carry them too (review F41, F43)"
    - "sign-out-mark.ts: the mark of an unconfirmed sign-out is kept only in site storage and this origin's broadcast channel, never in a cookie other ports of the host can write (review F42)"
    - "pageBindingRefusal (bind.ts) on tab.resolve_session's terminal key (tablets 0550): a request whose page names its terminal key or the person its session started with is served as nobody when the cookie's session was opened on another terminal (401 SESSION_OTHER_TERMINAL) or is another person's (401 SESSION_CHANGED); the SPA names both on every request (page-binding.ts, the person kept per tab) and then shows the sign-in form or says that its sign-in changed, never working in that session (review F41, round 4; residuals in decision F41.1)"
  db_constraints:
    - "continuity.device_hardening_attestation: PASS only if USB mass storage blocked, malware protection active, OS patched and (SHARED, GRADE_A_B) kiosk mode enforced; insert-only and audited"
    - "continuity.record_hardening_attestation: re-attestation interval 30-365 days"
