      reason: "No permission to read a composition exists yet: every role that may open the designer reads an MBR's bill of materials. Formula confidentiality comes with the company formulation library and the master-data screens in Phase 3 (decision 0006); recorded for the owner in docs/decisions/phase-2-open-questions.md (F14.3)."
  - clause: "For a sampled signature, the evidence package can be produced."
    tests:
      - "packages/kernel/test/esig/integrity.test.ts > [DI-13] for a sampled signature the evidence package can be produced: identity verification, authentication event, manifestation, audit trail and seal"
