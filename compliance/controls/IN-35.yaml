    - "packages/recipe-core/src/blocks/generic/recording.ts (G-13)"
    - "packages/recipe-core/src/blocks/generic/material.ts (G-23)"
  guards:
    - "A readings set with fewer values than planned is refused (ENG-VALUE-READINGS); every reading is kept individually"
    - "G-23: rejects are held in an identified container (G23-CONTAINER)"
