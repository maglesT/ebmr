sources: "US: 211.100(b); 211.192 | EU: Ch.5 5.15; Ch.4 4.20(h); 4.21(g); 4.29 | ICH/EMA/draft: Annex 16 section 3 and EMA Q&A on Annex 16 (s); ICH Q9(R1) 6.1 (s); EU GMP Ch.1 (s)"
behaviour: |-
  - Creation: a deviation raised from a step pre-fills the batch, step, master version, equipment and materials.
  - Classification: planned or unplanned; impact on a registered detail, on GMP, or neither; severity.
  - Approval and holds: a competent person approves it, with QC involved for quality-relevant classes. Linked batches are placed on hold.
  - Annex 16 section 3 fields (EU in set), for certifying a batch with an unexpected deviation:
    - confirmation that registered specifications are met;
    - a QRM impact assessment;
    - root cause and actions;
    - an assessment of whether a variation is needed.
  - Recurrence and register: a counter warns when the same deviation recurs. A register of batches certified under this route is kept for the PQR.
  - Availability impact (design choice): an optional field for shortage-sensitive products. Availability can never override a quality disposition.
catalog_test: A failure of a registered limit creates a deviation with the MA flag. The third recurrence shows a warning on the certification screen.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/exceptions.ts, packages/recipe-core/src/engine/batch.ts (dispositionException)"
  guards:
    - "A registered-limit breach raises a registration-relevant deviation requirement that only QA dispositions; the operator cannot clear it"
tests:
  - "packages/recipe-core/test/engine/exceptions.test.ts > limit tiers at execution (PR-08) > [PR-08][PR-49] a registered-limit breach needs a registration-relevant deviation that only QA dispositions; the operator cannot clear it; the stage cannot be signed off before"
  - "apps/tablets-server/test/execution/db-guards-disposition-involvement.test.ts > F11: a person involved in the step that raised an exception never dispositions it (INV-03, PR-13, PR-49) > [INV-03][PR-13][PR-49][DI-17] a person who entered data in the raising step, also holding QA_SHOP_FLOOR, cannot disposition the exception through the store directly: the kernel refuses the signature, nothing is recorded"
  - "packages/recipe-core/test/execution/sql-guards.test.ts > dispositions (P25) > [INV-03][PR-13][PR-49] a disposition by a person who started, entered data in, corrected or signed performed the step that raised the exception is refused (EBMR-EXE-087, recipe-core 0306), as the engine refuses it; anyone else, and an exception raised at no step, is accepted"
  - "apps/tablets-server/test/execution/db-guards-disposition-involvement.test.ts > F11: a person involved in the step that raised an exception never dispositions it (INV-03, PR-13, PR-49) > [INV-03][PR-13][PR-49] a disposition by a person who was involved in the raising step before it, landed in the store behind the writers' back, is reported by the invariant query"
  - "apps/tablets-server/test/execution/db-guards-proposal-race.test.ts > F37: a proposed decision never lands on a signed content version (INV-09, DI-37) > [INV-09][DI-37][PR-49] a disposition proposed through the store while QA1's signed disposition commits waits for it and is refused; QA1's signature stays VALID over its own disposition"
  - "apps/tablets-server/test/execution/db-guards-proposal-race.test.ts > F37: a proposed decision never lands on a signed content version (INV-09, DI-37) > [INV-09][DI-37][PR-49] a disposition is never proposed on a content version a disposition was already signed on, even with the exception still open"
  - "apps/tablets-server/test/execution/db-guards-disposition-involvement.test.ts > F11: a person involved in the step that raised an exception never dispositions it (INV-03, PR-13, PR-49) > [INV-03][PR-13][PR-49][DI-17] a person whose own rows on the raising step left them out of its lists and dropped their INVOLVEMENT events is still excluded: the accepted rows name them, so the kernel refuses the signature and nothing is recorded"
  - "apps/tablets-server/test/execution/db-guards-disposition-involvement.test.ts > F11: a person involved in the step that raised an exception never dispositions it (INV-03, PR-13, PR-49) > [INV-03][PR-13][PR-49][DI-17] a disposition signed before its signer acted in the raising step, then stored after that act in the same transaction, is refused by the store (EBMR-EXE-087): the accepted rows before it name the signer"
  - "apps/tablets-server/test/execution/db-guards-disposition-involvement.test.ts > F11: a person involved in the step that raised an exception never dispositions it (INV-03, PR-13, PR-49) > [INV-03][PR-13][PR-49] a disposition by a person whose accepted command acted in the raising step before it, landed in the store with the triggers off (a restore), is reported by the invariant query although the step lists and events leave the person out"
