id: PR-49
title: Deviation record, classification and approval
part: B
group: H. Deviations, investigations and CAPA
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 119
