id: IN-49
title: Sterility-test sampling and release review
part: D
group: Injectables edition
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 259
sources: Schedule M Part II 2.1-2.3; 4.8.
behaviour: "The record marks mandatory sterility-sample pulls: first and last units of an aseptic fill and after every significant interruption (logging an interruption automatically adds a pull after restart); for heat-sterilised loads, units from the potentially coolest position. The release review screen presents processing record, EM data (aseptic) and sterility result together and requires each to be opened and acknowledged. Parametric release mode is available only when the product licence permits it."
catalog_test: log a significant stoppage; a sterility pull after restart becomes mandatory.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > what the approved MODIFY decisions keep, in the I-1 blocks (slice I-6.3) > [IN-49] sterility sampling takes a sample at each point of the formulation's plan, which may name a point after an intervention or stoppage"
  - "tools/e2e/specs/library/injectables-acceptance.ts > [ST-21][IN-42][IN-49] Libinj aseptic 10 mg/2 mL, solution for injection in vials (library), GMP 8b: the EM count above the action limit holds the lot: its release checklist is red on the batch's open deviation until QA investigates, concludes and closes it @office"
clauses:
  - clause: "log a significant stoppage; a sterility pull after restart becomes mandatory."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Automatic pull after each interruption; forced open-and-acknowledge screen"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "INJ-25 SAMPLE per point; gate (4.5)"
build_status: SPECIFIED
jurisdiction: "**same** as EU Annex 1 (2022) sterility sampling expectations [gk] and FDA 211.167(a) / 2004 guidance [gk]."
notes: "Source check: P (2.1-2.3 re-read)."
