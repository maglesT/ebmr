  - "packages/site-services/test/mutation/qms-capa-lims-cmms.test.ts > the CAPA register commands (IN-01 (d), PR-51; site services 0925) > [PR-51][DI-22] a CAPA is cancelled by QA other than its initiator with a reason; nothing is linked or scheduled after"
