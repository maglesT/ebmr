  - "packages/site-services/test/integrations/capa-qms.test.ts > the QMS mirror (DI-31; D-P6a-5, D-P6a-6) > [DI-31][PR-51] with a QMS the CAPA rows are mirrors with a version token; the stand-in commands are refused"
  - "packages/site-services/test/mutation/qms-capa-lims-cmms.test.ts > the CAPA register commands (IN-01 (d), PR-51; site services 0925) > [IN-01][PR-51] raise_capa refuses each missing or malformed part with its own message, and takes the limits inclusively"
