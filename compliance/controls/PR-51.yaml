id: PR-51
title: CAPA linkage and effectiveness
part: B
group: H. Deviations, investigations and CAPA
editions:
  - tablets
  - injectables
type:
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 213
sources: "US: 211.192 (follow-up) | EU: EU GMP Ch.1 (s) | ICH/EMA/draft: ICH Q10 3.2.2 (s)"
behaviour: |-
  - CAPAs are created from, or linked to, deviations and investigations, with links in both directions: the batch lists its deviations and CAPAs, and each CAPA lists the batches it affects.
  - An effectiveness check is scheduled, with criteria that can be measured from eBMR data.
  - A CAPA that needs a master change cannot close until the new master version is effective.
catalog_test: Closing a CAPA that needs a master change is blocked while the change is not yet effective.
implemented_by: {}
tests:
  - "apps/tablets-server/test/capa/capa-routes.test.ts > the CAPA register over HTTP (IN-01 (d), PR-51) > [IN-01][PR-51] QA raises a CAPA with its check, implements it and records its effectiveness; another QA person closes it through the ceremony, the initiator cannot"
  - "apps/tablets-server/test/capa/capa-routes.test.ts > the CAPA register over HTTP (IN-01 (d), PR-51) > [PR-51] with a QMS integrated the stand-in writes are refused (the CAPA is changed in the QMS)"
  - "apps/tablets-web/test/capa/capa.test.tsx > CAPA screens (IN-01 (d), PR-51) > [PR-51][IN-01] a CAPA shows its overdue check, the master version not yet effective and why it cannot close; the close button waits for the server"
  - "apps/tablets-web/test/capa/capa.test.tsx > CAPA screens (IN-01 (d), PR-51) > [PR-51] a closable CAPA is closed through the ceremony (CAPA_ACT names the CAPA only)"
  - "apps/tablets-web/test/capa/capa.test.tsx > CAPA screens (IN-01 (d), PR-51) > [PR-51] a QMS mirror row shows its version token and history and offers no act"
  - "packages/site-services/test/integrations/capa-qms.test.ts > the CAPA register (IN-01 (d), PR-51) > [IN-01][PR-51] a CAPA from a deviation has a generated reference, its source, owner, due date and an effectiveness check, and links both ways"
  - "packages/site-services/test/integrations/capa-qms.test.ts > the CAPA register (IN-01 (d), PR-51) > [PR-51] a CAPA needing a master change cannot close before the change is effective"
