id: DI-32
title: Instrument and device data; original records from simple devices; dynamic data
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 6
target_phase_source: outline
requirement_rows:
  - 7
  - 648
  - 67
  - 41
