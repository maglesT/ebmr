clauses:
  - clause: "An API lot assayed at 98.5% raises the target and lowers the filler, with an audit trail."
    tests:
      - "apps/tablets-server/test/blocks/dispensing/potency.test.ts > TB-01 calculations C-01 to C-04 (exact) > [PR-19] an API lot assayed at 98.5 % (as is) raises the active target above the standard and lowers the filler by the same amount (within one readability step)"
  - clause: "The label shows all four required elements."
    tests:
      - "packages/recipe-core/test/blocks/material.test.ts > G-07 weighing and dispensing > [PR-19][INV-25] the net weight is computed from gross and tare and the dispensed total from the containers; the label carries the batch identity"
      - "apps/tablets-server/test/execution/db-guards-weighing-record.test.ts > T2 round 2: the label and the total of weighings are what the weighings record (INV-25, PR-19; sql 0322) > [PR-19][INV-25][DI-30] a weighing row whose label says \"50 kg\" for a net of 50.000 kg, or names another lot or batch, is refused; the engine's own label is recorded"
  - clause: "A non-designated user is refused."
    tests:
      - "apps/tablets-server/test/blocks/dispensing/tb-01-db.test.ts > TB-01 end to end in a test run (sandbox) > [PR-19] a non-designated user is refused: an operator without the dispenser designation cannot start the step"
      - "apps/tablets-server/test/blocks/dispensing/tb-01.test.ts > TB-01@1 potency-adjusted dispensing (engine) > [PR-19] a non-designated user is refused: an operator without the dispenser role can neither start the step nor record its calculation"
