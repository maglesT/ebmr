    - "packages/recipe-core/src/blocks/generic/material.ts (G-07)"
    - "packages/recipe-core/src/engine/corrections.ts (executed targets)"
  guards:
    - "G-07: net = gross - tare computed; the dispensed total is compared with its target within the MBR tolerance (DISPENSE_OUT_OF_TOLERANCE); every BOM line is dispensed before PERFORMED (G07-BOM-INCOMPLETE); a target without tolerance is a warning that needs a justification (G07-TOLERANCE-MISSING)"
    - "A corrected input that moves an executed target outside tolerance raises EXECUTED_TARGET_CHANGED; the dispensed quantity is never recomputed"
  invariants:
    - "INV-25"
