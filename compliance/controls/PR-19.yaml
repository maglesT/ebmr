id: PR-19
title: Dispensing targets and dispensing execution
part: B
group: "C. Materials: receipt, status, dispensing and charge-in"
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 11
  - 12
  - 120
  - 118
sources: "US: 211.101(a)-(b); 211.186(b)(4)-(5) | EU: Ch.5 5.12; 5.13; 5.37 | ICH/EMA/draft: none"
behaviour: |-
  - Who dispenses: only users holding the dispenser designation, following the procedure embedded in the step.
  - Targets:
    - Targets come from the master formula, including any stated calculated excess.
    - Where the master calls for it, the target is adjusted for potency or assay. The adjustment uses the approved result of the released lot (never a typed value), and a compensating excipient quantity is calculated.
    - A master or target that would deliver less than 100% of the labeled amount of active ingredient is refused.
  - Weighing: quantities are captured from a calibrated device and checked against tolerance. An out-of-tolerance quantity cannot be confirmed without a deviation.
  - Container labels: each dispensed container is labeled automatically with:
    - component name or item code;
    - receiving/control number;
    - quantity in the container;
    - the destination batch (product name, strength, lot number);
    - a unique container ID (a design choice).
  - Reprints need a reason and void the earlier label.
catalog_test: An API lot assayed at 98.5% raises the target and lowers the filler, with an audit trail. The label shows all four required elements. A non-designated user is refused.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/material.ts (G-07)"
    - "packages/recipe-core/src/engine/corrections.ts (executed targets)"
    - "packages/site-services/sql/0740_lims_lite.sql"
    - "apps/tablets-server/sql/1001_lot_assay_from_lims.sql"
  guards:
    - "G-07: net = gross - tare computed; the dispensed total is compared with its target within the MBR tolerance (DISPENSE_OUT_OF_TOLERANCE); every BOM line is dispensed before PERFORMED (G07-BOM-INCOMPLETE); a target without tolerance is a warning that needs a justification (G07-TOLERANCE-MISSING)"
    - "A corrected input that moves an executed target outside tolerance raises EXECUTED_TARGET_CHANGED; the dispensed quantity is never recomputed"
    - "LIMS-lite: verdicts computed by the database from decimal limits; approval by a QC person other than the recorder (QC_RESULT_APPROVED); a revision drops the approval; on GMP the lot assay is copied from approved results named by id, never typed, and is read only while they stay approved (EBMR-SITE-200 to 205, EBMR-EXE-606)"
  invariants:
    - "INV-25"
