id: IN-38
title: Strip and blister packaging
part: D
group: Tablets edition
editions:
  - tablets
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 3
target_phase_source: outline
requirement_rows:
  - 264
sources: Schedule M Part VIII 7.1-7.4.
behaviour: (a) Before a new batch, the counting/strip/blister equipment clearance (removal of rogue tablets, capsules, foils) is performed by one user and independently verified by a different user; both signatures are recorded. (b) Strip/blister IPC records defect categories (misprint, foil cut, missing tablet, poor sealing). (c) A periodic vacuum leak test of pockets is a scheduled IPC with frequency, sample size and pass/fail; a missed test flags the record. (d) Products flagged uncoated, potent or beta-lactam are only schedulable on eligible lines; potent and beta-lactam packing only in isolated areas.
catalog_test: one user signs both "performed" and "verified" for blister clearance; refused. Skip the scheduled leak test; the record flags a missed IPC.
implemented_by: {}
tests:
  - "packages/site-services/test/quality/interfaces.test.ts > ERP product master > [PR-47][IN-38] a change of the beta-lactam flag (it drives the isolation of the packing line) takes effect only once QA confirms it (site-services 0803)"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > golden fixtures of the blister blocks > [DI-34][PR-37][IN-38] TB-21 Blister line set-up, independent check and sealing: A thermoform run of 10-tablet blisters: forming and sealing values collected inside their validated ranges, then a sealing temperature of 182.0 degC above its 170.0 to 180.0 range (PROCESS_VALUE_OUT_OF_LIMITS); a defect check of 20 blisters with one improper seal fails (DEFECT_CHECK_FAILED), the next passes; 30 pocket rejects; 10000 formed = 9900 good + 30 rejects + 60 set-up waste + 10 samples, nothing unexplained; 99000 tablets packed"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > golden fixtures of the blister blocks > [DI-34][IN-38][PR-29] TB-22 Blister leak test: Vacuum decay at 60 to 80 kPa for 30 to 60 s, 10 blisters per track on two tracks, every 30 min with a grace of 5 min: the start tests pass; after 25 min a reel change makes them due at once; track 2 tested at once passes, track 1 tested 10 min later is missed (LEAK_TEST_MISSED) and has one leaking pocket (LEAK_TEST_FAILED); the run ends and both tracks pass the end-of-run test"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > TB-21 line check (engine) > [IN-38] the independent line check has a verifier in the MBR (TB21-INDEPENDENT), and the engine never lets the person who performed it verify it: performer and a different verifier"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > TB-21 line check (engine) > [IN-38][PR-33] change parts and webs are scanned against the pack format: a missing or foreign change part, a wrong material, a web missing or scanned twice are refused; the stored set-up keeps what was scanned and adds the reels in the format's order; a failing equipment check leaves the step unperformable"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > TB-22 leak test (engine) > [IN-38][PR-29] the schedule is defined with an interval, a grace, a risk assessment and validated vacuum and hold ranges"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > TB-22 leak test (engine) > [IN-38][PR-29] any leaking pocket fails the test (LEAK_TEST_FAILED); a test outside the validated vacuum or hold time is no test; the units and the track are the MBR's; the keyed parameters need a second person"
  - "apps/tablets-server/test/blocks/blister/blocks.test.ts > TB-22 leak test (engine) > [IN-38][PR-29] a test is due at the start, one interval after the track's last test, at once after a reel change and at the end; one not made within the grace is missed and the next entry lists it with LEAK_TEST_MISSED (IN-38 (c))"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [IN-38][PR-33][PR-34][PR-35] TB-21 line set-up: the machine is a PROCESS unit in use on the line the packaging order occupies, cleared for the artwork set scanned; every reel is a released lot of its material, and the printed foil a lot issued for its item at the G-21 step; the change parts are the format's whatever the engine says; the stored set-up is what was scanned with the reels the block builds"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [IN-38] an uncoated potent or beta-lactam product is set up only on a line flagged isolated, by a master-data steward citing its qualification (never an operator or an administrator, never a direct write); the latest flag holds"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [IN-38][PR-34][PR-35] the run and the leak test start only after a completed independent line check of the same machine (performed, then verified by another person), on the line the order still occupies"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [PR-37][PR-29][IN-38] TB-21 run: a sealing value outside its validated range is stored only with PROCESS_VALUE_OUT_OF_LIMITS and holds the machine's containers; a defect check is judged by the database (a forged pass is refused), a failure holds every container since the last passing check of the line series even past a whole-unit pass, and a passing check is recorded only from the step"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [IN-38][PR-29] TB-22: any leaking pocket fails the test (a forged pass is refused) and holds every container of the machine since the track's last passing test; a test outside the validated method is refused; a pass is recorded only from the step; the step closes only with an end-of-run test of every track"
  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [IN-38][PR-29] TB-22 missed leak test at database time (IN-38 (c)): the server sweeper records the alarm and the MISSED hold of the machine without any entry; the next entry must list it with LEAK_TEST_MISSED (a forged engine that leaves it out is refused)"
  - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [PR-34][PR-35][IN-38] review 4b: a TB-23 or TB-24 entry is stored only on a line occupied now by this batch's packaging order, on a passed and verified clearance for it and for the artwork set its G-21 step names; a potent product only on a line flagged isolated"
