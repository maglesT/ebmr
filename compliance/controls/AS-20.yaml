sources: "ICH Q7 (Step 4, 10 November 2000; EU GMP Part II) 14.30, 14.31. Revised Schedule M Part XII: the extract on file lacks 14.2.2 to 14.4 (open item for the owner). API plan docs/build-plan/api/plan.md section 11 (row C4)."
behaviour: "A rework is its own master of record kind REPROCESSING, of the same product as the batch reworked. A batch is planned on it only on the quality unit's authorised request whose investigation is a QA-concluded deviation-lite record linked to each parent, with a stored risk evaluation and the product's reprocessing permission. A reworked batch is held at release (G-REL item G3.EXTRA_TESTING) until QC records its signed decision on additional testing."
catalog_test: "Plan a rework batch before the investigation is linked and concluded or before the quality unit authorises it; refused. Release it before QC decides on additional testing; held."
implemented_by:
  modules:
    - "recipe-core 0624 and 0625 (recipe.propose_reprocessing_request, recipe.prepare_reprocessing_issue, EBMR-RPR-050 and 052; recipe.reprocessing_release_problem), 0781 G3.EXTRA_TESTING (as replaced in 0932); site-services 0733 (QC decision on extra testing); no code of the edition's own."
