jurisdiction: EU is stricter. It requires continuous Grade A viable monitoring including set-up, and a maximum 4 h plate exposure. FDA-AP requires sampling each shift, calls settle plates optional, and puts critical-surface sampling at end of operation (same as EU).
scope: "all (continuous Grade A viable coverage: aseptic)"
type_detail: ENFORCED (coverage checks, 4 h plate maximum, end-of-operation sequencing). Plan content is CONFIGURABLE from the approved EM programme.
