    - "packages/kernel/sql/0340_market_publish.sql"
    - "packages/kernel/sql/0350_market_policies.sql"
    - "packages/kernel/sql/0400_records_register.sql"
    - "packages/kernel/sql/0410_records_incidents.sql"
    - "packages/kernel/sql/0420_records_retention.sql"
    - "packages/kernel/sql/0430_records_di_investigations.sql"
    - "packages/kernel/sql/0440_records_blockers_and_purge.sql"
    - "packages/kernel/sql/0600_continuity_core.sql"
    - "packages/kernel/sql/0610_continuity_backup.sql"
    - "packages/kernel/sql/0620_continuity_device_hardening.sql"
    - "packages/site-services/sql/0600_batch_number_register.sql"
  invariants:
    - "INV-26"
  guards:
    - "iam.evaluate_authority(person, account, permission, scope, at): a role grant covering the scope plus every required qualification at that instant; every evaluation stored with its inputs"
    - "iam.require_permission: refuses with EBMR-IAM-040; withGuardedCommand stores the refusal again outside the rolled-back command"
    - "iam.assert_segregated and iam.evaluate_segregation: dynamic segregation evaluated on the person, every evaluation stored"
    - "iam.record_entry_persons and iam.chain_persons: persons involved in a record or batch from the audit trail (stand-in until B2 signatures and the Phase 4 involvement set)"
    - "iam.delegation_valid: delegation checked at the moment of action; approver is neither delegate nor delegator; no re-delegation"
    - "every function of market, records, continuity and the site batch-number register that the application may call and that can write calls iam.require_permission before its first write (EBMR-IAM-040), in the object's site/product scope, installation-wide ({}) for installation objects, or at the actor's location (session site and room) for point-of-work actions; the stub scope tables check MASTERDATA.CHANGE in a statement trigger"
    - "iam.platform_authority: the platform AUTHORITY hook over iam.evaluate_authority, for the validated actor in its declared role at its location; platform names map to catalogue codes (iam.platform_permission_code)"
    - "permission-to-role map in 0700_authorization_catalogue.sql (least privilege; catalogue rows attributed to the SOFTWARE_RELEASE identity in the audit trail)"
  db_constraints:
    - "grant scopes (site, area, product): a grant covers only its own scope, so data stay isolated between sites"
tests:
  - "packages/kernel/test/identity/access.test.ts > [DI-17] a failed authority check blocks the action and is logged"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] a person who executed a step of a batch cannot sign that batch's disposition"
  - 'packages/kernel/test/identity/access.test.ts > [DI-17] a role without the quality-unit release function cannot sign "Approved for release"'
  - "packages/kernel/test/identity/access.test.ts > [DI-17] data is isolated between sites: a grant covers only its own site, area and product"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] permission matrix: every kernel role allows exactly its permissions and nothing else"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] the performer of an entry cannot verify it (segregation on the person)"
  - "packages/kernel/test/identity/authority.test.ts > [DI-17] a named delegate holds a delegation only as approved by someone else, within its window, meanings, scope and markets"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] every protected action has its permission, with its domain and effect, held by exactly the mapped roles"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-14][DI-17] service accounts get write permissions only; display and break-glass roles get no new permission"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] catalogue changes shipped by the release are in the audit trail, attributed to the release"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] every function of market, records and continuity (and site services) that the application may call and that can write checks a known permission"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] an operator cannot publish a rule table, a steward cannot publish a source correction, a regulatory signer cannot publish an update; the refusal is logged"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] an operator cannot write the stub master data, define a policy, pin a batch or apply a tightening; an auditor cannot record an evaluation"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] a site value is authorised in its site's scope: a steward whose grant is limited to another site is refused"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] a QC analyst cannot approve a purge, and the refusal is logged; a QA reviewer can"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] an operator cannot place a legal hold or investigate an incident; a service account raises an incident but cannot reclassify it"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] a QA reviewer cannot open a DI investigation; the CSV / DI lead can"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] raising an incident is authorised where the actor works: a room-limited grant covers its own room only, a site-limited grant its own site"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] an operator cannot attest a terminal, acknowledge a continuity alarm, record a restore or reserve a number ceiling; administrators hold the IT functions"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17][DI-18] a QA reviewer cannot operate a restore; a system administrator named as approver cannot approve it; the QA reviewer approves it"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] the platform AUTHORITY hook is the identity adapter; platform permission names map to catalogue codes"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] platform permissions: a process owner changes a setting and a system administrator a time source, an operator neither; each decision is stored at the actor's location"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] the sample state machine reaches the catalogue: an MBR author submits a record, an operator cannot"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] platform permissions are checked where the actor works: a grant limited to another site does not cover them"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-17] the adapter trusts only the validated actor of the command and names it can map; the application cannot call it"
  - "packages/site-services/test/authorization.test.ts > [DI-17] an operator cannot define a numbering rule, or allocate, register, void or recover a batch number; a service account registers but cannot allocate"
  - "packages/site-services/test/authorization.test.ts > [DI-17] batch numbers are authorised in their site and product scope: a site-limited issuer acts at its own site only, a product-limited issuer on its own product only"
