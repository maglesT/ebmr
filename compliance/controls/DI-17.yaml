  guards:
    - "iam.evaluate_authority(person, account, permission, scope, at): a role grant covering the scope plus every required qualification at that instant; every evaluation stored with its inputs"
    - "iam.require_permission: refuses with EBMR-IAM-040; withGuardedCommand stores the refusal again outside the rolled-back command"
    - "iam.assert_segregated and iam.evaluate_segregation: dynamic segregation evaluated on the person, every evaluation stored"
    - "iam.record_entry_persons and iam.chain_persons: persons involved in a record or batch from the audit trail (stand-in until B2 signatures and the Phase 4 involvement set)"
    - "iam.delegation_valid: delegation checked at the moment of action; approver is neither delegate nor delegator; no re-delegation"
    - "every function of market, records, continuity and the site batch-number register that the application may call and that can write calls iam.require_permission before its first write (EBMR-IAM-040), in the object's site/product scope, installation-wide ({}) for installation objects, or at the actor's location (session site and room) for point-of-work actions; the stub scope tables check MASTERDATA.CHANGE in a statement trigger"
    - "iam.platform_authority: the platform AUTHORITY hook over iam.evaluate_authority, for the validated actor in its declared role at its location; platform names map to catalogue codes (iam.platform_permission_code)"
    - "permission-to-role map in 0700_authorization_catalogue.sql (least privilege; catalogue rows attributed to the SOFTWARE_RELEASE identity in the audit trail)"
    - "approval signature types name the approving permissions (RECORD_TYPE_APPROVED, RECORD_DISPOSAL_APPROVED, DI_INVESTIGATION_CLOSED, RESTORE_APPROVED), so esig evaluates the same permission at signing"
    - "tab.record_read_problem and tab.signing_preview_problem (tablets 0410): a session reads a RECORD-class record with RECORD.READ, a GOVERNANCE-class one (investigations, disposals, restores, any type not named) only in a governance or audit role, never an investigation about itself (since tablets 0530 answered as one that is not there), and previews content only with a meaning its role signs (EBMR-TAB-018, EBMR-TAB-019, EBMR-TAB-020)"
    - "tab.audit_chains, tab.audit_events, tab.audit_chain_length and tab.audit_registry_chains (tablets 0420): the audit viewer serves only the chains the session's role may read, a person filter only on the session's own person unless the role is a governance one; the application role has no SELECT on the audit tables"
    - "tablets 0430: without a session the application role executes no evidence package, chain extract, scoping report, person activity or chain list, selects no anchor, checkpoint, verification run or retention hold, and sees only RECORD-class rows of the signature seals, ID register, content changes, invalidations and signing failures (row-level security; correction: the rows only, not the planner's count of the others, and since tablets 0610 it selects none of those tables)"
    - "tab.withheld_from, tab.chain_listed, tab.audit_chains and tab.audit_events (tablets 0440, answers corrected by 0530): whatever their role, the person a data-integrity investigation is about neither lists nor reads its chains, the hold chains it creates, the hold entries on the held records' chains, or the account and person chains of the persons who opened and lead it, nor in those persons' activity anything the investigation wrote; since tablets 0530 each reads as what is not there (no entries, no length, nothing to verify), never as a refusal (0440's EBMR-TAB-020 told the person)"
    - "tablets 0450: without a session the application role selects no disposal approval, tombstone, restore or restore approval and runs neither integrity list of signatures, so it finds no id of a GOVERNANCE-class signature to ask esig.signature_state about"
    - "tablets 0460: without a session the application role asks the kernel nothing about what blocks a record (records.open_blockers, has_disposition_blockers, disposal_refusals, retention_of, lock_blocker_epoch) and selects neither the blocker counters nor the retention status view, so it cannot list the persons under investigation and their concern from what blocks a record (the chain verification and the anchor comparison still told which accounts an investigation holds until tablets 0530)"
    - "tablets 0470: without a session the application role runs none of the kernel's readers of who acted on a chain or a row (iam.chain_persons, iam.record_entry_persons), of the checkpoint of a chain (kernel.checkpoint_chain, which refused only a chain with no entries) or of the entries of a time fault, and selects no segregation evaluation; tab.audit_registry_chains names to the person an investigation is about neither the account and terminal of an entry withheld from them nor a chain withheld from them"
    - "tablets 0530: without a session the application role verifies no chain (kernel.verify_chain from a position it chose named a chain's length, records.verify_chain) and compares no external anchor with the live chains (continuity.compare_external_anchors, verify_external_anchors, external_anchor_problems), so it learns from neither whether a chain exists; the audit viewer verifies through the session-checked tab.audit_verify_chain (EBMR-TAB-018, EBMR-TAB-020), with the registry chains its view draws on"
    - "tab.record_withheld, tab.content_for_signing, tab.record_signatures, tab.chain_read_problem, tab.audit_events, tab.audit_chain_length, tab.audit_registry_chains and tab.audit_verify_chain (tablets 0530): the person a data-integrity investigation is about is answered about what is withheld from them as a colleague in the same role is about what is not there (same status, message and body shape): no entries, no length, nothing to verify, no registry chains, no signatures, the content of a record that does not exist; a person filter on its opener or lead is served from the chains the person may read. Known limits (defaults F35.3, F35.4): the account and person chains of the opener and lead, which a colleague lists, reads and verifies, read to the subject as absent (verification 404, not listed), and the hashed sequence numbers and event ids shown skip an entry withheld from the subject"
    - "tablets 0540: without a session the application role reads no high-water mark or move of a protected sequence (continuity.sequence_high_water, continuity.sequence_bump), so the investigation and hold numbers tell it neither when nor how many investigations and holds were opened (correction: the table statistics still told it until tablets 0570, and the stored authority evaluations until tablets 0580)"
    - "tab.partly_withheld_chains, tab.audit_chains, tab.audit_chain_length and tab.audit_headless_chains (tablets 0560): on a chain the person a data-integrity investigation is about reads that carries an entry withheld from them (their own account's chain carries the hold of each investigation about them), the chain list, the chain's length and the count its verification reports count, date and order only the entries shown to them, and a chain on which none is shown reads as one that is not there (until 0560 the hold was counted and dated there)"
    - "tablets 0570: in each installation's database no role that is not a superuser (PUBLIC, so ebmr_app and ebmr_sandbox) selects the per-table, per-index, per-sequence and per-function statistics views or executes their counter functions and the relation size functions, which counted the rows inserted and live in the investigation and hold tables; the migration fails if any stays open. What the application roles still read (pg_stat_activity, pg_locks, pg_stat_ssl, the planner estimates in pg_class, the database-wide counters) is default HW.1 (correction: not the only door left; the stored authority evaluations also told when and how many, and who acted, until tablets 0580, and the planner's view of the signature tables until tablets 0610, which also takes the estimates in pg_class)"
    - "tablets 0580: without a session the application role (ebmr_app, and ebmr_sandbox through the mirror) selects no row or column of iam.authority_evaluation, whose checks of VALIDATION.MANAGE, DI_INVESTIGATION.APPROVE_CLOSURE and RECORD.LEGAL_HOLD (used only by the investigation and legal-hold commands) told when and how many investigations were opened, linked, refreshed and closed and holds placed and released, and which lead or QA reviewer acted; the migration fails if the role or PUBLIC can still select a column; every reader is SECURITY DEFINER and the application role still evaluates (iam.evaluate_authority). What still changes with those commands for the application role (the authentication of a GOVERNANCE-class signing, the sessions' last activity, the installation-wide audit horizon) is default HW.1 (correction: not all that told it; until tablets 0610 the planner's view of the signature tables (EXPLAIN ANALYZE's count of the rows row-level security removed, narrowed to investigations by a range on the indexed aggregate reference, the row estimates, the row positions and id gaps of the visible rows, the estimates in pg_class) told when and how many investigations' closures were requested and signed, and so which kind of GOVERNANCE-class signing an authentication was for)"
    - "tablets 0610: the application role (ebmr_app, and ebmr_sandbox through the mirror) selects no row or column of esig.challenge, signature, signature_seal, signature_id_register, content_change, signature_invalidation or signing_failure, so no query plan, row estimate, row position, id or column statistic of theirs tells it how many GOVERNANCE-class signing requests and signatures there are or of which records; the server reads its own signing requests through the session-checked tab.session_challenge (the active session bound to the token, a request made in that session; anything else reads as no request) and signatures through the readers of 0410; and no role but the owner and the superusers selects the planner estimates of pg_class (reltuples, relpages, relallvisible), which counted every row of every table, the investigation tables included; the migration fails if the application role or PUBLIC can still select a column of the seven tables (EBMR-TAB-024) or PUBLIC, an application, authentication or listener role an estimate (EBMR-TAB-025). What the application roles still learn of a GOVERNANCE-class signing is default HW.1"
    - "tablets 0620: the application role (ebmr_app, and ebmr_sandbox through the mirror) no longer executes esig.record_signing_failure, which logged a failure against any signing request whose id it read in iam.auth_event and, given another person's authentication, raised a HIGH alert naming the request's record and meaning in iam.security_alert, which it reads: so it told which record and kind of GOVERNANCE-class signing an authentication was for; the server logs through the session-checked tab.record_signing_failure, only against a request made in the session the token is or was bound to (else EBMR-ESIG-031, nothing logged or alerted); the migration fails if the role or PUBLIC can still execute the kernel function (EBMR-TAB-026)"
