id: DI-17
title: Authority checks per action, least privilege and segregation of duties
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 50
  - 2
  - 173
sources: "US: 11.10(g); 211.22(a),(c); 211.68(b); 211.101(c)-(d), 211.103, 211.186(a), 211.188(b)(11) | EU: Annex 11 §2 (level of access), §12.1; Ch.4 4.20(c), 4.21(c) | ICH/EMA/draft: draft Annex 11 §11 least privilege (draft)(s); draft Annex 11 §12 independent audit-trail reviewer (draft)(s)"
behaviour: |-
  - At every action the engine checks that the user holds a role permitted for that action on that object. Objects are scoped by legal entity, site, area, product, line and step type. Actions include:
  - execute, verify, supervise;
  - QA review and audit-trail review;
  - disposition / QP certification;
  - MBR author, checker, approver;
  - master-data change, configure, administer.
  - A failed check blocks the action (it does not just warn) and is logged.
  - Signature meanings are bound to roles. For example, only the QU-disposition role can sign "Approved for release" or "Rejected".
  - Segregation of duties is enforced by the engine:
  - the performer of an entry is not its verifier;
  - the MBR author, checker and QU approver are three different users;
  - a user who executed or verified any step of batch X cannot do the audit-trail review of batch X or sign its disposition.
  - Data is isolated between sites by default.
  - Status changes on materials, intermediates and batches are QU-only e-signatures; the details are in the production catalog.
catalog_test: Run a permission-matrix suite with positive and negative tests for every role and action. The performer tries to verify their own entry. Refused. A batch executor tries to sign disposition of that batch. Refused. A role without the QU function tries to sign "Approved for release". Refused.
implemented_by:
  modules:
    - "packages/kernel/src/identity/authority.ts"
    - "packages/kernel/sql/0130_iam_qualifications_authority.sql"
    - "packages/kernel/sql/0170_iam_signing_readiness.sql"
  invariants:
    - "INV-26"
  guards:
    - "iam.evaluate_authority(person, account, permission, scope, at): a role grant covering the scope plus every required qualification at that instant; every evaluation stored with its inputs"
    - "iam.require_permission: refuses with EBMR-IAM-040; withGuardedCommand stores the refusal again outside the rolled-back command"
    - "iam.assert_segregated and iam.evaluate_segregation: dynamic segregation evaluated on the person, every evaluation stored"
    - "iam.record_entry_persons and iam.chain_persons: persons involved in a record or batch from the audit trail (stand-in until B2 signatures and the Phase 4 involvement set)"
    - "iam.delegation_valid: delegation checked at the moment of action; approver is neither delegate nor delegator; no re-delegation"
  db_constraints:
    - "grant scopes (site, area, product): a grant covers only its own scope, so data stay isolated between sites"
tests:
  - "packages/kernel/test/identity/access.test.ts > [DI-17] a failed authority check blocks the action and is logged"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] a person who executed a step of a batch cannot sign that batch's disposition"
  - 'packages/kernel/test/identity/access.test.ts > [DI-17] a role without the quality-unit release function cannot sign "Approved for release"'
  - "packages/kernel/test/identity/access.test.ts > [DI-17] data is isolated between sites: a grant covers only its own site, area and product"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] permission matrix: every kernel role allows exactly its permissions and nothing else"
  - "packages/kernel/test/identity/access.test.ts > [DI-17] the performer of an entry cannot verify it (segregation on the person)"
  - "packages/kernel/test/identity/authority.test.ts > [DI-17] a named delegate holds a delegation only as approved by someone else, within its window, meanings, scope and markets"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: IMPLEMENTED
jurisdiction: US second-person rules (211.101, 211.103, 211.186(a), 211.188(b)(11)) require the checker to be someone other than the performer. EU Ch.4 asks for a checker "where appropriate". The stricter US rule applies.
type_detail: "ENFORCED for the checks, performer-not-verifier and author-not-checker. The executor-not-reviewer/disposer rule is a DESIGN-CHOICE, engine-enforced: it is good practice supporting QU independence and the draft's independent-reviewer expectation, not explicit rule text."
