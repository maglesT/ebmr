  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] the package carries exactly this manifest and its SHA-256, and its sections by name"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] each section is an object with a unique name of the export form, a known kind, its encoding (base64 for the PDF only) and its SHA-256"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] a section listed in the manifest is in the package and decodes to its SHA-256"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] [DI-41] a true-copy section is a bundle of its chain with the manifest SHA-256 the export names"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] [DI-41] the true copy in the export is the one registered with its own manifest, not another registered copy of the same record"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] [DI-41] a PDF renders a chain the export carries as a true-copy bundle"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] [DI-41] a PDF section carries its content SHA-256 in its metadata and is a PDF 1.7 file"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > what an evidence export package must be (kernel 1174, records.register_evidence_export) > [IN-11] [DI-41] a PDF embeds the record, its audit trail and its content descriptor, each as the true copy has it"
  - "packages/kernel/test/mutation/records-evidence-export.test.ts > the certification, the state and the signed content of one export among several (kernel 1171) > [IN-11] [DI-35] an unknown export is not certified; a signature of another export is refused for its binding"
