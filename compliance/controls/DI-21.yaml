    - "iam.acknowledge_esig_policy and iam.assert_can_sign: the current accountability policy is acknowledged before the first signature"
    - "iam.signature_register(at) and iam.resolve_signer(account, at): legal name, manifestation name, initials, roles and signing permissions as at any date"
  policies:
    - "qualification.mirror_max_staleness_seconds"
