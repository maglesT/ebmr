id: ST-36
title: Non-qualified interventions and exceedance of APS-demonstrated frequency
part: C
group: "Theme 5: Interventions catalogue and log"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 465
sources: "EU Annex 1: 8.16, 9.34 | US: 211.113(b), 211.192; FDA-AP IV.E, IX.A.3."
behaviour: |-
  - An intervention not in the catalogue can be recorded only as "unqualified". It needs:
    - a real-time QA authorisation e-signature before the operator continues;
    - an automatic deviation and investigation;
    - flagging of the affected units and time window;
    - a mandatory QA disposition item that blocks certification until closed.
  - A catalogue intervention done more often than demonstrated in APS, or a rare intervention not simulated within its interval, raises a deviation for QA assessment (see ST-31).
catalog_test: Record an "other" intervention → QA sign-off required before continuing, deviation auto-created, certification blocked while open.
implemented_by: {}
tests:
  - "apps/tablets-server/test/injectables/aseptic-gate.test.ts > Injectables I-6.2: the release gate waits for the EM counts and for the deviation of an unlisted intervention > [ST-36] an intervention not on the validated list raises an exception; QA dispositions it under a deviation linked to the batch, and while that deviation is open G2.DEVIATIONS is RED and the lot is not ready"
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > aseptic filling events, the media fill and the aseptic set-ups (slice I-2a) > [ST-34][ST-36] an event not on the formulation's list of validated interventions is an exception that keeps the filling step from being signed until it is handled (then the gate waits for its deviation)"
clauses:
  - clause: "Record an \"other\" intervention → QA sign-off required before continuing,"
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Real-time QA signature before continuing"
  - clause: "deviation auto-created, certification blocked while open."
    tests:
      - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > aseptic filling events, the media fill and the aseptic set-ups (slice I-2a) > [ST-34][ST-36] an event not on the formulation's list of validated interventions is an exception that keeps the filling step from being signed until it is handled (then the gate waits for its deviation)"
      - "apps/tablets-server/test/injectables/aseptic-gate.test.ts > Injectables I-6.2: the release gate waits for the EM counts and for the deviation of an unlisted intervention > [ST-36] an intervention not on the validated list raises an exception; QA dispositions it under a deviation linked to the batch, and while that deviation is open G2.DEVIATIONS is RED and the lot is not ready"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "\"Unlisted\" raises an exception, then deviation; gate refuses (4.3)"
build_status: SPECIFIED
jurisdiction: EU is explicit that unqualified interventions are exceptional and are considered at disposition. FDA treats them through the deviation path. Aligned.
scope: aseptic
