  - "packages/recipe-core/test/review/review.test.ts > the audit-trail review (outline 5.4; DI-25, INV-35, INV-48) > [INV-48][DI-25] a change in scope after the QA review (a deviation linked to the batch) keeps disposition blocked until a signed delta review covers it; a delta with nothing to review is refused"
  - "packages/recipe-core/test/review/review.test.ts > slice 1 quick review regressions (recipe-core 0719 to 0721) > [INV-48][DI-25] an audit event on a shared record after the batch was completed neither bumps its epoch nor blocks its QA review; one on the batch chain does both"
  - "apps/tablets-server/test/review/review-routes.test.ts > the CORRECT_ENTRY route (outline 5.2.3 path (a); S25) > [DI-25][DI-24][DI-07] a value changed after entry, on a field classed non-critical, shows with its original in the checker's step view, in the exception register with both values and the reason, and in the audit-trail review list"
  - "packages/recipe-core/test/review/review.test.ts > no configuration defers the audit-trail review (DI-25) > [DI-25] no setting, policy, rule key or e-signature or access policy of the installation offers to defer or skip the audit-trail review, the review gates read no configuration, and the QA review and the disposition wait for the signed review"
