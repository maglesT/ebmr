  - "packages/kernel/test/review/f77.test.ts > F77: moving a row to another aggregate must be visible in the old aggregate's audit chain > [DI-22][DI-25][INV-07] update market.stub_pack set batch_id = B2 is recorded in chain market_stub_batch:B1 as well as B2"
