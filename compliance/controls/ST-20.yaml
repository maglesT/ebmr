jurisdiction: Grade A is stricter under EU (no growth) than ISO 5 (action 1, normally none). Grade B equals ISO 7 for air and settle plates, and EU adds contact and glove limits. **ISO 8 (FDA 100/50) is stricter than EU Grade D (200/100)**, so it applies for US-market products.
scope: all
type_detail: "CONFIGURABLE within floors (ST-01). ENFORCED: no averaged-only views, and no alert tier for Grade A viable."
