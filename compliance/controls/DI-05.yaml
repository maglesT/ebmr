  guards:
    - "kernel.installation_kind(): GMP or SANDBOX, set once at provisioning; refuses a missing marker or one that disagrees with the database name (EBMR-SBX-001, EBMR-SBX-004)"
    - "sandbox.assert_gmp_installation(action) on GMP-issuing paths (EBMR-SBX-010); sandbox.assert_sandbox_installation(action) on sandbox-only features (EBMR-SBX-011)"
    - "sandbox.assert_identifier_allowed(kind, value) and trigger sandbox.guard_identifier: GMP refuses TEST- identifiers (EBMR-SBX-021), the sandbox refuses anything else (EBMR-SBX-022)"
    - "sandbox.assert_batch_issue_allowed(market states): GMP batches only from CURRENT or BRIDGING versions (EBMR-SBX-012)"
    - "assertInstallationKind at process start-up (EBMR-SBX-007); assertGmpOrigin on anything imported into GMP (EBMR-SBX-013)"
    - "recipe.execution_actor: every execution writer refuses a GMP installation (EBMR-SBX-011) and administrators"
    - "recipe.import_test_package: package and content hashes recomputed in SQL, file name = package hash, GMP source stamp without watermark (EBMR-EXE-016..019)"
    - "recipe.begin_issue / issue_execution: TEST-B<yy>-<nnnn> from a sequence, only the number allocated in this transaction (EBMR-EXE-012); guard trigger on recipe.batch_execution"
    - "defineBatch(installation GMP) refuses SANDBOX_ONLY block versions (ENG-DEF-SANDBOX-ONLY); test runs execute only SANDBOX definitions (EBMR-EXE-064)"
    - "sandbox.guard_identifier on market.stub_batch.batch_number, market.stub_material_lot.code and market.stub_pack.code (kernel 1030; EBMR-SBX-021 in GMP, EBMR-SBX-022 in the sandbox); sandbox.guard_free_text: outside a GMP installation no word the identifier rule reads as a real batch or lot number in the named free-text columns (kernel 1030, on the stubs free text; EBMR-SBX-024)"
    - "recipe-core 0344: deferred constraint triggers zzz_sandbox_free_text on every execution table the application role writes and on kernel.audit_event (a run's chains: reason and business entries; a device reading's chain: reason): no word the identifier rule reads as a real batch, lot or container number, in any string or member name at any depth, besides the words the record binds (its batch number, site, room, MBR content, the engine's own names) (EBMR-EXE-147)"
    - "recipe-core 0345: an accepted START_STEP records no start data; start data names its authoriser by the id of a person of this installation; an equipment status at a step listing no equipment for a status check names equipment the MBR binds where the step runs (EBMR-EXE-126)"
    - "tablets 0630: tab.sandbox_lot.material_name under sandbox.guard_free_text (EBMR-SBX-024)"
  db_constraints:
    - "sandbox.installation: one row, written by the migration; update, delete, truncate and a second insert refused for every role including the owner (EBMR-SBX-002/003)"
    - "GMP databases: CONNECT revoked from PUBLIC and granted to ebmr_app and ebmr_authn only; sandbox databases: CONNECT for ebmr_sandbox only (sandbox.apply_connect_policy)"
    - "ebmr_sandbox: LOGIN, NOINHERIT, no memberships, no object privilege in a GMP database; inside a sandbox exactly the object privileges of ebmr_app and ebmr_authn (sandbox.mirror_application_privileges)"
    - "sandbox.reserved_identifier_pattern: every sandbox pattern anchored on the reserved prefix and ASCII only, so the GMP and sandbox identifier sets are disjoint"
    - "sandbox.segregation_problems(): invariant query, no rows in a correctly provisioned GMP or sandbox database"
