id: DI-05
title: Segregation of non-GMP functions (training, simulation, sandbox, analytics)
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 643
  - 61
sources: "US: FDA DI Q&A Q3 (assess and mitigate influence of non-CGMP functions on CGMP operations); 211.68(b) | EU: no dedicated clause; Annex 11 §1 (risk management) applies | ICH/EMA/draft: none"
behaviour: |-
  - Non-GMP functions keep their data in segregated stores. Examples: training tenant, MBR simulation, planning/scheduling, analytics.
  - They cannot:
  - write to GMP records, inventory, equipment status or genealogy;
  - change GMP configuration;
  - use real lot or batch identifiers (a reserved namespace is used instead);
  - have a non-GMP record converted into, or merged with, a GMP record.
  - Their outputs carry a visible NOT-GMP watermark.
  - A GMP record can only come from an Effective MBR.
  - The validation package contains a documented impact assessment for each non-GMP function.
catalog_test: From the training tenant, try to post to a production batch or reuse a real lot number. It is blocked. Simulation output carries the watermark.
implemented_by:
  modules:
    - "packages/kernel/sql/0800_sandbox_installation.sql"
    - "packages/kernel/sql/0810_sandbox_identifiers.sql"
    - "packages/kernel/sql/0820_sandbox_privileges.sql"
    - "packages/kernel/src/sandbox/installation.ts (readInstallationKind, assertInstallationKind, readInstallationStamp, assertGmpOrigin)"
    - "packages/kernel/src/sandbox/identifiers.ts (identifierProblem, assertIdentifierAllowed, testIdentifier, batchIssueProblem, RESERVED_PATTERNS)"
    - "packages/kernel/src/sandbox/watermark.ts (watermarkFor, stampText, stampJson)"
    - "packages/kernel/src/sandbox/provision.ts (provisionSandboxDatabase, upgradeSandboxDatabase, applyConnectPolicy, segregationProblems)"
    - "docs/design/sandbox.md (store layout, what is copied, impact assessment of each non-GMP function)"
    - "apps/tablets-server/src/features/designer/package-export.ts (ebmr.mbr-test-package v1: GMP stamp, content and package hashes, write-once file in the exchange directory)"
    - "apps/tablets-server/sql/0150_designer.sql (tab.mbr_test_package_export and the business entry on the version chain; GMP installation only)"
    - "apps/tablets-server/src/features/designer/simulation.ts (SIMULATION watermark on every simulation report)"
    - "packages/recipe-core/sql/0200_execution_store.sql, 0210_execution_writers.sql (test batches and packages: sandbox-only writers, TEST- batch numbers, execution_violations() reports anything of the store in a GMP database)"
    - "packages/recipe-core/src/blocks (availability SANDBOX_ONLY; G-09@1 and G-10@1; registry.sandboxOnly())"
    - "packages/recipe-core/src/engine/definition.ts (DefineOptions.installation, default GMP; ENG-DEF-SANDBOX-ONLY)"
    - "packages/recipe-core/src/execution/test-package.ts (strict parse of ebmr.mbr-test-package v1, hashes recomputed)"
    - "apps/tablets-server/src/features/execution (package inbox and import, TEST- issue, TEST, NOT GMP watermark on every run view)"
    - "apps/tablets-server/sql/0200_execution.sql (tab.sandbox_lot: TEST- lots only, insert-only, audited)"
  invariants:
    - "INV-18"
  guards:
    - "kernel.installation_kind(): GMP or SANDBOX, set once at provisioning; refuses a missing marker or one that disagrees with the database name (EBMR-SBX-001, EBMR-SBX-004)"
    - "sandbox.assert_gmp_installation(action) on GMP-issuing paths (EBMR-SBX-010); sandbox.assert_sandbox_installation(action) on sandbox-only features (EBMR-SBX-011)"
    - "sandbox.assert_identifier_allowed(kind, value) and trigger sandbox.guard_identifier: GMP refuses TEST- identifiers (EBMR-SBX-021), the sandbox refuses anything else (EBMR-SBX-022)"
    - "sandbox.assert_batch_issue_allowed(market states): GMP batches only from CURRENT or BRIDGING versions (EBMR-SBX-012)"
    - "assertInstallationKind at process start-up (EBMR-SBX-007); assertGmpOrigin on anything imported into GMP (EBMR-SBX-013)"
    - "recipe.execution_actor: every execution writer refuses a GMP installation (EBMR-SBX-011) and administrators"
    - "recipe.import_test_package: package and content hashes recomputed in SQL, file name = package hash, GMP source stamp without watermark (EBMR-EXE-016..019)"
    - "recipe.begin_issue / issue_execution: TEST-B<yy>-<nnnn> from a sequence, only the number allocated in this transaction (EBMR-EXE-012); guard trigger on recipe.batch_execution"
    - "defineBatch(installation GMP) refuses SANDBOX_ONLY block versions (ENG-DEF-SANDBOX-ONLY); test runs execute only SANDBOX definitions (EBMR-EXE-064)"
  db_constraints:
    - "sandbox.installation: one row, written by the migration; update, delete, truncate and a second insert refused for every role including the owner (EBMR-SBX-002/003)"
    - "GMP databases: CONNECT revoked from PUBLIC and granted to ebmr_app and ebmr_authn only; sandbox databases: CONNECT for ebmr_sandbox only (sandbox.apply_connect_policy)"
    - "ebmr_sandbox: LOGIN, NOINHERIT, no memberships, no object privilege in a GMP database; inside a sandbox exactly the object privileges of ebmr_app and ebmr_authn (sandbox.mirror_application_privileges)"
    - "sandbox.reserved_identifier_pattern: every sandbox pattern anchored on the reserved prefix and ASCII only, so the GMP and sandbox identifier sets are disjoint"
    - "sandbox.segregation_problems(): invariant query, no rows in a correctly provisioned GMP or sandbox database"
