id: IN-26
title: Cross-contamination and room/product eligibility
part: D
group: Kernel controls (both editions)
editions:
  - tablets
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 3
target_phase_source: outline
requirement_rows:
