tests:
  - "packages/recipe-core/test/containers/containers.test.ts > held containers are never merged, charged or packed > [IN-26] the charge scan of a container labelled for another batch is refused, and an unknown label too"
  - "packages/recipe-core/test/plant/area.test.ts > starting in a room needs a passed clearance of the required type (INV-15, IN-21, PR-26) > [INV-15][IN-26][PR-27] a product change in a room needs a MAJOR cleaning and a PRODUCT_CHANGE clearance; the same product inside an open room campaign takes a CAMPAIGN clearance"
  - "packages/recipe-core/test/plant/area.test.ts > the verifier signs the recorded finding (S23, S24) > [IN-26] the product a start is checked against is the batch's own: a batch of a highly potent product cannot be started in a positive-pressure room under any name"
  - "packages/recipe-core/test/plant/area.test.ts > room eligibility (IN-26 (b)(c), PR-25) > [IN-26] schedule a highly potent product in a positive-pressure cubicle: blocked; a negative-pressure room accepts it"
  - "packages/recipe-core/test/plant/area.test.ts > room eligibility (IN-26 (b)(c), PR-25) > [IN-26][PR-25] starting product Y in a room occupied by product X is blocked unless the room is segregated with a recorded risk justification"
  - "packages/recipe-core/test/plant/equipment.test.ts > product change and campaigns (IN-26 (a), PR-27) > [IN-26][PR-27] a product change needs a MAJOR cleaning; the same product follows a MINOR cleaning only inside an open, validated campaign within its maximum batches"
  - "packages/recipe-core/test/plant/equipment.test.ts > product change and campaigns (IN-26 (a), PR-27) > [IN-26][PR-27] outside the campaign's maximum days from its first batch a MAJOR cleaning is required, however short the planned end"
  - "packages/recipe-core/test/plant/equipment.test.ts > product change and campaigns (IN-26 (a), PR-27) > [IN-26][PR-27] a campaign batch that runs past the campaign window and its planned end is recorded as crossing both when it ends (D-S1-5)"
  - "packages/recipe-core/test/plant/equipment.test.ts > the batch, not the caller, names the product (IN-26, PR-27) > [IN-26][PR-27] a unit last used for product X refuses a batch of product Y after a MINOR cleaning, whatever product the caller has in mind: the product is read from the batch record"
