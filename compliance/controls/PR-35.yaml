id: PR-35
title: Packaging segregation and line identification
part: B
group: F. Packaging and labeling
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 122
  - 24
sources: "US: 211.130(a); 211.42(c)(6) | EU: Ch.5 5.49; 5.51 | ICH/EMA/draft: none"
behaviour: A line runs only one active packaging order (one product, strength and lot) at a time. A different product cannot start on an adjacent line that is not physically segregated; segregation is an attribute of lines and rooms. Every packaging station or line shows the product name and batch number of the active order (on an HMI or a line board). The display clears only after order close and line clearance.
catalog_test: Starting product Y on an unsegregated adjacent line while product X runs is blocked. The station display shows the product and batch.
implemented_by: {}
tests:
  - "packages/recipe-core/test/plant/area.test.ts > lines: a clearance for every packaging order (L-29, PR-34, PR-35) > [PR-34][PR-35][INV-15] a change of packaging order on a line needs a PACKAGING_ORDER clearance keyed on the order and the artwork set, even for the same bulk batch; one active order per line"
  - "apps/tablets-server/test/blocks/packaging/db-guards.test.ts > G-21 in the database (recipe-core 0580 to 0582, tablets 0950 to 0952) > [PR-36][IN-31][PR-35][IN-16][PR-42] a print job carries only the record's data, bound to the packaging order and artwork set the line runs; the gateway's echo must equal it or the load is refused; the first print is approved by another person than the one who released the job; a batch-data change voids the job and holds the output since the last good check (L-29)"
expert_decision:
