sources: "US: 211.100(a); 211.110(a) | EU: Ch.5 5.23; 5.24; 5.25; 5.26; 5.42 | ICH/EMA/draft: FDA Process Validation guidance (2011) stages 2-3 (s); EU Annex 15 section 5 (OPV, concurrent validation) (u)"
behaviour: |-
  - A master records its validation basis (report IDs).
  - Batches under a protocol carry a visible flag and an enhanced sampling plan.
  - The release screen shows the protocol and report status.
  - CPP and IPC data can be exported as structured data (with record counts or checksums) for CPV/OPV trending.
catalog_test: A PPQ-flagged batch cannot be released or certified until the validation outcome is entered. CPP data exported for N batches and recomputed from the source records match exactly.
