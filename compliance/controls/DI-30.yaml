  guards:
    - "A critical manually entered value, a manual fallback weighing or an attached paper original makes a second-person verification mandatory; the verifier was not involved (ENG-SEGREGATION)"
    - "A manual fallback when a device is down is flagged MANUAL_ENTRY_FALLBACK"
    - "Entry and configuration schemas refuse unknown fields and JavaScript numbers where decimal text is required"
  invariants:
    - "INV-03"
