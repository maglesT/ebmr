jurisdiction: "**weaker** than EU Annex 1 (2022) 8.31-8.33 (inspector qualification at least yearly using defect libraries; automated systems challenged before start-up and at intervals; defect trending) [chk]; EU 8.22 (100% integrity testing of fusion-sealed containers of 100 ml or less) [chk] has no verified Indian counterpart. FDA: 21 CFR 211 has no inspector-qualification clause [chk]; FDA expects 100% visual inspection of injectables under USP chapters 790/1790 [gk]."
