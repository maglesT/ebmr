id: IN-52
title: Market-profile rule resolution
part: D
group: Kernel rule engine
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 678
sources: Schedule M (all Parts cited above); Drugs Rules; 21 CFR 211; EU GMP Chapters 4-5, Annexes 1 and 11.
behaviour: Each batch carries its target markets (India domestic; export country list), and each pack/SKU carries its destination class. A versioned, market-keyed rule table is consulted at MBR approval, batch start, execution, release, sample retention and archiving. For each parameter the engine resolves the strictest value across India (always) and the batch's markets, stores the resolved value and the market that drove it in the batch record, and re-resolves if the market list changes before release (which forces QA review). Section B lists the resolved values. Resolution never loosens an Indian requirement for an export-only batch, because Indian GMP applies to everything made under the licence.
catalog_test: "set up one tablet and one injectable product, each with a batch for {India} and a batch for {India, US, EU}. The {India, US, EU} batches resolve to: retention max(expiry + 1 y, mfg + 5 y, QP certification + 5 y); reference samples expiry + 1 y; annual self-inspection; new number on rework; identity test per excipient lot; plus, for the tablet, the 30-minute compression IPC and IP weight bands; and, for the injectable, any contaminated APS unit fails, Grade A viable no growth, PUPSIT and a single-batch sterilising filter. The resolution log names the governing market for each value."
implemented_by:
  modules:
    - "packages/kernel/src/market/resolve.ts"
    - "packages/kernel/src/market/validate.ts"
    - "packages/kernel/src/market/loader.ts"
    - "packages/kernel/src/market/repository.ts"
    - "packages/kernel/src/market/context.ts"
    - "packages/kernel/sql/0300_market_rule_model.sql"
    - "packages/kernel/sql/0310_market_scopes.sql"
    - "packages/kernel/sql/0320_market_site_values.sql"
    - "packages/kernel/sql/0330_market_evaluations.sql"
    - "packages/kernel/sql/0340_market_publish.sql"
    - "compliance/rule-tables/kernel/kernel.v1.yaml"
    - "compliance/rule-tables/tablets/tablets.v1.yaml"
    - "compliance/rule-tables/sterile/sterile.v1.yaml"
    - "packages/recipe-core/src/engine/batch.ts (initialState)"
  invariants:
    - "INV-28"
    - "INV-29"
  guards:
    - "market.resolve and resolve(): India in every market set; refused when India has no value for a key it governs (EBMR-MKT-001, EBMR-MKT-045); missing predicates refused, never defaulted"
    - "market.publish_rule_table: validation (unknown method, scalar method on a multi-component key, unit mismatch, overlapping windows, ambiguous predicates, India missing); a loosening already in force only as a SOURCE_CORRECTION with citation and two approvers"
    - "market.set_site_value: site values only tighten; looser than HARD or DESIGN refused; GUIDANCE or adopted EXAMPLE loosening needs a CCS reference and QA approval and is flagged (market.batch_flags)"
    - "market.evaluate_stub_scope and ResolutionContextProvider: scope market sets (batch, pack, site, union over line, room, equipment and person, per consuming batch for lots; PIC/S counts as EU for sterile line rules)"
    - "Issue: India is always in the batch market set; a market the MBR is not approved for is refused (ENG-ISSUE-MARKETS)"
  db_constraints:
    - "market.evaluation_complete: every stored evaluation is recomputed from its inputs; a result the rule table does not give is refused (INV-29)"
    - "rule-table versions, keys, rows, evaluations, site values and impact items are insert-only and audited; ebmr_app has SELECT only"
    - "market.check_market_columns: stored market sets always contain IN"
  rule_keys:
    - "kernel.retention.batchRecord.monthsAfterExpiry"
    - "kernel.retention.batchRecord.monthsAfterManufacture"
    - "kernel.retention.batchRecord.monthsAfterQpCertification"
    - "kernel.referenceSamples.monthsAfterExpiry"
    - "kernel.selfInspection.maxIntervalMonths"
    - "kernel.rework.newBatchNumber"
    - "kernel.excipient.identityTestEachLot"
    - "tablets.compression.ipcSampleMaxInterval"
    - "tablets.uniformity.acceptanceCriteria"
    - "sterile.aps.acceptance"
    - "sterile.viable.gradeA.acceptance"
    - "sterile.filter.preUseTestAfterSterilisation"
    - "sterile.filter.singleBatchUse"
