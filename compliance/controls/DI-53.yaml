id: DI-53
title: "Audit-trail anomaly flags: reasons shown, restricted, never an automatic finding"
part: A
group: Controls (draft, analytics; decision 0023)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 7
target_phase_source: default
requirement_rows:
  - 65
  - 169
  - 201
sources: "FDA data-integrity Q&A on audit-trail review (row 65), EU GMP Annex 11 draft revision on audit-trail review (row 169) and EMA Q&A on risk-based review of electronic data (row 201); paraphrased. Decisions 0016 (item 8) and 0023; DI-25, DI-26."
behaviour: "Audit-trail anomaly detection (rules such as late or back-dated entries, high correction counts, one account on two terminals too quickly, values too regular and tests repeated until a pass, then statistical baselines per person) is an aid to the audit-trail review and to the risk-based review of system logs, not a finding. Each flag shows its rule, its reasons and links to the audit entries behind it. Flags about a person or an account are readable only by holders of the data-integrity review permission, also when the application role queries the database directly, and they send no notification to the person or their line. A flag closes only with a QA disposition; a confirmed problem is raised through the deviation process. In the batch audit-trail review a flag may order or highlight entries but never hides one, and the review task is unchanged. The audit facts the detection reads carry no old or new values."
catalog_test: "seed a late entry, a back-dated entry, a login on two terminals within a minute and a test repeated until a pass; each raises its rule's flag with its reasons, and the clean persons raise none; read a person flag without the data-integrity review permission, through the server and as the application role; refused; the flag sent no notification; it closes only with a disposition; the batch audit-trail review lists the flagged entries first and still lists every entry; the audit facts carry no old or new value."
