id: DI-45
title: Backup and restore
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
