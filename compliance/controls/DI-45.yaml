  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] while a drill copy exists, the application role cannot connect to it"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a drill detects a restored copy that differs from production, reports it and raises an alarm"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] the drill script runs end to end and exits 0 on PASS"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a successful retention-grade backup is encrypted, hashed, write-once and catalogued"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a failing backup job is logged, raises an alarm, writes its report and exits non-zero"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a catalogued backup cannot be deleted or altered through the database, not even by the table owner"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a person at a terminal cannot record a backup or a drill result; only the system service account can"
  - "packages/kernel/test/continuity/backup-drill.test.ts > [DI-45] a retention-grade backup cannot be catalogued without write-once retention"
  - "packages/kernel/test/continuity/restore.test.ts > [INV-08][DI-45] a restore event needs a second, named person: the operator cannot approve it and approval is refused to anyone not named"
  - "packages/kernel/test/integration/authorization.test.ts > [DI-45][DI-37] a restore is approved only with the approver's own RESTORE_APPROVED signature of that event"
  - "packages/kernel/test/audit/verification.test.ts > anchors are independent of the database collation (F7) > [INV-08][DI-23][DI-45] the Merkle root and the head order of an anchor are the same in a database with a linguistic collation"
  - "packages/kernel/test/continuity/anchors.test.ts > external anchors and a lawful purge > [INV-08][DI-47][DI-45] an anchor taken during a record's retention still matches after the record is purged; the start-up check stays clean"
  - "packages/kernel/test/continuity/anchors.test.ts > which differences a restore event may discard > [INV-08][DI-45] history beyond where the restored chain ends, anchored after the restore point, is discardable"
  - "packages/kernel/test/continuity/anchors.test.ts > which differences a restore event may discard > [INV-08][DI-45] an anchored entry still present with another hash, an anchor older than the restore point, or one this server exported is never discardable (F57)"
  - "packages/kernel/test/continuity/backup-drill.test.ts > restore drill > [DI-45][DI-23] a drill verifies every chain found in the audit trail: a chain whose head row was deleted is still verified and reported"
  - "packages/kernel/test/continuity/backup-drill.test.ts > backup jobs > [DI-45] the catalogue itself refuses a retention-grade entry without a write-once lock, or with a lock that has already lapsed"
  - "packages/kernel/test/continuity/backup-drill.test.ts > backup jobs > [DI-45] a backup job with a write-once period that is not a positive number of days fails, is logged and alarmed"
  - "packages/kernel/test/continuity/backup-drill.test.ts > backup jobs > [DI-45] a backup whose encryption key file cannot be read when the job runs is a failed run: logged, alarmed, reported, exit 1 (not a usage error)"
  - "packages/kernel/test/continuity/ledger-json.test.ts > continuity ledger JSON > [DI-45] keys are sorted at every level, undefined members are left out, arrays keep their order"
  - "packages/kernel/test/continuity/ledger-json.test.ts > continuity ledger JSON > [DI-45] what JSON cannot carry faithfully is refused: a Date, Map, Set or class instance, undefined, a function, a symbol, an array hole"
  - "packages/kernel/test/continuity/ledger-json.test.ts > continuity ledger JSON > [DI-45] an entry the ledger cannot write is a rejection and leaves the file untouched"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-08][INV-27] a restore event that does not exist is never approved, approvable or completable"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][DI-37][INV-08] every named approver approves with their own RESTORE_APPROVED signature; one approval of two is not enough"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-08] an approval is refused when the stored restore event no longer matches its content hash"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] completion refuses malformed high-water marks and a margin that is not positive (EBMR-CONT-022)"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] a counter the external ledger does not cover, or covers below its restored ceiling, stops the completion"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] completion never moves a sequence beyond its maximum, registered or not (EBMR-CONT-024), and a refused completion moves nothing"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-03][INV-08] the operator of a restore never approves it, even after moving to an approver role; their approval of another restore leaves this one approved"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] an approved restore completes: counters move to the ledger ceiling, sequences past their marks (up to their maximum), unregistered ones by the margin"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45] a completed restore event takes no further approval; another pending event is still approved as usual"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] a restored copy refuses to complete an event recorded before the copy was made, and to acknowledge a ceiling reserved before it"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] completion refuses login names from the external ledger that are not a JSON array, before anything moves (EBMR-CONT-022)"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > restore events > [DI-45][INV-27] where this database secured its identifiers, completion moves a sequence to the ledger mark plus its margin, not a margin beyond its own position"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > external anchors: classification when a restore is recorded, and coverage by an approved restore event > [INV-08][DI-45] lost history is discardable only when every differing head has a readable position and the anchor was created strictly after the restore point"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > external anchors: classification when a restore is recorded, and coverage by an approved restore event > [INV-08][DI-45] an external anchor record whose root cannot be checked against its heads (a head without its hash) is inconsistent: never discardable, and its root is reported"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > external anchors: classification when a restore is recorded, and coverage by an approved restore event > [INV-08][DI-45] an approved restore event covers only the history it discarded: not history the restore kept, and not an anchor id this database issued again"
  - "packages/kernel/test/mutation/protected-numbers.test.ts > external anchors: classification when a restore is recorded, and coverage by an approved restore event > [DI-45][INV-27] where the identifiers were never secured (the database is bound by its own anchor export), completion moves a sequence past its restored position by the whole margin"
  - "packages/kernel/test/review/f57.test.ts > F57: an approved restore event must not cover changed (not lost) anchored history > [INV-08][DI-45][DI-23] a FAILOVER event on a never-restored database does not turn a rewritten anchored event into COVERED"
