id: ST-27
title: Pure (clean) steam quality status for sterilisers and SIP
part: C
group: "Theme 3: Utilities (WFI, clean steam, gases)"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 441
sources: "EU Annex 1: 6.16, 6.17 | US: FDA-AP XII (steam generator output reviewed for release)."
behaviour: |-
  - Before an autoclave or SIP cycle, the system checks that the supplying pure-steam system has results within limits and not overdue for: the latest condensate test (meets the WFI monograph; microbial testing not mandatory) and the periodic non-condensable gas, dryness and superheat tests.
  - If not, the cycle is flagged as "unverified steam" and deviation-gated.
catalog_test: Make the dryness test overdue → the autoclave run is flagged.
implemented_by: {}
tests:
  - "packages/recipe-core/test/plant/equipment.test.ts > fitness: qualification, calibration, maintenance, failure (IN-25 (b)(d), PR-23) > [ST-25][ST-26][ST-27] a point of use (WFI outlet, nitrogen drop, clean-steam point) is a unit whose status follows QC: taken out of service on a failed result it may not be used, returned to service on a passing one it may"
clauses:
  - clause: "Make the dryness test overdue → the autoclave run is flagged."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Pre-cycle check of steam tests; \"unverified steam\" flag"
