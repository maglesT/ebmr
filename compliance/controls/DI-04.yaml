id: DI-04
title: Verification of each MBR version and configured workflow before it becomes Effective
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 61
  - 36
  - 617
sources: 'US: 211.68(b), 211.100(a), 211.186(a); FDA DI Q&A Q3, Q6, Q11 | EU: Ch.4 preamble "instructions" type (starting materials, equipment and computerised systems to be named; PAT with acceptance criteria), 4.3; Annex 11 §4.1, §10 | ICH/EMA/draft: none'
behaviour: |-
  - QA cannot set Effective status until a verification record is linked. This applies to every MBR version and every configured GMP workflow, report, calculation, interface mapping and review-by-exception rule set. The record shows that the steps, requirements, limits, calculations and signature points work as intended.
  - The verification method is documented review plus test. A dry-run/simulation mode is one acceptable method, not a requirement (see DI-05 if one is offered).
  - MBR steps name the computerised systems they rely on: PLC/SCADA recipe and version, weighing system, checkweigher, vision/serialisation system, autoclave or lyophiliser controller, filter-integrity tester.
  - PAT steps define the method, the model version and the acceptance criteria. An MBR containing a PAT step without acceptance criteria cannot be approved.
  - At execution, the record captures the system/recipe version actually used and flags any mismatch with the MBR.
  - The MPCR carries author and independent-checker e-signatures from two different people, then QU approval (the signature types are in DI-35; MBR content minima are in the production catalog).
catalog_test: Try to make a new MBR version Effective without a verification record. It is blocked. Run a batch whose PLC reports a different recipe version from the MBR. It is flagged as an exception.
implemented_by:
  modules:
    - "packages/recipe-core/src/flow/canonical.ts (content hash)"
    - "packages/recipe-core/src/validator"
    - "packages/recipe-core/src/simulator (simulate, evidence)"
    - "packages/recipe-core/sql/0120_mbr_evidence.sql (MBR life cycle: evidence stored with the exact content hash, result decided by the database, voided by any content edit)"
    - "packages/recipe-core/sql/0130_mbr_guards.sql (guards validator_passed, evidence_complete)"
    - "packages/recipe-core/sql/1830_evidence_sandbox_optional.sql (owner decision 0026 O-2: the evidence is the validator report, the simulation and the test vectors on the exact content; a sandbox run is optional, and one recorded that did not pass keeps the evidence incomplete)"
    - "packages/recipe-core/sql/0160_market_authorisation.sql (no market authorisation without complete verification evidence)"
    - "packages/recipe-core/src/lifecycle/verification.ts (verification port over the validator and simulator)"
    - "apps/tablets-server/sql/0150_designer.sql (tab.reference_document DMS stand-in: insert-only, audited, hash recomputed; tab.designer_justification)"
    - "apps/tablets-server/src/features/designer/adapters (ReferencePort over tab.reference_document; MarketMinimaPort over market.resolve, failing closed)"
    - "apps/tablets-server/src/features/designer/simulation.ts and simulate-worker.ts (simulation of the saved content in a worker thread with a timeout; no writes)"
    - "apps/tablets-server/src/features/designer/index.ts (startVerification: lifecycle.validateAndStartVerification; evidence views valid only for the current content hash)"
    - "apps/tablets-web/src/features/designer/model/ops.ts (an edit that would bring text no record can hold into the MBR content is refused, naming the field, so the designer never hashes such content; review F31 round 2)"
  guards:
    - "buildVerificationEvidence / verifyMbr: validator report, warning justifications and simulation report bound to the content hash"
    - "evidenceHolds: only unaltered VERIFIED evidence of exactly this content counts (for the MBR life-cycle gate)"
    - "GMP-SYSTEMS (computerised system and recipe version named), GMP-PAT (PAT acceptance criteria), GMP-REFERENCES (pinned and effective), FLOW-LIBRARY (pinned element hash)"
    - "deltaVerification: value-only changes reuse structural evidence and rerun the changed items"
    - "mbr_version.validator_passed (DRAFT -> IN_VERIFICATION) and mbr_version.evidence_complete (SUBMIT, APPROVE): validator, simulation, author-confirmed test vectors and a sandbox run (or delta verification) recorded for the exact content hash"
    - "recipe.activate_market_authorisation: QA cannot make a version CURRENT for a market without a complete verification record (EBMR-RCP-087)"
  db_constraints:
    - "recipe.mbr_evidence and recipe.mbr_evidence_void insert-only; a content revision voids all evidence of the version in the same transaction"
