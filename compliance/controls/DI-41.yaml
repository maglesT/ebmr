id: DI-41
title: True copies (paper to electronic, electronic to electronic)
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 67
  - 114
  - 647
sources: "US: 211.180(d), 211.68(b); FDA DI Q&A Q1e, Q9, Q10 | EU: Ch.4 4.1 (official copies), 4.10 | ICH/EMA/draft: draft Ch.4 retention/copies and glossary (true/verified copy) (draft)(s)"
behaviour: |-
  - The true-copy function keeps the content and meaning of the original: all metadata needed to reconstruct the activity, and the original's static or dynamic nature.
  - Each true copy carries the source ID, a checksum and capture metadata.
  - A verifier e-signature confirms that the copy is complete and legible.
  - A true copy of a dynamic record is kept in the original format or in one that preserves content and meaning, and a suitable reader stays available for the whole retention period.
  - Fading or short-lived media are true-copied promptly: thermal balance, pH or checkweigher slips, and chart-recorder output (e.g., autoclave or lyophiliser charts in the Injectables edition).
  - Paper originals are kept unless QA approves destruction under an SOP after a verified true copy exists (see open questions).
catalog_test: Scan a thermal printout. The copy carries a checksum, a verifier signature and a link to its step. Alter the file. The checksum check fails.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/recording.ts (G-05 attachment entry)"
  guards:
    - "G-05: an attached scanned paper original carries its SHA-256 and makes a second-person verification of the step mandatory"
tests:
  - "packages/recipe-core/test/blocks/process.test.ts > G-05 observation capture and G-13 IPC > [DI-41][DI-30] a scanned paper original attached as evidence makes a second-person verification mandatory"
  - "apps/tablets-server/test/release/qp-shipping-routes.test.ts > the EU QP batch package over HTTP (DI-41, DI-14) > [DI-41][DI-14] QA assembles and signs the package of a released lot; the QP lists and downloads it, the copy verifies against the registered hash, and the QP account reaches nothing else"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41] the database computes the package hash again, checks every section and every true copy, and stores the package; the copy verifies offline"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41] a package whose hash, sections or copies do not match is refused, and an altered byte fails the offline check"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41] a true copy read through the definer is the copy the direct builder makes, and only a person who registers true copies reads it"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41] a true copy of an insert-only table without an id column verifies row by row, and a row left out or altered is reported"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41] the register is written only by the definers: the application role and a person without the permission are refused"
  - "packages/kernel/test/records/qp-package.test.ts > the EU QP batch package (DI-41) > [DI-41][DI-35] QA issues the package with a TRUE_COPY_VERIFIED signature of this package, made by the person who records it, once"
  - "packages/kernel/test/records/qp-package.test.ts > the QP account: read-only, time-boxed, one lot (DI-14, DI-17) > [DI-14][DI-41] no package of a lot is served or opened to a QP while its release is suspended or its EU market removed"
  - "packages/kernel/test/records/qp-package.test.ts > package sections belong to the lot (review 4b-2) > [DI-41] a true copy of another lot's record, or of a subject no module answers for, is refused"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: FDA says "true copy". "Certified" or "verified copy" is EU/PIC/S terminology. The requirements match, and the EU draft adds documented verification.
type_detail: "ENFORCED (preservation of content, meaning and metadata). DESIGN-CHOICE, engine-enforced: the verifier signature is not described in the FDA Q&A; it follows the EU draft's documented-verification expectation, which does not conflict."
