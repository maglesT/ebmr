id: IN-14
title: Master packaging instructions
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 240
sources: Schedule M Part I 17.3.7 (packaging instructions).
behaviour: "A separate approved packaging master per product x pack size x pack type, linked to the MBR, containing: product name; form, strength and method of application where relevant; pack size; complete packaging bill of materials for the standard batch with quantities, sizes, types and each material's specification code; an image of each approved printed component with the positions of batch number, expiry date and (for India packs) manufacturing date and MRP marked; line-clearance checks before and after packaging; the operation description and equipment; IPCs with sampling instructions and limits. A packaging order cannot start unless every printed component in the bill has an attached approved specimen."
catalog_test: create two pack sizes of one product; each needs its own approved packaging master.
implemented_by: {}
tests:
  - "apps/tablets-server/test/designer/from-formula.test.ts > a new master from an approved formula (slice 7j) > injectables I-1c2 P3: a packaging master from the formula (lead ruling option (a)) > [PR-31][PR-32][PR-39][IN-14] P3c: the firm's own allowance, reconciliation limits (211.125(c)) and specimens (211.188(b)(8)) typed at create time are written exactly as typed and each specimen document in force is pinned; the validator then asks only for the yield range"
  - "apps/tablets-server/test/designer/from-formula.test.ts > a new master from an approved formula (slice 7j) > injectables I-1c2 P3: a packaging master from the formula (lead ruling option (a)) > [PR-32][IN-14] P3c: a specimen code with no SPECIMEN document in force is refused (record integrity: a master does not pin a document that does not exist), never dropped"
