  - "packages/recipe-core/test/lifecycle/packaging-issue.test.ts > planning a packaging order (Phase 4 slice 2c; recipe-core 0760 to 0762) > [IN-14][PR-01] two pack sizes of one product each need their own approved packaging master: an order for a pack size is planned only on an approved, authorised master listing it, never on the other pack size's master, and a second family of the same pack size and type is refused"
