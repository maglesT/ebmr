id: IN-36
title: Sifting, mixing, granulation and drying controls; sieve, punch and die checks
part: D
group: Tablets edition
editions:
  - tablets
type:
  - ENFORCED
target_phase: 3
target_phase_source: outline
requirement_rows:
  - 262
sources: Schedule M Part VIII 1.3-1.4 (metal detector recommended; wooden equipment avoided; screens, sieves, punches and dies checked before and after each use; sifting), 2.1-2.5 (dust extraction; sieve residues; CPPs in master formula and batch record; FBD bags; solutions).
behaviour: "(a) Step types for sifting, dry mixing, granulation, drying (fluid-bed/tray), blending and lubrication carry typed CPP fields with limits (time and temperature at minimum; others such as impeller speed, inlet/outlet air temperature, LOD as the MBR defines); observed values are captured. (b) Sieves/screens record ID and mesh, with an integrity check both before and after each use; punches and dies record an inspection for wear or breakage before and after each use; a failed after-use check opens a deviation covering the material processed. (c) Sieve residues are examined for foreign material at the MBR-defined frequency. (d) Fluid-bed filter bags are tracked by ID: a bag registered to another product is blocked unless a washing record exists; for products flagged highly potent or sensitising, product-dedicated bags only. (e) Metal-detector challenge records where fitted. (f) Granulation/coating solutions record preparation time and use-by limits. (g) Dry ingredients are sifted before use unless the MBR records that input quality is assured."
catalog_test: omit the after-use sieve check; the step cannot be closed. Use an FBD bag from another product without a wash record; blocked.
implemented_by: {}
tests:
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > golden fixtures of the granulation blocks > [DI-34][IN-36][INV-24] TB-02 Sifting and milling with screen integrity: Two materials sifted through screen SCR-40 checked intact before use; the after-use check finds it damaged: both passes are held, SCREEN_INTEGRITY_FAILED waits for a deviation; performed and verified"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > golden fixtures of the granulation blocks > [DI-34][IN-36][PR-30] TB-03 Solution preparation with use-by: A binder solution of 12.000 kg prepared (use-by 4 h from preparation, at the server time), 0.300 kg remainder discarded; performed and verified"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > golden fixtures of the granulation blocks > [DI-34][IN-36][PR-08][DI-31] TB-04 Wet granulation with end point: A high-shear granulation: impeller speed read back, power and product temperature collected from the granulator; the end point called on the power value (4.20 kW, range 3.80 to 4.60 kW) and computed into the end-point item; performed and verified"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > golden fixtures of the granulation blocks > [DI-34][IN-36][PR-29] TB-05 Drying with LOD loop and filter bag: One fluid-bed drying iteration: the filter bag (last used for this product) checked before and after use, the inlet temperature read back and the bed temperature collected, 25 min of drying measured, the LOD sample taken and the LOD (2.8 %) recorded within 2.0 to 3.5 %; performed and verified (the loop is the MBR's, proven with the database)"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > golden fixtures of the granulation blocks > [DI-34][IN-36][PR-29] TB-07 Blending, lubrication and blend uniformity: Blend 10 min (8 to 15 min), lubricant added after the main blend, lubricated 3 min (2 to 5 min), times computed into their items; blend uniformity at 3 of 4 planned locations: the missing one is flagged (BU_LOCATION_MISSING); performed and verified"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-02 sifting and milling > [PR-23][IN-36] the step names its sifter or mill, which a G-09 step of the MBR checks; screens are listed once"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-02 sifting and milling > [IN-36][INV-24] a pass only through a screen checked intact before use; the approved aperture only; the step never closes without the after-use check (IN-36 catalogue test); a damaged screen is never used again"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-02 sifting and milling > [IN-36][PR-29] foreign matter in a residue raises FOREIGN_MATTER_FOUND, a deviation that holds the steps after it; a screen found damaged before use is only flagged"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-03 solutions with use-by > [IN-36][PR-30] the use-by is mandatory; preparation starts it at the server time (preparedAtUs, useByUs); one preparation; a discard never exceeds the preparation; the step closes only prepared"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-04 wet granulation end point > [DI-32][IN-36] a manual end-point call (a value keyed under the MBR fallback) needs a reason and makes the step need a second person"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-04 wet granulation end point > [IN-36][IN-13] a time end point is the massing time measured between MASSING_START and END_POINT (server times): refused before the minimum, a deviation beyond the maximum"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-04 wet granulation end point > [IN-36][PR-29][DI-34] extra granulating fluid only at a step of an operator-choice branch (G-19), by a role the MBR names, a deviation beyond its maximum; the binder total outside the MBR range is a deviation at PERFORMED"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-05 drying with the LOD loop > [IN-36][PR-27] review 3b finding 4: a bag check before use states the bag's history (the product it was last used for, or a new bag): leaving it out never skips the wash rule; only product-dedicated bags need no history"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-05 drying with the LOD loop > [IN-36][DI-34] the drying step sits in a bounded loop that exits on its LOD (a process end point with an upper limit), of at most 10 iterations"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-05 drying with the LOD loop > [IN-36][PR-27] a filter bag last used for another product is refused without its wash record (IN-36 catalogue test); a product-dedicated bag where the MBR asks for one; drying only after the bag check; the step closes only with the bag checked after use"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-05 drying with the LOD loop > [IN-36][PR-29][DI-29][DI-34] every drying iteration is its own step instance kept in order; the loop repeats while the LOD is out of range and exits on it; at its maximum an unmet LOD exhausts the loop (an exception, never more iterations); over-drying is a limit breach"
  - "apps/tablets-server/test/blocks/granulation/blocks.test.ts > TB-07 blending, lubrication and blend uniformity > [IN-36][IN-13][PR-29][INV-25] blend and lubrication times are measured (never typed) and judged against their tiers; the main blend ends no earlier than its minimum and the lubricant is added only after it; beyond a maximum is a deviation"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][INV-24][PR-23] TB-02: a material pass only through a screen checked intact before use, a screen only with its approved aperture; an after-use check that finds the screen damaged holds exactly the passes since its last intact check, with the exception that waits for a deviation; a damaged screen is never checked or used again; the step never closes without the after-use check"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][PR-30][IN-13] TB-03 and TB-04: a binder solution's use-by starts at its preparation (database time); an addition is refused once the use-by has passed at the row's database time, or when it would use more than was prepared, or names no preparation of the batch; a forged use-by is refused; the solution step closes"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][IN-13] TB-04 time end point: the massing time is measured between the entries at database time; an end point before the minimum, or one stating another time, is refused"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [DI-31][DI-32][IN-36] TB-04 power end point: the granulator's value stands on the claimed reading of the step's bound device (tablets 0820, G-06), and the end point on that usable value of the end-point tag, exactly; a TB-03 step cannot be bound to a device"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][PR-30] review 3b finding 6: a quantity sum is null-safe: an entry without a unit, or no unit to compare with, gives no sum (the use-by and overuse checks then refuse)"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][PR-27] TB-05: a filter bag last used for another product is refused without its wash record (IN-36 catalogue test), drying starts only after the bag check, the drying time is measured; the drying loop never runs beyond its maximum iterations"
  - "apps/tablets-server/test/blocks/granulation/db-guards.test.ts > the granulation blocks in the database (tablets 0850, 0851) > [IN-36][IN-13][PR-29][INV-25] TB-07: the main blend ends no earlier than its minimum (database time), the lubricant only after it, BU samples only of the plan after blending and in 1 to 3 unit doses unless justified; the blend time item is the block's measured value, never typed; the step closes only with every planned sample or the missing ones flagged, and its honest close stores the computed time"
