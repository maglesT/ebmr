  - "apps/tablets-server/test/blocks/compression/blocks.test.ts > TB-09 tooling custody > [IN-36][INV-24] the return step inspects a set only after its return, closes only with every returned set inspected after use (IN-36 catalogue test); a missing punch or die and a passed usage limit wait for a deviation"
