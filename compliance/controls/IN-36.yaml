  - "apps/tablets-server/test/blocks/compression/db-guards.test.ts > the compression blocks in the database (tablets 0870 to 0874) > [INV-24][IN-36][PR-27][PR-22] the tooling register: a set is issued only for its own product, after a passing inspection before use with every checklist item, never twice at once; the strokes of a use come from the press counter; a set at or past its stroke limit may not compress and is never issued again; nobody writes the register directly"
