id: ST-04
title: Contemporaneous recording and departures from the MBR
part: C
group: "Theme 0: Cross-cutting rules (apply to every theme)"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 366
sources: "EU Annex 1: 8.7 (defined process) | US: 211.100(a)-(b), 211.186, 211.188; FDA-AP XII (text box)."
behaviour: |-
  - All steps carry server-synchronised timestamps and attributed e-signatures. An entry made more than a configurable window after the recorded activity is flagged "late" and needs a reason. The window is a DESIGN-CHOICE, default 15 min; neither text gives a number.
  - A skipped or out-of-sequence step, an out-of-range parameter or substitute equipment forces a deviation with justification before the next dependent step.
  - MBRs cannot be executed until QA has approved them.
catalog_test: Sign a step 3 h after the activity → flagged "late" and a reason required. Execute step 7 before step 6 → deviation required.
implemented_by: {}
tests: []
clauses:
  - clause: "Sign a step 3 h after the activity → flagged \"late\" and a reason required."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Late-entry window (design choice, 15 min) with reason"
  - clause: "Execute step 7 before step 6 → deviation required."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "with reason; forced deviation for out-of-sequence steps"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "existing kernel only; no late-entry timer"
build_status: SPECIFIED
jurisdiction: Aligned. The US wording is binding.
scope: all
