id: DI-07
title: Risk-based data-criticality classification (raises controls, never removes floors)
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 148
  - 202
