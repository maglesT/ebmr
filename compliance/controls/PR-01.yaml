      reason: "No packaging master keyed by product, pack size and pack type exists yet: an MBR family of record kind PACKAGING is keyed by batch sizes (recipe-core 0110). Packaging orders and their masters come with blister packaging (G-21) in the Tablets edition, Phase 3 (build outline 11)."
expert_decision:
