id: ST-53
title: Filter single-batch use, maximum duration, and vent filter lifecycle
part: C
group: "Theme 8: Sterilising filtration, filter integrity (PUPSIT/post-use) and bioburden"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
