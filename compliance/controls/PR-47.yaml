id: PR-47
title: Reprocessing and recovery of earlier batches
part: B
group: "G. Material and product status: quarantine, rejected, reprocessed, recovered and returned"
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 21
  - 135
  - 136
sources: "US: 211.115(a)-(b); 211.165(f) | EU: Ch.5 5.67; 5.68; 5.69; Ch.4 4.20(d) | ICH/EMA/draft: none"
behaviour: |-
  - Reprocessing:
    - It runs only from a QCU-approved reprocessing procedure or master. That procedure is linked to the non-conforming batch, its investigation and a documented risk evaluation.
    - It creates a child execution record and genealogy edges.
    - The product must meet its specifications before acceptance.
    - It is flagged for review and PQR.
  - Recovery (adding conforming earlier batches of the same product at a defined stage):
    - The step type exists only where the master defines it, and only for the same product.
    - Prior authorisation is required, with a referenced risk evaluation that includes the effect on shelf life.
    - The source batch IDs and quantities are recorded, which also meets 4.20(d).
  - Additional testing: before release of any reprocessed or recovered-material batch, a QC decision on the need for additional testing is a mandatory field.
catalog_test: Starting reprocessing without QCU approval or a risk evaluation is blocked. Recovering material from a different product is blocked. A missing QC decision on additional testing blocks release.
implemented_by:
  modules:
    - "packages/recipe-core/src/blocks/generic/process.ts (G-24)"
    - "packages/recipe-core/sql/0345_start_data_and_status_equipment.sql (test runs: no accepted start data; a start-data authoriser is a person of the installation)"
    - "packages/recipe-core/src/blocks/generic/reprocessing.ts (G-24@2 and the addition rules)"
    - "apps/tablets-server/src/blocks/tb-08.ts (TB-08)"
    - "packages/recipe-core/sql/0620_g24_database_path.sql to 0624_whole_batch_reprocessing.sql"
    - "apps/tablets-server/sql/1020_tb08_registers.sql to 1022_recovered_expiry_cap.sql"
  guards:
    - "G-24: a reprocessing step declares its case (G24-NO-CASE); start needs prior QA authorisation citing an investigation and a risk evaluation (G24-NOT-AUTHORISED, G24-SELF-AUTHORISED); other product, chained recovery, age, percentage and source-batch limits refused; QC_ADDITIONAL_TESTING_DECISION blocks release"
    - "recipe-core 0345: in a test run an accepted START_STEP records no start data (the quality unit's authorisation of a reprocessing is not given through a test run), and start data names its authoriser by the id of a person of this installation (EBMR-EXE-126)"
    - "recipe-core 0621/0622, tablets 1021: an addition (G-24@2, TB-08) stands on source facts read by the database, per-use QA authorisation (REPROCESSING_AUTHORISED, never the adder's), same product and strength, case-matching status (reserved residue or QA-released), MBR age, percentage and source-batch limits, chained recovery blocked; refused rows EBMR-RPR-030/031"
    - "recipe-core 0620: G-24@1 SOURCE_ADDITION refused on GMP (EBMR-RPR-001)"
    - "recipe-core 0624: whole-batch reprocessing planned only on a QCU-signed request citing a concluded deviation-lite investigation and a stored risk evaluation, product master permitting, not authorised by the issuer (EBMR-RPR-052, 053); recipe.reprocessing_release_problem reports a missing QC decision on additional testing"
