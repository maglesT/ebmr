id: PR-06
title: Change control for masters and linked GMP objects
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 215
  - 198
  - 143
  - 220
  - 606
  - 205
sources: "US: 211.100(a); 211.22(c); 211.68(b); 211.194(b) | EU: Ch.5 5.24; 5.25; 5.26; Ch.4 4.29 (change control); Annex 11 section 10 | ICH/EMA/draft: ICH Q10 3.2.3 (s); ICH Q9(R1) 5.1 (s); ICH Q12 ch.6 (s); EU Annex 15 section 11 (u)"
behaviour: |-
  An Effective master cannot be edited. A new version needs a linked, approved change record that holds:
  - description and rationale;
  - a risk assessment whose formality matches the risk;
  - an impact assessment covering specifications, equipment, validation, cleaning, training, labels, products sharing the line, and other sites holding copies;
  - a regulatory-impact decision for each market;
  - a validation reference, for process-impacting changes (CPP ranges, equipment class, materials or suppliers, batch size, sequence, test method).
  A diff report lists the changed fields. Implementation is tracked per site. A post-implementation effectiveness review is scheduled automatically. Shop-floor test methods can only be changed through this route, with a reason and comparative data.
catalog_test: A direct edit of an Effective master is impossible. A process-impacting change with no validation link cannot be approved. The diff report lists exactly the changed fields.
implemented_by:
  modules:
    - "packages/recipe-core/sql/0110_mbr_family_version.sql (content revisions accepted only in DRAFT; version identity immutable)"
    - "packages/recipe-core/sql/0130_mbr_guards.sql (recipe.process_impact, guards change_record_linked and change_control_complete)"
    - "packages/recipe-core/sql/0150_mbr_commands.sql (derive_version; create_version refused once a version was approved)"
    - "packages/recipe-core/src/lifecycle/change.ts (versionDiff with the flow model diffMbr, processImpact mirror, bulkApprovalPackage)"
    - "apps/tablets-server/src/features/designer/index.ts (saveContent: DRAFT only, a revision only on the latest base revision, else 409; no revision without a change)"
    - "apps/tablets-web/src/features/designer (read-only unless DRAFT; stale-revision refusal shown; unsaved edits kept as a local draft only, decision D7)"
  guards:
    - "recipe.assert_draft: an APPROVED or CURRENT version never changes (EBMR-RCP-021); a change is a new DRAFT derived from an approved version"
    - "mbr_version.change_record_linked (SUBMIT) and mbr_version.change_control_complete (APPROVE): a process-impacting change (computed against the baselines, or so classified by the change owner) needs a validation link; a first version is a new process"
  db_constraints:
    - "recipe.mbr_content insert-only (kernel.reject_mutation) with a DRAFT-only insert guard; the application role has no write privilege"
    - "recipe.approved_content_violations(): no content revision after first approval"
