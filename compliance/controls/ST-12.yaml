  - clause: "APS qualified 4 people and 5 are present during filling → deviation, with the peak shown on the timeline."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Access-control import, peak headcount against room maximum, transfer count"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "existing signer roster only (see unsure list)"
build_status: SPECIFIED
jurisdiction: Aligned. EU requires the maximum operator number to be documented and challenged in APS.
scope: aseptic
type_detail: "CONFIGURABLE (maximum per room is master data, must be ≤ the maximum qualified in the latest successful APS). ENFORCED: deviation when exceeded."
