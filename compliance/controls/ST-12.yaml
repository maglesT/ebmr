id: ST-12
title: Headcount limit and personnel presence log
part: C
group: "Theme 1: Personnel qualification and gowning gate"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 445
  - 285
sources: "EU Annex 1: 7.1, 7.2 | US: 211.42(b) (inferred); FDA-AP IV.E."
behaviour: |-
  - Records who was present in each aseptic room, with entry and exit times, from access control or sign-in/out.
  - Computes peak concurrent headcount and compares it with the room maximum. Exceeding it raises a batch event and a deviation.
  - Counts transfers into the critical zone.
  - The roster is printable in the batch report.
catalog_test: APS qualified 4 people and 5 are present during filling → deviation, with the peak shown on the timeline.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > aseptic headcount and the overlay gas filter (I-6 B1) > [ST-12] filling records the most people present in the filling room at once; more than the formulation's maximum (the number qualified in the process simulation) is an exception that stops the step"
clauses:
  - clause: "APS qualified 4 people and 5 are present during filling → deviation,"
    tests:
      - "packages/recipe-core/test/library/seed-injectables.test.ts > aseptic headcount and the overlay gas filter (I-6 B1) > [ST-12] filling records the most people present in the filling room at once; more than the formulation's maximum (the number qualified in the process simulation) is an exception that stops the step"
  - clause: "with the peak shown on the timeline."
    not_required:
      decision: "docs/decisions/0030-injectables-unbuilt-minimum.md (lead ruling under the owner's minimum-compliance rule, 13 November 2026)"
      reason: "peak headcount on the timeline: display only; no binding clause"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "existing signer roster only (see unsure list)"
build_status: SPECIFIED
jurisdiction: Aligned. EU requires the maximum operator number to be documented and challenged in APS.
scope: aseptic
type_detail: "CONFIGURABLE (maximum per room is master data, must be ≤ the maximum qualified in the latest successful APS). ENFORCED: deviation when exceeded."
