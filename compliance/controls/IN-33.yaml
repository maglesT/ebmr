id: IN-33
title: Pharmacopoeia and edition references in specifications and limits
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 665
sources: Schedule M Part I PQS resources list (Act, Rules, latest IP, official guidance), 15.2 (IP reference standards from IPC), 17.3.2 (specifications revised for new pharmacopoeia editions); packaging materials to meet IP requirements.
behaviour: Each specification and each IPC limit in an MBR stores its source (IP, BP, Ph. Eur., USP, in-house) and edition as data. Marking a new edition effective (e.g., IP 2026 from 1 Jul 2026) lists every MBR whose limits cite the previous edition and opens a change-control task. For multi-market products, each limit shows its source and the narrower range is enforced (IN-34, IN-52). Reference standards record their source (IP reference standards from the Indian Pharmacopoeia Commission). The latest IP edition, the 1940 Act and the 1945 Rules are listed as controlled reference documents.
catalog_test: mark IP 2026 effective; all MBRs citing IP 2022 appear on the review list.
implemented_by: {}
tests:
  - "apps/tablets-web/test/designer/document-complete.test.tsx > the read-only document shows the members of the saved content (review F44) > [PR-02][PR-03][IN-33] acceptance schemes are shown with their criteria, markets, pharmacopoeia, ranges in words and sampling"
  - "packages/site-services/test/quality/specifications.test.ts > specifications (IN-33) > [IN-33] a specification cites the pharmacopoeia and edition of every limit, is approved by another person than its drafter, and the highest approved version is in effect"
  - "packages/site-services/test/quality/specifications.test.ts > specifications (IN-33) > [IN-33] marking a new edition effective lists every specification in effect whose limits cite the previous one"
  - "packages/site-services/test/quality/specifications.test.ts > results against the specification (IN-33, IN-20, PR-45) > [IN-33] the limits, unit and method of a result are the specification's, never typed; a test outside the specification in effect is refused; the stored row cannot carry other limits"
  - "packages/site-services/test/quality/specifications.test.ts > results against the specification (IN-33, IN-20, PR-45) > [PR-45][IN-33] a lot is released only against an approved specification and with a current, approved result of every required test: a lot with no results no longer passes"
  - "apps/tablets-server/test/quality/lims-routes.test.ts > specifications and results over HTTP (IN-33, PR-45) > [IN-33][PR-45] QC drafts a specification citing the pharmacopoeia and edition of every limit; only another person approves it (LIMS_ACT); a result takes its limits from it and the release check names the required test"
  - "packages/api-contract/test/contract.test.ts > route table > [IN-33] the specifications and samples namespaces (Phase 4 slice 2b) are GMP only, reads plain and commands FRESH_ON_SHARED, each route with an example; a result names no limits and a specification test cites its pharmacopoeia and edition"
  - "packages/recipe-core/test/lifecycle/edition-review.test.ts > the MBR edition review (recipe-core 1061; IN-33) > [IN-33] marking IP 2026 effective lists every MBR citing IP 2022"
  - "apps/tablets-web/test/office/quality-records.test.tsx > specifications > [IN-33] the review list names each master record version citing an older edition, with the limit that cites it"
