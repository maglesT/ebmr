    tests:
      - "packages/recipe-core/test/lifecycle/edition-review.test.ts > the MBR edition review (recipe-core 1061; IN-33) > [IN-33] marking IP 2026 effective lists every MBR citing IP 2022"
      - "apps/tablets-web/test/office/quality-records.test.tsx > specifications > [IN-33] the review list names each master record version citing an older edition, with the limit that cites it"
