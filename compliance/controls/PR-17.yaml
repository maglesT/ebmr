clauses:
  - clause: "One delivery containing three supplier batches creates three lots."
    deferred:
      phase: 6
      reason: "Receipt does not yet split a delivery into one lot per supplier batch; it comes with the Phase 6 receipt and ERP/WMS work (owner decision 0011)."
  - clause: "A supplier label naming an unapproved manufacturer blocks the lot."
    deferred:
      phase: 6
      reason: "There is no approved-manufacturer register to check a supplier label against yet; it is built in Phase 6 (owner decision 0011)."
  - clause: "A lot with no complete receipt record cannot be issued."
    deferred:
      phase: 6
      reason: "The receipt record is not yet complete (supplier and supplier lot optional; manufacturer, containers and examiner not recorded), so no completeness check gates issue; built in Phase 6 (owner decision 0011)."
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: EU requires a check against approved manufacturer/supplier data at every delivery (5.30) and API supply-chain traceability (5.29). US requires a distinct code for each lot in each shipment (211.80(d)). The kernel applies both.
type_detail: "ENFORCED at the eBMR boundary: a lot with an incomplete receipt record cannot be dispensed or issued. The receipt functions themselves are a DESIGN-CHOICE, used only if the eBMR/MES suite performs receipt; otherwise ERP/WMS does, over an interface."
