jurisdiction: EU is stricter. It sets fixed maximum requalification intervals (6 and 12 months) and at-rest plus in-operation limits. FDA-AP has no fixed room requalification interval; only HEPA leak testing is about twice a year (ST-17).
scope: all
type_detail: "ENFORCED. The maximum requalification intervals are locked: Grade A/B ≤6 months, Grade C/D ≤12 months. Mapping each step to a grade is CONFIGURABLE within the Annex 1 grade rules."
