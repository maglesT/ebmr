id: PR-41
title: OTC tamper-evident packaging
part: B
group: F. Packaging and labeling
editions:
  - tablets
type:
  - ENFORCED
target_phase: 3
target_phase_source: default
requirement_rows:
  - 25
sources: "US: 211.132(a)-(c) (exemptions and related procedures in (d)-(f)) | EU: none in Ch.4/5 | ICH/EMA/draft: none"
behaviour: |-
  - Required checks: the packaging master cannot be approved without steps that check the tamper-evident features (e.g. seal integrity, band presence).
  - Labeling-statement check: the statement must name every feature and any capsule-sealing technology, and refer to the identifying characteristic.
  - Capsules: two-piece hard capsules require verification of the sealing.
  - Failures: a failed seal check triggers segregation and a deviation.
catalog_test: An OTC packaging master without a tamper-evident check fails approval.
implemented_by: {}
tests:
  - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-23 bottle line (definition) > [IN-17][INV-32][IN-22][PR-41] the MBR names the G-21 step that issues and reconciles the roll labels with that item; the line unit is no other packaging step's; torque limits are ranges; a US OTC retail MBR checks the tamper-evident seal"
  - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-24 secondary packaging (definition) > [IN-17][PR-42][PR-41] the MBR names the G-21 step of the cartons; an EU pack and a US OTC retail pack check the anti-tampering or tamper-evident feature"
  - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [IN-17][INV-32][IN-22][PR-41][PR-42] the database accepts only an MBR whose bottle line names the G-21 step of its roll labels, whose cartoning names a G-21 step, whose packaging units are all different, and which checks the tamper-evident feature of a US OTC retail pack and the anti-tampering device of an EU pack"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: US-only. The EU anti-tampering device for prescription products is a separate obligation (see PR-42).
type_detail: ENFORCED when the product master flag "US OTC retail" is true; not applicable otherwise
