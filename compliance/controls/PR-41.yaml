id: PR-41
title: OTC tamper-evident packaging
part: B
group: F. Packaging and labeling
editions:
  - tablets
type:
  - ENFORCED
target_phase: 3
target_phase_source: default
requirement_rows:
  - 25
sources: "US: 211.132(a)-(c) (exemptions and related procedures in (d)-(f)) | EU: none in Ch.4/5 | ICH/EMA/draft: none"
behaviour: |-
  - Required checks: the packaging master cannot be approved without steps that check the tamper-evident features (e.g. seal integrity, band presence).
  - Labeling-statement check: the statement must name every feature and any capsule-sealing technology, and refer to the identifying characteristic.
  - Capsules: two-piece hard capsules require verification of the sealing.
  - Failures: a failed seal check triggers segregation and a deviation.
catalog_test: An OTC packaging master without a tamper-evident check fails approval.
implemented_by: {}
tests:
  - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-23 bottle line (definition) > [IN-17][INV-32][IN-22][PR-41] the MBR names the G-21 step that issues and reconciles the roll labels with that item; the line unit is no other packaging step's; torque limits are ranges; a US OTC retail MBR checks the tamper-evident seal"
  - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-24 secondary packaging (definition) > [IN-17][PR-42][PR-41] the MBR names the G-21 step of the cartons; an EU pack and a US OTC retail pack check the anti-tampering or tamper-evident feature"
  - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [IN-17][INV-32][IN-22][PR-41][PR-42] the database accepts only an MBR whose bottle line names the G-21 step of its roll labels, whose cartoning names a G-21 step, whose packaging units are all different, and which checks the tamper-evident feature of a US OTC retail pack and the anti-tampering device of an EU pack"
  - "apps/tablets-server/test/blocks/bottle/tb-23-edges.test.ts > TB-23 bottle line > [PR-41] a tamper-evident pack's seal check also checks the labelling statement; others state none"
  - "apps/tablets-server/test/blocks/bottle/tb-23-edges.test.ts > TB-23 definition checks > [IN-17][INV-32][PR-37][PR-41] the label step and item, the interval, the torque ranges, and a tamper-evident check for US OTC retail"
  - "apps/tablets-server/test/blocks/bottle/tb-24-edges.test.ts > TB-24 checks and examinations > [PR-41][PR-42] the anti-tampering check is configured, counts at most what was examined, fails on a defect and is missed strictly after its interval"
  - "apps/tablets-server/test/blocks/bottle/tb-24-edges.test.ts > TB-24 packs, shippers and the reconciliation > [PR-37][PR-41][IN-17] PERFORMED: the ATD stream, an in-run and a passing end-of-run examination, and the reconciliation"
  - "apps/tablets-server/test/blocks/bottle/tb-24-edges.test.ts > TB-24 definition checks > [IN-17][PR-41][PR-42][PR-37] the printed-material step, the ATD for the EU and for US OTC retail, whole-microsecond intervals"
  - "apps/tablets-server/test/execution/plain-words.test.ts > the anti-tampering check on an order whose markets do not need it (R10 #17) > [PR-41][PR-42] not offered where the master configures no anti-tampering check; offered with why where it does"
  - "packages/recipe-core/test/library/seed.test.ts > the ready-made catalogue > [IN-37][PR-41][IN-38][PR-03] post-fill capsule steps (Capsules C3): the checkweigher is challenged and its reject limits are critical values; inspection removes defective and foreign capsules with an independent check; printing records segregation, the edible ink and a print check each round and holds the print for QC; banding records the sealing technology, a critical band-solution temperature and holding time and a band check each round; a leaker fails the seal check"
  - "packages/recipe-core/test/validator/capsule-post-fill.test.ts > capsule post-fill duties in the validator (Capsules C3) > [PR-41] a master for US OTC retail packs of a two-piece hard capsule is refused without a banding or sealing step on every path; banded, a soft gel, a tablet or a non-OTC capsule pass"
