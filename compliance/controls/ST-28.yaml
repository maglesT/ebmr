  - "packages/recipe-core/test/library/seed-injectables.test.ts > aseptic headcount and the overlay gas filter (I-6 B1) > [ST-28] a compounding use without a nitrogen overlay needs no gas-filter limit: compounding has no gas-filter field, and its use passes the checker without one"
  - "packages/recipe-core/test/library/seed-injectables.test.ts > aseptic headcount and the overlay gas filter (I-6 B1) > [ST-28] the overlay gas filter's integrity after use is a critical value with its limit (every market): below it is an exception that stops the step, and without the result the step cannot complete"
