id: PR-13
title: Step-sequence enforcement and the in-line deviation path
part: B
group: B. Batch record issuance and execution
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 119
sources: "US: 211.100(b); 11.10(f) | EU: Ch.5 5.15; Ch.4 4.20(h); 4.21(g) | ICH/EMA/draft: none"
behaviour: The engine enforces step order, prerequisites and branch conditions. A user cannot skip or reorder a mandatory step, or use equipment or material the master does not list. The only way around the defined flow is an in-line deviation record (description, immediate action, impact) approved by the e-signature of a user designated competent for that deviation class. Planned departures are approved before execution; unplanned events are approved after the fact. Quality-relevant classes are routed to QC/QA. The deviation ID is linked to the step and shown in the record.
catalog_test: Skipping a mandatory step is blocked until a deviation is approved by an authorised role. A user cannot approve their own deviation.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/steps.ts (requestSkip, chooseAlternative)"
    - "packages/recipe-core/src/engine/batch.ts (raiseException, attachDeviation, dispositionException)"
    - "packages/recipe-core/src/engine/guards.ts"
  guards:
    - "Start, record or sign out of sequence is refused (ENG-NOT-ENABLED)"
    - "REQUEST_SKIP only for steps the MBR declares skippable, approved by a different person, never for CPP/CQA inputs, yield, clearance, dispensing, charge-in, sign-off or hold points (ENG-SKIP-FORBIDDEN); it raises STEP_SKIPPED"
    - "Exceptions: an ACTION exception blocks until a deviation is linked (ENG-DEVIATION-REQUIRED); it is dispositioned by a person outside the involvement set of its step (ENG-SEGREGATION)"
