id: IN-29
title: Complaints, recalls and genealogy queries
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: outline
requirement_rows:
