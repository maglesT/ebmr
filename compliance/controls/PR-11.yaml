  - "apps/tablets-server/test/blocks/blister/db-guards.test.ts > the blister blocks in the database (tablets 0970 to 0972) > [DI-28][PR-11][PR-37][DI-26] R10 #3: the recipe check missed before RUN_END is still recorded after it, only as a late entry after its own reason, which is stored with an open RUN_ENTRY_LATE for QA naming the reason; a forged engine cannot skip the reason, the exception or the one-entry-per-reason rule; the step then closes"
  - "apps/tablets-server/test/blocks/blister/tb-21-edges.test.ts > TB-21 run > [DI-28][PR-11][PR-37] R10 #3: RUN_END warns while G-06 misses something; after the end each needed G-06 entry follows its own LATE_REASON (non-blank, RUN_ENTRY_LATE for QA); never an alarm or an interface loss; never before the end"
