id: ST-33
title: APS failure consequences
part: C
group: "Theme 4: Aseptic process simulation (media fill): status and failure consequences"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 570
  - 325
  - 326
sources: "EU Annex 1: 9.46 | US: 211.113(b), 211.192 (inferred); FDA-AP IX.A.2, IX.A.9."
behaviour: |-
  (EU profile, default)
  - Target is zero growth, and **any contaminated unit fails the APS**, whatever the run size. On recording a positive, the system automatically:
    1. sets the line to "production suspended";
    2. quarantines every product made on the line after the failed APS until the failure is resolved;
    3. builds the list of all batches since the last successful APS, requires a prompt record review with a per-batch sterility-breach risk assessment, and puts unreleased batches in the investigation scope with release blocked pending the outcome;
    4. flags already-released batches for a documented market-impact decision (FDA-AP);
    5. opens a root-cause investigation with CAPA and species identification;
    6. requires **normally ≥3 consecutive successful repeat APS** before the status returns;
    7. restricts implicated operators (ST-09).
  (US-only line profile) the FDA-AP tiers, where every positive is still investigated:

  | Units filled | 1 contaminated unit | 2 contaminated units |
  |---|---|---|
  | <5,000 | investigation, then revalidation | – |
  | 5,000–10,000 | investigation, including whether to repeat | revalidation after investigation |
  | >10,000 | investigation | revalidation after investigation |

  - Intermittent or recurring positives on a line escalate to "revalidation required" even when each run is within the criteria.
  - Confirmatory runs: one or more after corrections, and three consecutive when the root cause is not conclusively found.
  - Impact on commercial batches made since the last passing media fill is always assessed.
catalog_test: Enter one turbid unit in a 12,000-unit APS on a line with an EU product → failed, line suspended, quarantine and impact list created, 3 repeat runs required. On a US-only line → investigation only.
implemented_by: {}
tests:
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > a failed media fill on an EU master withdraws the filling line (ST-33; tablets 1911) > [ST-33] an EU media fill read with one contaminated unit raises its critical exception and withdraws the qualification of the filling line it used: the line is NOT_QUALIFIED and refused in a step of a product batch until QA has reviewed the withdrawal and recorded it QUALIFIED again, after which it is usable"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > a failed media fill on an EU master withdraws the filling line (ST-33; tablets 1911) > [ST-33] an India-only media fill read with one contaminated unit raises the critical exception (its deviation holds the step) but does not withdraw the line; an EU media fill read with no contaminated unit withdraws nothing"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > a failed media fill on an EU master withdraws the filling line (ST-33; tablets 1911) > [ST-33] the reading is found by its block's role APS_READING and its marked count, not its code: a firm's own approved reading block (SITE-MEDIA-READ) withdraws the line too; the same form without the role and the mark withdraws nothing"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the repeat media fills run on the line withdrawn for them (ST-29, ST-33; tablets 1913) > [ST-29][ST-33] a media fill fills on a line withdrawn after a failed APS (ST-33) or for an APS a change requires (ST-29); a product batch on the same line is still refused"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the repeat media fills run on the line withdrawn for them (ST-29, ST-33; tablets 1913) > [ST-29][ST-33] a media fill is still refused on a line withdrawn for another reason, and on an APS-withdrawn line with a second problem (in maintenance)"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the review of a failed media fill before the line is qualified again (ST-33; tablets 1912) > [ST-33] a withdrawal that is not ST-33's (QA withdraws the qualification by hand) is requalified as before, with no review"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the review of a failed media fill before the line is qualified again (ST-33; tablets 1912) > [ST-33] requalification is refused before QA records the review, by the route and by a direct write; it is accepted after it, and the review stands once"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the review of a failed media fill before the line is qualified again (ST-33; tablets 1912) > [ST-33] the review is refused with fewer than three repeat runs and no justification, with no run, with a run cited twice or the failed batch cited as its own repeat, with a blank risk-assessment reference, and without RECORD.QA_REVIEW; three distinct runs are accepted"
  - "apps/tablets-server/test/injectables/aps-failure.test.ts > the review of a failed media fill before the line is qualified again (ST-33; tablets 1912) > [ST-33] the withdrawal records the impact list: the batches made on the line since its last successful APS (one before it is not listed, one after it is), not the failed media fill itself"
  - "apps/tablets-web/test/office/plant.test.tsx > calibration and press discharge (slice 7h, A7 and A9) > [ST-33] QA sees a line with an open withdrawal after a failed media fill, the batches made on it since its last successful APS, and records the review: the risk-assessment reference and the repeat runs, a justification with fewer than three"
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > aseptic filling events, the media fill and the aseptic set-ups (slice I-2a) > [ST-33] the media-fill reading carries the role APS_READING and marks its count of contaminated units, in whole units, as the one count the database reads (tablets 1912); a block marking a count must have the role, and the role needs exactly one marked whole-number count (LIB-APS-READING)"
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > aseptic filling events, the media fill and the aseptic set-ups (slice I-2a) > [ST-33][IN-45] one contaminated media-fill unit is a critical breach of the acceptance limit: the reading cannot be signed until it is handled, and its deviation holds the record"
