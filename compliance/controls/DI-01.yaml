id: DI-01
title: Record-type, official-record and raw-data register
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 96
  - 616
  - 59
  - 648
  - 227
  - 43
sources: "US: 11.1(b), 11.1(e), 11.2(a), 11.3(b)(4),(6),(9); FDA DI Q&A Q10, Q12; FDA Part 11 Scope and Application guidance (2003) sec. III (s) | EU: Ch.4 Principle (records include raw data; for electronic records the user defines raw data, at minimum all data behind quality decisions), 4.1, 4.10 | ICH/EMA/draft: draft Ch.4 data governance / ALCOA++ (draft)(u)"
behaviour: |-
  - Each tenant keeps a controlled register (versioned, approved by QA e-signature) of every GMP record type the eBMR holds or references: batch/packaging record, logbooks, forms, attachments, device printouts, interface-sourced data. For each type it records:
  - official medium (electronic, paper or hybrid);
  - which item is the original and which are copies;
  - raw / derived / informational class;
  - owner, retained metadata, retention rule ID and review rule;
  - where the record is stored.
  - Raw-data floor: every data item a quality decision relies on is raw data. This covers release, IPC acceptance, yield and reconciliation evaluation, and deviation decisions. The engine derives "decision use" from limits, gates and review rules, and blocks approval of an MBR or register that classes such a field as anything other than raw.
  - For anything executed in the eBMR, the electronic record is the official record. PDFs and printouts are copies and are marked as copies (DI-40). Each hybrid point must be declared with its linkage method (DI-41, DI-43).
  - All eBMR records are treated as Part 11 records. The design does not rely on the 2003 enforcement-discretion policy, because the eBMR replaces paper and users create and modify GMP data in normal operation.
catalog_test: Classify an IPC result that feeds an acceptance limit as "informational" and try to approve the MBR. It is blocked. The register shows the official medium and storage location for each record type.
implemented_by:
  modules:
    - "packages/kernel/src/records/register.ts"
    - "packages/kernel/sql/0400_records_register.sql"
    - "packages/kernel/sql/0720_authorization_signatures.sql"
  guards:
    - "records.assert_classification_valid / records.classification_problems: raw-data floor for validators (MBR approval in Phase 2)"
    - "records.approve_record_type: approver is a person other than the author; only newer versions become current"
    - "records.approve_record_type accepts only the approver's own valid RECORD_TYPE_APPROVED signature of that version (esig.assert_signature on record_type_version <code>:<version>; EBMR-REC-017); the author cannot sign it (INV-03)"
  db_constraints:
    - "records.record_type_raw_data_floor: a type that feeds an acceptance limit is RAW"
    - "records.record_type_hybrid_linkage: a HYBRID type declares its paper/electronic linkage"
    - "records.record_type and records.record_type_approval insert-only and audited; ebmr_app has SELECT only"
tests:
  - "packages/kernel/test/records/register.test.ts > [DI-01] approving an MBR whose IPC result feeding an acceptance limit is classified informational is blocked"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the register class of the record type counts even when the element claims it feeds no limit"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the same MBR with the IPC result classified raw is approved"
  - "packages/kernel/test/records/register.test.ts > [DI-01] an element of an unregistered record type, or weaker than its register class, is refused"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the bulk check lists every problem for a validator"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the register refuses a record type that feeds an acceptance limit but is not raw, through the function and by constraint"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the register shows the official medium and storage location of each approved record type"
  - "packages/kernel/test/records/register.test.ts > [DI-01] a hybrid record type must declare how paper and electronic parts are linked"
  - "packages/kernel/test/records/register.test.ts > [DI-01] a version is in force only after approval by a person other than its author; later versions supersede it"
  - "packages/kernel/test/records/register.test.ts > [DI-01] register rows cannot be written or changed by the application role, and are insert-only for everyone"
  - "packages/kernel/test/records/register.test.ts > [DI-01] every register change is in the audit trail"
  - "packages/kernel/test/records/register.test.ts > [DI-01] the proposed baseline register is accepted by the database and keeps the raw-data floor"
  - "packages/kernel/test/records/register.test.ts > [DI-01][DI-37] a record type is approved only with the approver's own RECORD_TYPE_APPROVED signature of that very version; its author cannot sign it"
clauses:
  - clause: "Classify an IPC result that feeds an acceptance limit as \"informational\" and try to approve the MBR. It is blocked."
    tests:
      - "packages/kernel/test/records/register.test.ts > [DI-01] approving an MBR whose IPC result feeding an acceptance limit is classified informational is blocked"
  - clause: "The register shows the official medium and storage location for each record type."
    tests:
      - "packages/kernel/test/records/register.test.ts > [DI-01] the register shows the official medium and storage location of each approved record type"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: IMPLEMENTED
jurisdiction: EU Ch.4 is explicit on defining raw data. FDA gets to the same place through Q10/Q12 and the completeness wording in 211.188/211.194. There is no conflict, and the EU wording sets the floor.
type_detail: "ENFORCED: the register must exist, and the raw-data floor is checked at MBR/register approval. Register content is CONFIGURABLE per tenant."
