  - "packages/site-services/test/lots/lots.test.ts > witnessed destruction (IN-24 (a)) > [IN-24] DESTROYED only with a destruction record and a witness other than its performer"
  - "packages/site-services/test/lots/machine.test.ts > the material lot machine > [IN-24][INV-13] the committed seed equals the generator output"
