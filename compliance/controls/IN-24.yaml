  - "packages/site-services/test/lots/lots.test.ts > vendor-history release route (IN-24 (c), D-S1-2) > [IN-24] the vendor-history route is only for excipients, needs a stored justification and QA's signature, and its withdrawal blocks India-only use of lots without an identity result"
  - "packages/site-services/test/lots/lots.test.ts > vendor-history release route (IN-24 (c), D-S1-2) > [IN-24] a failing identity result blocks release and use whatever the route or markets"
