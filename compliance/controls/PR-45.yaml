id: PR-45
title: Quarantine and release status model
part: B
group: "G. Material and product status: quarantine, rejected, reprocessed, recovered and returned"
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 138
  - 592
  - 622
  - 28
  - 141
sources: "US: 211.42(c)(1),(7); 211.82(b); 211.110(c); 211.142(a) | EU: Ch.4 4.24; Ch.5 5.5; 5.63; 5.64; 5.65 | ICH/EMA/draft: none"
behaviour: |-
  - Every received lot starts in Quarantine at receipt. Every produced lot (intermediate, bulk, finished) starts in Quarantine when its output is posted.
  - A lot moves to Released only through a release transaction by an authorised QC/QCU role. EU finished product also needs QP certification (PR-55).
  - Interfaces to ERP and WMS cannot allocate or ship quarantined or rejected stock.
  - In-process materials are approved or rejected by the QCU at the significant phases the master defines.
  - Electronic (administrative) quarantine is accepted where the validated system enforces it, and physical labels show the same status.
  - Status changes are e-signed and audit-trailed.
  - Finished-lot status is held per market (PR-56).
catalog_test: Shipping a quarantined lot through the ERP interface is rejected. Using a quarantined intermediate in the next step is blocked.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/batch.ts (holdBatch, releaseHold)"
    - "packages/recipe-core/src/engine/steps.ts (dispositionHoldPoint)"
    - "packages/recipe-core/src/blocks/generic/engine-level.ts (G-17)"
  guards:
    - "Batch on hold: nothing starts, completes or advances (ENG-BATCH-ON-HOLD); only QA lifts a QA hold"
    - "G-17: steps after a QA hold point wait for its disposition; approval is refused while earlier exceptions lack a QA decision (ENG-HOLD-OPEN-EXCEPTIONS); \"not approved\" rejects the intermediate and holds the batch"
tests:
  - "packages/recipe-core/test/engine/flow.test.ts > sequencing (DI-34) > [DI-34][PR-45] while the batch is on hold no step starts, completes or advances; data can still be recorded; only QA lifts a QA hold"
  - "packages/recipe-core/test/engine/stage.test.ts > G-17 QA hold point > [PR-45][IN-37] everything after a hold point waits for the QA disposition; only the hold point role signs it"
  - "packages/recipe-core/test/engine/stage.test.ts > G-17 QA hold point > [PR-45] approval is impossible while an exception before it has no QA decision"
  - "packages/recipe-core/test/engine/stage.test.ts > G-17 QA hold point > [PR-45] \"not approved\" rejects the intermediate: the steps after it never run and the batch goes on a QA hold that only QA lifts"
  - "packages/recipe-core/test/execution/step-acts-sql.test.ts > F67: minimum durations and blocks at the database agree with the engine (INV-20, PR-08, PR-45) > [PR-08][PR-13][PR-45][IN-37] a step the engine refuses as blocked is reported by the database on the same state, and accepted once the block is lifted; a hold point is not released while an exception that is not an alert is open"
