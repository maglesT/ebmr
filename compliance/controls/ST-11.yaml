scope: "all (Grade A/B rules: aseptic)"
type_detail: ENFORCED (sterile-pack checks, breach handling). Maximum wear time and glove-disinfection interval are CONFIGURABLE (default = the value from garment qualification; no shipped numeric default because Annex 1 sets none).
