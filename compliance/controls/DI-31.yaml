id: DI-31
title: Interface data integrity
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 6
target_phase_source: outline
requirement_rows:
  - 155
