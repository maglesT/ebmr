  - clause: "Cut the link mid-transfer. No partial value lands in the record."
    tests:
      - "apps/tablets-server/test/integrations/erp-wms/contract.test.ts > the ERP/WMS adapter against its simulators (DI-31) > [DI-31] a link cut mid-transfer, a late answer and a feed gap leave no partial value; the message is delivered once when the link is back"
      - "packages/kernel/test/inbound/inbound.test.ts > platform.accept_inbound (DI-31) > [DI-31] a message is committed whole or not at all: when the receiving command fails, no message and no alarm remain"
      - "apps/site-gateway/test/journal-write-failure.test.ts > gateway journal on a failing disk (review P52) > [DI-28][DI-31] a failed append leaves no partial bytes, is alarmed and stops the journal until a restart re-verifies it"
