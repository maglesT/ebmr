clauses:
  - clause: "Inject malformed, duplicate, out-of-order and wrong-batch messages. Each is rejected or de-duplicated, with an alarm."
    tests:
      - "apps/tablets-server/test/integrations/erp-wms/contract.test.ts > the ERP/WMS adapter against its simulators (DI-31) > [DI-31] a malformed, a duplicate, an out-of-order and a wrong-batch ERP message are each refused or de-duplicated with an alarm"
      - "packages/site-services/test/erp-wms/inbound.test.ts > faults at the receiving command (DI-31) > [DI-31] a malformed, a duplicate, an out-of-order and a wrong-batch ERP message are each refused or de-duplicated with an alarm"
      - "packages/site-services/test/integrations/capa-qms.test.ts > the QMS mirror (DI-31; D-P6a-5, D-P6a-6) > [DI-31] a malformed, a duplicate, an out-of-order and a wrong-batch QMS deviation status are each refused or de-duplicated with an alarm"
      - "packages/kernel/test/inbound/inbound.test.ts > platform.accept_inbound (DI-31) > [DI-31] a malformed envelope, a wrong source system and an unknown message type or version are refused and leave nothing"
      - "packages/kernel/test/inbound/inbound.test.ts > platform.accept_inbound (DI-31) > [DI-31] a resent message is de-duplicated by its idempotency key; the same key with other content is refused"
      - "packages/kernel/test/inbound/inbound.test.ts > platform.accept_inbound (DI-31) > [DI-31] a sequence gap and a late message are accepted with an integration alarm; a sequence number already taken is refused"
      - "packages/kernel/test/inbound/inbound.test.ts > platform.accept_inbound (DI-31) > [DI-31] a refusal is recorded with its alarm in its own command; a person acknowledges the alarm once, with a note"
