id: DI-35
title: "Electronic-signature catalogue: every predicate-rule signature point"
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 614
  - 145
  - 36
  - 68
  - 113
  - 182
sources: 'US: 11.1(c)-(d), 11.2(a), 11.3(b)(7)-(8); 211.101(c)-(d), 211.103, 211.182, 211.186(a), 211.188(a),(b)(11), 211.194(a)(7)-(8); FDA DI Q&A Q11 (e-signature satisfies "full signature, handwritten"; document signer-identification controls) | EU: Ch.4 4.3, 4.9, 4.13, 4.20(c),(f),(h),(i), 4.21(c),(g),(i), 4.31; Annex 11 §14 | ICH/EMA/draft: draft Ch.4 signatures and signature policy (draft)(s); draft Ch.4 hybrid systems and recognition of e-signatures (draft)(s)'
behaviour: |-
  - A vendor-defined catalogue of signature types covers every point where a rule asks for a signature, initials, a check or an approval:
  - MPCR/MBR prepared, independently checked, QU-approved;
  - batch record issued (accurate reproduction checked);
  - step performed; step checked or directly supervised;
  - component container checked at dispensing; charge-in verified;
  - yield verified;
  - IPC performed and verified;
  - deviation authorised; correction;
  - labeling specimen approved;
  - logbook entry performed and double-checked;
  - production and packaging record approved;
  - audit trail reviewed;
  - QU review and disposition;
  - QP certification (if used);
  - true copy verified;
  - void or reprint authorised.
  - Each type defines:
  - the permitted roles and the meaning text;
  - the independence rule (which earlier signers on the same object it must differ from);
  - the re-authentication rule (DI-38).
  - Every type is a full Part 11 / Annex 11 e-signature, never a click-acknowledgment.
  - A handwritten (stylus) signature on an electronic record, if offered, is still a handwritten signature: it must show the 11.50 elements and be linked under 11.70.
  - The company signature policy (who may sign which meaning) is configured in the system.
  - E-signing is the default everywhere. There is no print-to-sign path.
  - Customers may add signature points but cannot remove the minimum set.
catalog_test: An inventory maps every predicate signature point to a catalogue type. Try to complete a cleaning-log entry with a plain acknowledgment. Impossible.
implemented_by:
  modules:
    - "packages/kernel/sql/0210_esig_catalogue.sql (esig.meaning_type catalogue, esig.predicate_signature_point inventory, quality-unit configuration)"
    - "packages/kernel/sql/0230_esig_sign.sql (esig.create_challenge, esig.sign, esig.check_independence, esig.check_witness)"
    - "packages/kernel/sql/0250_esig_stub.sql (stub signable entries; esig.stub_complete: completion only by a signature)"
    - "packages/kernel/src/esig/catalogue.ts"
    - "packages/kernel/src/esig/signing.ts"
    - "packages/recipe-core/src/engine/guards.ts (signature meanings per engine signature point)"
    - "apps/tablets-server/src/features/esig/index.ts (content, challenge, sign: authenticate, dry-run, esig.sign and seal, apply in one command; failures logged after rollback)"
    - "apps/tablets-server/src/features/esig/badges.ts"
    - "apps/tablets-server/src/features/esig/views.ts (manifestation from the stored copy)"
    - "apps/tablets-web/src/features/access/ceremony.tsx (SignatureCeremonyPort)"
    - "packages/ui-kit/src/machines/ceremony.ts"
    - "packages/ui-kit/src/identity/SignatureDialog.tsx"
    - "packages/ui-kit/src/identity/SignableContent.tsx"
    - "packages/ui-kit/src/identity/Manifestation.tsx"
  invariants:
    - "INV-03"
  guards:
    - "esig.current_meaning: only active catalogue types can be challenged or signed (EBMR-ESIG-026); no acknowledgement-only type exists"
    - "esig.sign: authority for one of the type's permissions evaluated and stored at the instant of signing (iam.evaluate_authority, INV-26); delegation validity (EBMR-ESIG-041); independence rules evaluated on the person (EBMR-ESIG-042 to 045); WITNESSED rules: same terminal or a terminal of the same room, within the witness window, before the next step (EBMR-ESIG-050 to 053)"
    - "esig.stub_complete: a signature point is completed only by a valid signature of the required meaning, never by an acknowledgement (EBMR-ESIG-092, 093)"
    - "esig.add_meaning_type, esig.configure_meaning_type, esig.retire_meaning_type: quality unit only (MBR.APPROVE), never an administrator"
    - "Every engine signature point requires its kernel meaning (PERFORMED, VERIFIED, WITNESSED, CORRECTED, HOLD_POINT_RELEASED, ...); a signature by someone else, with another meaning or used twice is refused (ENG-SIGNATURE, ENG-SIGNATURE-MEANING, ENG-SIGNATURE-REUSED)"
    - "A step whose check is a witness (the MBR's WITNESSED, or a critical value typed by hand without the photo or printout its MBR names) asks for WITNESSED only while a witness is possible; once the engine's witness window after the act has passed or the run moved on, its later review is the check and raises WITNESS_LATE, which only QA dispositions, and a late WITNESSED is refused (engine 1.5.0; recipe-core 0333 recipe.step_check_meanings, recipe.late_check_record, trigger zzf_execution_late_check, EBMR-EXE-141; default T12.2)"
  db_constraints:
    - "esig.meaning_type: insert-only and audited; checks: re-authentication is ALL_COMPONENTS or SESSION_RELAXABLE (no acknowledgement-only type), master-record and release types always ALL_COMPONENTS, VERIFIER and WITNESS types exclude performers (INV-03), release types exclude the involvement set"
    - "esig.meaning_type_guard: the minimum (vendor) set comes only from migrations and is never removed, disabled or loosened (EBMR-ESIG-020 to 024)"
    - "esig.predicate_signature_point: inventory mapping every predicate-rule signature point to a minimum type (protected)"
  policies:
    - "esig.witness_window_seconds"
