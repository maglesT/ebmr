id: IN-34
title: Weight-variation limits by pharmacopoeia
part: D
group: Tablets edition
editions:
  - tablets
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 3
target_phase_source: outline
requirement_rows:
  - 669
sources: Schedule M Part VIII 3.3-3.4, 3.8 (weight variation against pharmacopoeial parameters); Indian Pharmacopoeia uniformity-of-weight test (not seen).
behaviour: "Individual-weight IPC limits are computed from the target tablet weight using a pharmacopoeia band table stored as versioned data. IP/BP/Ph. Eur. uniformity-of-mass bands as reported by secondary sources (to be confirmed against IP 2026): 80 mg or less 10%; more than 80 mg and less than 250 mg 7.5%; 250 mg or more 5%. Legacy USP in-process bands often used by US-market firms: 130 mg or less 10%; 130-324 mg 7.5%; more than 324 mg 5%. The MBR shows which table applies; for a product sold in India and the US the tighter band applies (IP is equal or tighter at every weight: e.g., 100 mg is 7.5% vs 10%; 300 mg is 5% vs 7.5%). Release testing of uniformity of dosage units (USP chapter 905 / Ph. Eur. 2.9.40 acceptance value) is a separate calculation."
catalog_test: "300 mg tablet: India or India+US gives plus/minus 5%; US-only legacy table gives 7.5%."
implemented_by: {}
tests:
  - "packages/kernel/test/review/f20.test.ts > F20: ALL_APPLY strictness must compare criterion content, not only ids > [IN-52][INV-28][IN-34][ST-01] a HARD India criterion cannot be weakened under the same id, by a site value or by an UPDATE"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > golden fixtures of the IPC blocks > [DI-34][IN-34][PR-29][DI-10] TB-12 Tablet weight IPC: Uniformity of weight of 20 uncoated tablets for an India batch: average 250.0 mg puts the IP band at 5 %; two tablets just outside it (262.6 and 237.4 mg) and none outside 10 % pass; the IP rule set and its version recorded"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > compendial rule sets (D-S3-2) > [IN-34][DI-10] every rule set is data with its source, confidence and effective date; codes hold no digit (a test run records them); the resolution binds IP for every batch and the other markets' rule sets beside it"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > compendial rule sets (D-S3-2) > [IN-34] catalogue test: a 300 mg tablet gets plus or minus 5 % for India and for India with the US; the legacy in-house table alone would give 7.5 %; bands are chosen from the average with exact boundaries"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > rule-set coverage and agreement (review 3c finding 5) > [IN-34][DI-10] every batch market needs a rule set for the test and tablet type or a recorded not-applicable decision (fail closed); bound rule sets must give one procedure"
  - "apps/tablets-server/test/blocks/ipc/blocks.test.ts > TB-12 weight > [IN-34][PR-29] uniformity is refused where no rule set covers the tablet type (sugar-coated, India only) when the MBR is defined and when a check is recorded; the in-house individual limit is never looser than the band at the target"
