id: IN-34
title: Weight-variation limits by pharmacopoeia
part: D
group: Tablets edition
editions:
  - tablets
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 3
target_phase_source: outline
requirement_rows:
