  - "apps/tablets-server/test/blocks/ipc/tb-12-edges.test.ts > TB-12 the second stage of a weight variation > [IN-34][INV-41] every bound rule set must pass, at either stage: one market's stricter set failing is enough (mutation follow-up; USP made stricter for the test)"
