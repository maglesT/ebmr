  - "apps/tablets-server/test/blocks/ipc/db-guards.test.ts > the IPC blocks in the database (tablets 0890 to 0893) > [DI-30][DI-10][IN-34] the database holds the data schemas of TB-11 to TB-15 as the registry declares them, their rule codes, the compendial rule sets with source, confidence and effective dates exactly as rule-sets.ts, and the compression ceiling; nothing can change them"
  - "apps/tablets-server/test/blocks/ipc/db-guards.test.ts > the IPC blocks in the database (tablets 0890 to 0893) > [IN-34][PR-29][DI-10][DI-29] TB-12 uniformity of weight: the honest evaluation against the IP rule set is stored; a forged evaluation, a forged result without its exception, a check on an instrument without a use, a hand-keyed check without its second person are refused by the database alone"
  - "apps/tablets-server/test/blocks/ipc/db-guards.test.ts > the IPC blocks in the database (tablets 0890 to 0893) > [INV-41][IN-34][PR-29] TB-12 weight variation: a first stage that fails its acceptance value waits for its second stage; a new first stage forged past the engine is refused; the second stage is evaluated by the database on every unit of both stages; the step closes only after it"
  - "apps/tablets-server/test/blocks/ipc/db-guards.test.ts > the IPC blocks in the database (tablets 0890 to 0893) > [IN-34][DI-10][INV-41] review 3c finding 5: a batch market without a rule set or a recorded not-applicable decision fails closed; rule sets that give different procedures are refused; a repeat run keeps the rule sets its first run recorded"
