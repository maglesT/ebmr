expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: IMPLEMENTED
jurisdiction: 11.10(h) is the only explicit device-check rule. The EU reaches a similar result through §5 built-in checks.
type_detail: CONFIGURABLE for device-to-location binding per step. The rule applies it "as appropriate". Default ON for weighing, dispensing and critical-parameter capture; it can be turned OFF only for non-critical steps, with a rationale. The device registry and the source-ID stamp are ENFORCED.
