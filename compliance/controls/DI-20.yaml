id: DI-20
title: Device and data-source checks
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 51
  - 7
sources: "US: 11.10(h); 211.68(a) | EU: Annex 11 §5 | ICH/EMA/draft: none"
behaviour: |-
  - Every device has a registered identity and an assigned room or line: terminals, tablets, balances, scanners, instruments, PLC/SCADA connectors, printers.
  - Every value stores the ID of the device it came from.
  - For steps where the MBR declares device binding, data is accepted only from a registered device assigned to that step's location. Recipe downloads go only to the registered equipment for the step.
  - A measuring device can be used only if it is within calibration and has passed any required pre-use check. The calibration details are in the production catalog.
catalog_test: Data arriving from an unregistered or relocated scale is rejected with an alert. A stored weight shows its source balance ID.
implemented_by:
  modules:
    - "packages/kernel/src/identity/sessions.ts"
    - "packages/kernel/sql/0140_iam_devices.sql"
    - "packages/kernel/sql/0160_iam_authentication_sessions.sql"
    - "packages/kernel/sql/0190_iam_actor_context.sql"
    - "apps/tablets-server/src/platform/auth/attribution.ts (per-entry attribution: proof over the exact request, BADGE_TAP or TAP_PIN, same person or 409 SWITCH_USER, tap rate limit)"
    - "apps/tablets-server/src/features/access/index.ts (lock, unlock by the same person on the same terminal, keep-alive with a tap, switch user by badge and PIN)"
    - "apps/tablets-server/sql/0100_tab_attribution.sql (attribution method per shop-floor class, audited history)"
    - "apps/tablets-web/src/features/access/controller.tsx (BadgeTapPort, switch offers, lock overlay, session poll)"
    - "packages/ui-kit/src/machines/kiosk-lock.ts"
    - "packages/ui-kit/src/identity/LockOverlay.tsx"
    - "packages/ui-kit/src/identity/BadgePrompt.tsx"
  guards:
    - "iam.resolve_device: identity from the enrolled key or certificate fingerprint; unknown, blocked or decommissioned devices refused with an alert"
    - "iam.check_device_location: data accepted only from a device registered to that room or line; a mismatch is refused with an alert"
    - "sessions are bound to the device of their LOGIN event; kernel.validate_actor_context requires the context to name the session device (EBMR-IAM-116)"
  db_constraints:
    - "GRADE_A_B devices have a room and INSTRUMENT devices a room or line; code, class, site and enrolled key never change"
