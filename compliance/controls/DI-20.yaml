clauses:
  - clause: "Data arriving from an unregistered or relocated scale is rejected with an alert."
    tests:
      - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-20] data arriving from an unregistered device is rejected with an alert"
      - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-20] data from a relocated balance is rejected with an alert until the registry is updated"
      - "apps/tablets-server/test/devices/ingest.test.ts > ingestion > [DI-20] a reading from an instrument not bound to this gateway is refused"
      - "apps/tablets-server/test/devices/ingest.test.ts > ingestion > [DI-20] a reading with a serial that is not the registered one is refused"
      - "apps/tablets-server/test/devices/claim.test.ts > DeviceReadingPort.claim > [DI-20] a reading from a scale in another room is refused, with an alert that survives the refused command"
      - "apps/tablets-server/test/devices/routes.test.ts > scale status > [DI-20] a heartbeat with another serial shows the scale OFFLINE and raises an alert once"
  - clause: "A stored weight shows its source balance ID."
    tests:
      - "packages/kernel/test/identity/devices-sessions.test.ts > [DI-20] a stored weight carries the registry ID of its source balance, resolved by the server from the balance key"
      - "tools/e2e/specs/devices/devices.spec.ts > devices > [DI-32][DI-20] the kiosk of the scale's room shows the live weight \"live, not recorded\"; a captured weight shows its device and raw line"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: IMPLEMENTED
jurisdiction: 11.10(h) is the only explicit device-check rule. The EU reaches a similar result through §5 built-in checks.
type_detail: CONFIGURABLE for device-to-location binding per step. The rule applies it "as appropriate". Default ON for weighing, dispensing and critical-parameter capture; it can be turned OFF only for non-critical steps, with a rationale. The device registry and the source-ID stamp are ENFORCED.
