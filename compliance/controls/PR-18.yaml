    - "packages/recipe-core/src/blocks/generic/material.ts (G-07)"
    - "packages/site-services/sql/0752_lot_retest.sql"
    - "apps/tablets-server/sql/1000_lot_retest_reads.sql"
  guards:
    - "G-07: a quarantined, expired or past-retest lot and the wrong material are refused with no override (G07-LOT-STATUS, G07-LOT-EXPIRED, G07-LOT-RETEST, G07-WRONG-MATERIAL)"
