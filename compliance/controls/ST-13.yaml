id: ST-13
title: Aseptic behaviour observation, QA oversight and in-cleanroom device rules
part: C
group: "Theme 1: Personnel qualification and gowning gate"
editions:
  - injectables
type:
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 470
  - 293
  - 455
  - 451
sources: "EU Annex 1: 7.9, 7.18, 8.19 | US: 211.22(a), 211.25(b); FDA-AP V.A."
behaviour: |-
  - Batch-linked observation record: observer (must hold the aseptic-expert, supervisor or QA role), time window, operator observed, checklist result, findings and coaching. A finding can raise a deviation, and it feeds ST-09.
  - Line readiness shows when the next observation is due. Batch review shows whether QA oversight took place.
  - Device rules: only registered, grade-rated tablets and scanners may open sessions in classified areas, with a disinfection record at transfer-in. Station layout keeps data entry out of first-air paths. Entry after the activity is allowed where the MBR permits it.
catalog_test: A user without the expert role creates an observation → refused. Log in from an unregistered tablet in Grade B → refused.
implemented_by: {}
tests:
  - "packages/kernel/test/identity/devices-sessions.test.ts > device registry (DI-20) > [ST-13] a login from a tablet that is not in the device registry is refused; a registered Grade A/B terminal is accepted only in its own room"
clauses:
  - clause: "A user without the expert role creates an observation → refused."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Observation record, next-observation due"
  - clause: "Log in from an unregistered tablet in Grade B → refused."
    tests:
      - "packages/kernel/test/identity/devices-sessions.test.ts > device registry (DI-20) > [ST-13] a login from a tablet that is not in the device registry is refused; a registered Grade A/B terminal is accepted only in its own room"
expert_decision:
