id: PR-03
title: MBR content completeness gate
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 90
  - 89
  - 91
  - 99
  - 37
sources: "US: 211.186(b)(1)-(9); 211.100(a); 211.101(a); 211.110(a)-(b); 211.111; 211.125(c) | EU: Ch.4 4.6; 4.17(a)-(d); 4.18(a)-(g); 4.19(a)-(i) | ICH/EMA/draft: none"
behaviour: |-
  The MBR designer refuses submission for approval unless every item in Section (a)-1 (processing) or (a)-2 (packaging) is present, for the markets in the product's market set. Specifically:
  - every data-entry point has a typed field (unit, precision, range or list);
  - every CPP and IPC has limits;
  - every yield checkpoint has a theoretical basis and min/max limits;
  - every printed component has a specimen (see D-1).
  An item may be marked "not applicable" only if the rule itself makes it conditional ("where applicable", "where appropriate", "where necessary"), and only with a signed justification.
catalog_test: Starting from a complete test master, delete one mandatory item at a time. Approval is refused each time, and the refusal names the missing item.
implemented_by:
  modules:
    - "packages/recipe-core/src/flow/model.ts"
    - "packages/recipe-core/src/validator (rules-content, rules-data, rules-market)"
    - "apps/tablets-server/src/features/designer (validation with the real reference and market adapters plus the execution-definition check, findings located in document sections 0-11; start of verification and test packages only when the checks pass)"
    - "apps/tablets-server/src/features/designer/templates/dc-mini.mbr.json (complete test master: passes every gate against the real adapters)"
    - "apps/tablets-web/src/features/designer (document view, findings panel with jump-to-location and justification)"
  invariants:
    - "INV-34"
  guards:
    - "GMP-TYPED-FIELDS, GMP-CRITICAL-PARAMETERS, GMP-YIELDS, GMP-INTERMEDIATES, GMP-TIMERS, GMP-SPECIMENS, GMP-STAGE-CLEARANCE, GMP-STAGE-YIELD, GMP-STAGE-NON-MATERIAL, GMP-EQUIPMENT-STATUS, GMP-BOM-CONSUMED, GMP-SIGNIFICANT-STEPS, GMP-WITNESS, GMP-REFERENCES, GMP-REPROCESSING, GMP-ACCEPTANCE-SCHEMES, DATA-REFERENCES"
    - "MKT-MINIMA: content minima resolved for the market set through the MarketMinimaPort (kernel market engine); fails closed"
    - "gate(): errors block submission; warnings need a recorded justification"
