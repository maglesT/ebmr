sources: "US: 211.186(b)(1)-(9); 211.100(a); 211.101(a); 211.110(a)-(b); 211.111; 211.125(c) | EU: Ch.4 4.6; 4.17(a)-(d); 4.18(a)-(g); 4.19(a)-(i) | ICH/EMA/draft: none"
behaviour: |-
  The MBR designer refuses submission for approval unless every item in Section (a)-1 (processing) or (a)-2 (packaging) is present, for the markets in the product's market set. Specifically:
  - every data-entry point has a typed field (unit, precision, range or list);
  - every CPP and IPC has limits;
  - every yield checkpoint has a theoretical basis and min/max limits;
  - every printed component has a specimen (see D-1).
  An item may be marked "not applicable" only if the rule itself makes it conditional ("where applicable", "where appropriate", "where necessary"), and only with a signed justification.
catalog_test: Starting from a complete test master, delete one mandatory item at a time. Approval is refused each time, and the refusal names the missing item.
