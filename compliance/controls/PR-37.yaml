clauses:
  - clause: "Skipping the end-of-run examination prevents order completion."
    tests:
      - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-24 secondary packaging (examination, samples, unusual events, shippers, reconciliation) > [PR-37] finished packs are examined during finishing and a representative sample at completion, each of the MBR's size at least; a failing examination raises LINE_CHECK_FAILED, a late in-run one LINE_CHECK_MISSED; nothing is examined after the end-of-run sample"
      - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [PR-37][IN-17][PR-42] TB-24: the examinations and the reconciliation are the database's (a forged verdict or balance is refused); the step closes only with an in-run and a passing end-of-run examination, the reconciliation, and shippers that hold exactly the serials the G-21 step commissioned"
  - clause: "Adding samples back to good output is impossible."
    tests:
      - "apps/tablets-server/test/blocks/bottle/blocks.test.ts > TB-24 secondary packaging (examination, samples, unusual events, shippers, reconciliation) > [PR-37][IN-22] samples never return to good output; units of an unusual event are set aside under its event with UNUSUAL_EVENT (QA decides before the step completes) and re-enter only after a passing special inspection, with the investigation, checked by a second person, never more than were set aside"
      - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [PR-37][IN-22] samples never return to good output, and packs of an unusual event re-enter only after the event's exception carries the investigation and QA's disposition: before that, or naming another deviation, the database refuses the re-entry"
  - clause: "Reintroducing 40 jammed units without approval is blocked."
    tests:
      - "apps/tablets-server/test/blocks/bottle/db-guards.test.ts > the packaging-line blocks in the database (tablets 0985 to 0987) > [PR-37][IN-22] samples never return to good output, and packs of an unusual event re-enter only after the event's exception carries the investigation and QA's disposition: before that, or naming another deviation, the database refuses the re-entry"
