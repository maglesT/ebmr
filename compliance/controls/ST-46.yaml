id: ST-46
title: Material transfer into Grade A/B and into the critical zone
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
