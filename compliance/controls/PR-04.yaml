  - "packages/recipe-core/test/lifecycle/approval.test.ts > [PR-04][PR-02] approval requires the regulatory-conformity sign-off for the markets of the version"
  - "packages/recipe-core/test/lifecycle/change-control.test.ts > [PR-04] widening a registered range with no variation reference is blocked; with the reference per market it is approved"
  - "packages/recipe-core/test/lifecycle/change-control.test.ts > [PR-04] narrowing a registered range needs a regulatory assessment for every market, not a variation reference"
  - "packages/recipe-core/test/lifecycle/change-control.test.ts > [PR-04] the database and the TypeScript mirror find the same registered changes (fast-check)"
  - "packages/recipe-core/test/lifecycle/issue.test.ts > [PR-04] creating a batch for a market not linked to the master is refused, naming each market"
  - "packages/recipe-core/test/lifecycle/market.test.ts > [INV-17][PR-04] an approved version becomes CURRENT for a market and scope only with the QA and regulatory signatures of two persons"
  - "packages/recipe-core/test/lifecycle/market.test.ts > [PR-04] a master is authorised only for markets it is linked to, and only once approved"
