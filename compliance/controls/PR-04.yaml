id: PR-04
title: Registration (MA / application) conformity and market validity of masters
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 629
  - 187
  - 218
  - 219
sources: "US: 211.100(a); 211.186(b)(9) | EU: Ch.5 Principle; Ch.4 4.2 | ICH/EMA/draft: Annex 16 section 1 (s); ICH Q12 ch.3-5 (ECs, PACMP, PLCM) (s); EU Variations Guidelines applying from 15 Jan 2026 (s)"
behaviour: |-
  - Each master version holds the registration references for each target market (EU MA number and variation; US application number and supplement).
  - Any master element can be flagged as registered or as an Established Condition (EC), with its market and reporting category.
  - Approval requires a regulatory-conformity sign-off.
  - A version becomes effective for a market only when all required approvals or notifications for that market are recorded.
  - A batch can be created only from a version valid for every market in its market set.
  - The batch record shows the master version and the registration references used.
  - A change linked to a PACMP stays open until the protocol's acceptance criteria are met on the eBMR batches it names.
catalog_test: Widening a registered CPP range with no variation reference is blocked. Creating a batch for a market not linked to the master is refused.
implemented_by:
  modules:
    - "packages/recipe-core/sql/0130_mbr_guards.sql (recipe.registered_ranges, recipe.registered_changes, guard registered_ranges_kept)"
    - "packages/recipe-core/sql/0110_mbr_family_version.sql (change_record_regulatory: reporting category and variation reference per market)"
    - "packages/recipe-core/sql/0160_market_authorisation.sql (authorisation per market with regulatory basis, QA and regulatory signatures)"
    - "packages/recipe-core/sql/0170_batch_issue.sql (recipe.select_version_for_issue)"
    - "packages/recipe-core/src/lifecycle/change.ts (registeredChanges mirror), packages/recipe-core/src/lifecycle/selection.ts"
  invariants:
    - "INV-01"
  guards:
    - "mbr_version.regulatory_confirmed (CHECKED -> APPROVED): approval requires a valid regulatory-conformity sign-off (REGULATORY_CONFIRMED, permission MBR.REGULATORY_CONFIRM) of the version for the markets of its content"
    - "mbr_version.registered_ranges_kept (CHECKED -> APPROVED): a changed registered element (REGISTERED-tier range or REGISTRATION reference) needs a regulatory assessment for every market of the version; a widened registered range also the variation, supplement or approval reference"
    - "recipe.propose_market_authorisation refuses a market the master content does not list (EBMR-RCP-081)"
    - "recipe.select_version_for_issue refuses a market set with a market no version is CURRENT or BRIDGING for, naming each market (the master is not linked to it)"
  db_constraints:
    - "market_authorisation.regulatory_basis is required; cells exist only for records signed MBR_MARKET_AUTHORISED (QA) and REGULATORY_CONFIRMED (regulatory)"
    - "batch_mbr_pin trigger recomputes the selection at the issue instant"
