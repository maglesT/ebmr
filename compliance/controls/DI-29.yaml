id: DI-29
title: "Complete data: every attempt, repeat, aborted operation and invalidated result is retained; invalidation needs an investigation"
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 69
  - 651
  - 652
  - 41
