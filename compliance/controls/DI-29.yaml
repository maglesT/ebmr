    - "packages/recipe-core/src/engine/corrections.ts (void, invalidation)"
    - "packages/recipe-core/src/blocks/generic/recording.ts (G-13)"
  guards:
    - "Every attempt and reading is stored and never replaced; repeats are flagged REPEAT or REPEAT_AFTER_FAIL; the first valid attempt governs until invalidated"
    - "INVALIDATE_RESULT (path c) needs an investigation reference and QA approval (ENG-INVALIDATE-INVESTIGATION); the original stays"
    - "A readings set must hold the planned number of readings (ENG-VALUE-READINGS)"
  invariants:
    - "INV-41"
