    - "INVALIDATE_RESULT (path c) needs an investigation reference and QA approval (ENG-INVALIDATE-INVESTIGATION); the original stays"
    - "A readings set must hold the planned number of readings (ENG-VALUE-READINGS)"
  invariants:
    - "INV-41"
