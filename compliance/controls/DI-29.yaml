  - "packages/recipe-core/test/blocks/process.test.ts > G-05 observation capture and G-13 IPC > [IN-35][DI-29] a readings set with fewer values than the plan is refused (every reading is kept individually)"
  - "packages/recipe-core/test/engine/corrections.test.ts > path (a): entry-error correction (DI-24) > [DI-24][DI-29] a device-captured value can never be corrected, only invalidated"
  - "packages/recipe-core/test/engine/corrections.test.ts > path (a): entry-error correction (DI-24) > [INV-41][DI-29] a failing value corrected to a passing one needs objective evidence and QA approval"
  - "packages/recipe-core/test/engine/corrections.test.ts > paths (b) void and (c) invalidation; repeats (DI-29, INV-41) > [DI-29][INV-41] three readings where the first two fail: all kept and flagged; the first failing result governs until it is invalidated"
  - "packages/recipe-core/test/engine/corrections.test.ts > paths (b) void and (c) invalidation; repeats (DI-29, INV-41) > [DI-29][IN-20] invalidating a result needs an investigation and QA approval; the original stays, the next attempt governs"
  - "packages/recipe-core/test/engine/corrections.test.ts > paths (b) void and (c) invalidation; repeats (DI-29, INV-41) > [DI-29][DI-24] an attempt is voided only before a result exists, with a reason and QA approval; the attempt stays in the record"
