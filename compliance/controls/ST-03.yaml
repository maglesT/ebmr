id: ST-03
title: Change control drives requalification/revalidation blocks
part: C
group: "Theme 0: Cross-cutting rules (apply to every theme)"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 396
  - 318
sources: "EU Annex 1: 2.6, 4.32 (requalification after changes) | US: 211.100(a); FDA-AP IX (intro)."
behaviour: |-
  - Every change to an MBR, recipe, limit, line, room, steriliser or filter type needs a CCS-impact assessment before approval, and a post-implementation effectiveness check before closure. Neither can be skipped.
  - A change control that sets "requalification/revalidation required" on an asset makes that asset unusable in batch execution until the change is closed or QA records an interim decision. The pre-start check cites the change-control ID.
  - Changes tagged "affects aseptic process" feed the APS status engine (ST-29).
catalog_test: Open a change control on filling line 2 with "requalification required" → batch start on line 2 is blocked. Close it → start allowed, citing the change-control ID.
implemented_by: {}
tests:
  - "packages/recipe-core/test/plant/equipment.test.ts > fitness: qualification, calibration, maintenance, failure (IN-25 (b)(d), PR-23) > [ST-03] a filling line past its requalification due date is blocked; once the due date is reset after the change, a batch may use it"
clauses:
  - clause: "Open a change control on filling line 2 with \"requalification required\" → batch start on line 2 is blocked."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "CCS-impact assessment workflow; asset blocked by an open change"
  - clause: "Close it → start allowed, citing the change-control ID."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "CCS-impact assessment workflow; asset blocked by an open change"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "QA resets the due date after a change; no change-control engine"
build_status: SPECIFIED
jurisdiction: Aligned. EU adds the CCS-impact element.
scope: all
