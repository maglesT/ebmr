  comment: "Room requalification due date (4.1); DP excursions as events; 10 Pa as a formulation value (8a)"
build_status: SPECIFIED
jurisdiction: |-
  - DP: EU gives a minimum 10 Pa *guidance value*. FDA-AP gives at least 10–15 Pa between classes and at least 12.5 Pa toward an unclassified room at all times, so the 12.5 Pa rule comes from FDA.
  - Velocity: the numeric ranges are equivalent.
  - HEPA testing: FDA states twice a year; EU covers it through A/B requalification at ≤6 months. Equivalent.
scope: "all (continuous Grade B DP: aseptic)"
type_detail: "ENFORCED (continuous linkage and assessment). Set points are CONFIGURABLE: floor ≥10 Pa between different grades, and ≥12.5 Pa for an aseptic room next to an unclassified room. A lower value between graded rooms needs a CCS justification (EU guidance value)."
