  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 165
  - 647
  - 177
sources: "US: 11.10(c); 211.68(b), 211.180(d); FDA DI Q&A Q1e, Q9 | EU: Annex 11 §17 | ICH/EMA/draft: draft Annex 11 §17 archiving (draft)(s)"
behaviour: |-
  - Completed batch records are archived to read-only storage with the full audit trail, signatures, attachments and metadata. "Completed" includes released, rejected and never-released batches.
  - Fixity is checked periodically.
  - Retrieval and re-rendering are tested before and after any relevant system change (hardware, software upgrade, format change). Upgrade validation includes retrieving archived records created under earlier versions.
  - For dynamic data, a validated viewer is kept for the full retention period, or the data is migrated (DI-48) to a format that preserves content and meaning.
  - Retiring the system requires a documented migration plan or a read-only retention plan.
catalog_test: Archive a batch and run a fixity check. Upgrade the test environment, then retrieve and render the record. Content, audit trail and signatures are intact and the hashes match.
implemented_by: {}
tests:
  - "packages/kernel/test/records/batch-retention.test.ts > batch retention keys (D-6-5) > [DI-47][DI-46] an aborted batch is kept like a completed one, and the record a kept batch depends on inherits the longer period"
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: Consistent across markets.
type_detail: ENFORCED. §17 sets no fixity frequency; the default follows DI-44.
