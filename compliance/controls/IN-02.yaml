id: IN-02
title: Risk classification recorded on steps, deviations and changes
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 232
sources: "Schedule M Part I section 2 (QRM: systematic, science-based, effort proportionate to risk)."
behaviour: MBR steps, parameters, deviations and change requests carry a risk class from a controlled, versioned scale. Any risk-based reduction (e.g., no second-person verification, "minor" deviation, reduced IPC frequency) cannot be saved without a linked risk assessment and written rationale. Changing a step's criticality in a new MBR version changes its verification requirements.
catalog_test: classify a deviation as minor without a rationale; saving is refused.
implemented_by:
  modules:
    - "packages/recipe-core/src/flow/model.ts (RiskScale, RiskReduction, riskClass on steps, parameters, calculations)"
    - "packages/recipe-core/src/validator/rules-content.ts (GMP-RISK, GMP-SIGNIFICANT-STEPS)"
    - "apps/tablets-server/sql/0150_designer.sql (tab.designer_justification: insert-only, audited on the version chain, bound to the revision and content hash)"
    - "apps/tablets-server/src/features/designer/definition.ts (combined gate: zero errors, every validator and definition warning justified)"
  guards:
    - "GMP-RISK: every risk-based reduction has a risk class from the controlled scale and a linked risk assessment; a non-critical (minor) classification needs one"
    - "GMP-SIGNIFICANT-STEPS: one-verifier mode (S5a) and no second person on clearance (S24) only through a declared reduction"
