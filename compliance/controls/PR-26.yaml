jurisdiction: EU explicitly requires processing-area clearance (5.40, 4.18(c)) and transfer-connection checks (5.14). US requires only a pre-use cleanliness inspection of equipment. EU is stricter. A checklist is not required for processing clearance (D-5).
type_detail: "ENFORCED (clearance before each processing operation; route check before each transfer) + CONFIGURABLE (checklist format for processing clearance: default ON, allowed OFF; second verifier: default ON, allowed OFF; repeat clearance after an interruption: default ON)"
