id: PR-26
title: Processing pre-start clearance and transfer-route checks
part: B
group: D. Equipment, premises, cleaning and logs
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 116
  - 90
  - 140
sources: "US: 211.67(b)(6); 211.100(a) | EU: Ch.4 4.18(c); Ch.5 5.14; 5.40 | ICH/EMA/draft: none"
behaviour: |-
  - Before each processing operation, the system checks electronically that:
    - the previous batch is closed in the room and equipment logs;
    - the equipment is Clean;
    - no materials of other orders are allocated to the room.
  - The operator then confirms that no foreign materials, products, residues or documents are physically present. The confirmation is e-signed into the record.
  - Before a product transfer through pipework, hoses or transfer panels, a connection check is recorded.
  - Design choice for the route check: scan the source, route components and destination and compare them with the master route. A mismatch blocks the transfer.
catalog_test: Starting compounding while the prior batch is not cleared is blocked. Scanning a hose to the wrong destination blocks the transfer.
implemented_by: {}
tests:
  - "packages/recipe-core/test/plant/area.test.ts > starting in a room needs a passed clearance of the required type (INV-15, IN-21, PR-26) > [INV-15][PR-26][IN-21] clean, clear, start, end: the next batch needs a new clearance recorded after the previous occupancy; the clearance records the previous product and batch"
  - "packages/recipe-core/test/mutation/plant-equipment-and-areas.test.ts > each refusal of the commands, on its own > [INV-15][PR-26][IN-26] a room start takes a clearance of the required type, recorded for this batch: a CAMPAIGN clearance does not stand for a product change"
expert_decision:
