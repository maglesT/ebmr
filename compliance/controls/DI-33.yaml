  invariants:
    - "INV-25"
  guards:
    - "Sandboxed language with a closed function library (library/index.ts): no assignment, statements, loops, lambdas, recursion or user-defined functions; reserved words refused (EXPR-SYN-006, EXPR-SYN-020); unknown functions refused (EXPR-FN-001); static cost bound (EXPR-COST-001)"
    - "Checker: reads declared inputs only (EXPR-TYP-001); dimension and unit checks (EXPR-UNIT-010/011/012/013/014); semantic tags, e.g. % LOD + % yield refused (EXPR-TAG-001/002/003); a constant typed as a calculation refused (EXPR-INV25-001)"
    - "Exact arithmetic: Dec at 34 significant digits on a private decimal.js clone, strings only (JavaScript numbers refused); unit factors are exact rationals generated from UCUM definitions and cross-checked with @lhncbc/ucum-lhc (regenerate-and-compare test)"
    - "Explicit evaluation errors naming the input path: MISSING_INPUT, DIVISION_BY_ZERO, DOMAIN_ERROR, EMPTY_SERIES, SERIES_TOO_LONG, INVALID_INPUT; never a silent zero or NaN"
    - "Evaluation record (evidence/record.ts): expression and canonical text, language version, program hash, inputs with value, unit, tag and source reference, every conversion with its exact factor, table lookups, full-precision output, SHA-256 content hash"
    - "recalculate(): a correction produces a new record that supersedes the earlier one by content hash, with the reason and each corrected input; the earlier record is never changed (both kept)"
    - "verifyEvaluationRecord() and DERIVED inputs (INV-25): a stored result must recompute identically from its recorded inputs; a typed or altered result, or a result of another calculation, is refused"
    - "Rounding only at comparison and display: compareToLimit / compareToBound with USP_HALF_UP_AT_LIMIT_DECIMALS or PH_EUR_SIG_FIGS, ALL_APPLY per criterion; full precision always kept"
    - "Legacy hardness unit: 'kg/cm² (as kgf/kp)' maps to kgf with 1 kgf = 9.80665 N and a WARNING needing justification (EXPR-UNIT-030); a pressure unit on a force parameter refused (EXPR-UNIT-021)"
    - "Dependency graph: calculation cycles refused (EXPR-DEP-001); deterministic evaluation order; dependents of a corrected input classified as derived result, decision input or executed target (outline 5.2.3)"
    - "Derived values are computed by the engine through @ebmr/expr with an evaluation record; typing one is refused (ENG-DERIVED-TYPED); block-computed quantities (net = gross - tare, container totals) cannot be typed (ENG-NOT-RECORDED-HERE)"
    - "A calculation that cannot be evaluated raises CALCULATION_FAILED, never a silent zero"
    - "After a correction the dependents are recalculated: the old record is kept and superseded with the reason; signed steps go back for re-verification; an executed target outside tolerance raises EXECUTED_TARGET_CHANGED"
    - "G-20 yield needs a verifier (G20-NO-VERIFIER)"
