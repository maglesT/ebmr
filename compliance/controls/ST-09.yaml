id: ST-09
title: Disqualification, restriction and requalification triggers
part: C
group: "Theme 1: Personnel qualification and gowning gate"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 449
  - 295
sources: "EU Annex 1: 7.6 | US: 211.25(a); FDA-AP V.A, V.C."
behaviour: |-
  - Person status can be qualified, supervised-only, retrain, requalification-required or disqualified. The status changes automatically on any of these:
    - a personnel-monitoring action result or an adverse PM trend (rule set in ST-22);
    - implication in a failed APS (ST-33);
    - a gown breach or an observation finding (ST-11, ST-13);
    - manual QA action.
  - A disqualified or requalification-required person cannot sign Grade A/B steps on **any** open batch.
  - Clearing the status needs QA sign-off referencing linked retraining, a gowning assessment and (default on) a successful APS.
catalog_test: Mark an APS failed → all implicated operators become restricted and their aseptic signatures are refused until the requalification records, including a successful APS, are linked.
implemented_by: {}
tests:
  - "packages/kernel/test/identity/area-authorisation.test.ts > area authorisation (kernel 1190) > [ST-09][ST-10][INV-26] after QA withdraws a person's authorisation of an aseptic area, the signature there is refused until a new authorisation (after requalification) is recorded"
