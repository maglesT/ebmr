id: IN-10
title: Electronic signatures (Indian basis)
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 663
  - 667
  - 242
sources: Schedule M Part I 17.3.9 (packaging-record entries identified by signature or electronic password); Part I 17.3.8 (processing record dated and signed); Part XII 6.1 (e-signatures authenticated and secure; hard copy obtainable where electronic records are used; 6.1.7 originals or true copies); IT Act 2000 sections 3A, 5 and Second Schedule. See section D.
behaviour: "(a) Baseline for all signatures: unique user ID plus secret, re-authentication at the moment of signing, signature manifestation (printed name, date/time with time zone, meaning such as performed/verified/approved/released), cryptographic binding of the signature to a hash of the signed content so any later change shows the signature as broken, no shared or reused IDs. (b) Configurable option: for selected meanings (default proposal: MBR approval and AP release) require a Class 3 digital signature certificate from a licensed certifying authority, or an eSign (Second Schedule technique) instead of the password signature. (c) Any record can be printed or exported with signatures and audit trail on demand."
catalog_test: sign a step, then alter the value directly in the test database; signature verification reports the record as altered. Sign a release with a DSC; it validates against the CCA root chain.
implemented_by: {}
tests:
  - "packages/kernel/test/esig/invalidation.test.ts > INV-09 bypass > [INV-09][IN-10] a disabled invalidation trigger stops all signing, and a change made behind it is detected"
  - "apps/tablets-server/test/governance/governance-routes.test.ts > the India DSC step with a test CA over HTTP (IN-10) > [IN-10] a signature whose meaning needs a DSC validates against the configured test-CA chain; a broken chain or no DSC is refused; the banner says not legally valid"
  - "packages/api-contract/test/governance.test.ts > the support, contract-giver and DSC routes (Phase 6 slice 6f) > [DI-08][IN-30][IN-10] every support and contract-giver route is GMP only under its own path, and every one of these routes has an example that parses"
  - "packages/api-contract/test/governance.test.ts > the support, contract-giver and DSC routes (Phase 6 slice 6f) > [IN-10] a challenge may carry the DSC statement and a sign request the token's signature and chain; DSC changes name a change record"
  - "packages/kernel/test/esig/dsc.test.ts > India DSC with a test CA (kernel 1203; IN-10) > [IN-10] the DSC is off by default; LICENSED is refused until a licensed provider is configured; TEST_CA needs its anchor"
  - "packages/kernel/test/esig/dsc.test.ts > India DSC with a test CA (kernel 1203; IN-10) > [IN-10] a release signed with a DSC validates against the CA root chain (test CA), stored beside the password signature"
