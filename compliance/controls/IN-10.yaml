  - "packages/kernel/test/esig/dsc.test.ts > India DSC chain verification in the server (IN-10) > [IN-10] an issuer in the chain that is not a certification authority is refused, even when its key signed the next certificate"
  - "packages/kernel/test/mutation/india-dsc.test.ts > the database refuses what the server should have refused (kernel 1206) > [IN-10] a certificate is enrolled only from an active, personal account: a service and a break-glass account are refused"
  - "packages/kernel/test/mutation/india-dsc.test.ts > the database refuses what the server should have refused (kernel 1206) > [IN-10] an enrolment chain must end at the live anchor, be more than the anchor alone, and start with the claimed signer certificate"
  - "packages/kernel/test/mutation/india-dsc.test.ts > the database refuses what the server should have refused (kernel 1206) > [IN-10][DI-38] a signing DSC that claims the signer's enrolled certificate while its chain carries another certificate is refused"
