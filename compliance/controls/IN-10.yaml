jurisdiction: "**weaker/less specific** than 21 CFR 11.50 (manifestation), 11.70 (signature/record linking), 11.100, 11.200 (two distinct identification components), 11.300 (identification code/password controls) [chk] and EU Annex 11 section 14 (same effect as handwritten within the company, permanently linked, time and date) [chk]. The baseline in (a) meets all three regimes."
