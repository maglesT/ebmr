jurisdiction: training and quality-unit independence **same** as FDA 211.22 and 211.25 [chk] and EU Chapter 2 [gk]. The approved-technical-staff register is **different** (Indian licensing construct; the EU uses the QP under Annex 16 [gk]; FDA has no named-person approval).
