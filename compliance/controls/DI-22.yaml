    - "apps/tablets-server/sql/0560_subject_counts_shown_entries.sql (what the person an investigation is about is counted on a chain)"
  invariants:
    - INV-07
  db_constraints:
    - "kernel.audit_row_change trigger on every registered GMP table: actor, role, session, device, server time, site zone, old/new values or row hash, reason"
    - "EBMR-AUDIT-002: an update or delete without a reason is refused"
    - "kernel.command_marker: only contexts installed by kernel.begin_command are attributed (EBMR-AUDIT-009; ADR-0016)"
    - "iam.authn_attempt: protected log of every login and signing attempt"
