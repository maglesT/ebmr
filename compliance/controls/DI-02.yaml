id: DI-02
title: Metadata bound to every value across the data lifecycle
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 60
  - 640
