id: DI-50
title: Data-integrity investigations, remediation and scoping support
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 654
  - 657
sources: "US: 211.22(a), 211.192; FDA DI Q&A Q15, Q18, Introduction | EU: Annex 11 §13 | ICH/EMA/draft: none"
behaviour: |-
  - A DI concern can be raised as an investigation linked to users, time windows and batches.
  - Linked records and audit trails go on hold until the investigation closes: no archive purge and no disposal.
  - Scoping reports list, per user and per period, all records created or changed, across batches and sites.
  - A user's GMP rights can be revoked immediately across all sites.
  - Tighter controls (e.g., added verifications) can be rolled out as CAPA through configuration under change control.
  - The documented DI risk assessment of eBMR workflows is reviewed periodically.
  - Tips and suspected falsification go into the QMS investigation route and are never handled informally.
catalog_test: Open a DI investigation for a user and date range. The system lists every record that user created or changed. The linked batches cannot be disposed of until the investigation closes.
implemented_by:
  modules:
    - "packages/kernel/src/records/investigations.ts"
    - "packages/kernel/sql/0430_records_di_investigations.sql"
    - "packages/kernel/sql/0440_records_blockers_and_purge.sql"
    - "packages/kernel/sql/0720_authorization_signatures.sql"
  guards:
    - "records.investigation_scope / records.person_activity: every record the person created or changed in the window, from the audit trail"
    - "records.open_di_investigation: links and holds every record in scope; person investigated cannot open or lead it"
    - "records.open_blockers: linked records, and records the person touched in the window, block disposition until closure"
    - "records.close_di_investigation: conclusion, remediation and an approver who is neither investigator nor subject; releases the holds"
    - "records.close_di_investigation accepts only the approver's own valid DI_INVESTIGATION_CLOSED signature of the investigation (di_investigation:<id>; EBMR-REC-065)"
    - "tablets 0410 and 0420: a data-integrity investigation's content, signatures and audit chains are never served to the person it is about; the application role has no SELECT on the investigation tables"
  db_constraints:
    - "records.di_investigation, di_investigation_link, di_investigation_closure insert-only and audited; ebmr_app has SELECT only"
    - "check investigator_person <> subject_person_id and opened_by_person <> subject_person_id"
tests:
  - "packages/kernel/test/records/investigations.test.ts > [DI-50] an investigation for a user and date range lists every record the user created or changed; linked batches cannot be disposed of until it closes"
  - "packages/kernel/test/records/investigations.test.ts > [DI-50] records the person touches inside the window after opening are blocked at once and linked on refresh and at closure"
  - "packages/kernel/test/records/investigations.test.ts > [DI-50] other records can be linked with a note; the person investigated cannot open or lead it; a machine cannot open it"
  - "packages/kernel/test/records/investigations.test.ts > [DI-50] the scoping report works for any person and period, across batches"
  - "packages/kernel/test/records/investigations.test.ts > [DI-50] investigation holds cannot be lifted except by closing the investigation, and its records cannot be written directly"
  - "packages/kernel/test/records/investigations.test.ts > [DI-50][DI-37] closing a DI investigation needs the approver's own DI_INVESTIGATION_CLOSED signature of that investigation"
  - "apps/tablets-server/test/audit/read-authorisation.test.ts > F35: the audit viewer serves only the chains the session may read > [DI-17][DI-22][DI-50] the governance and audit roles (CSV/DI lead, auditor) read the governance chains and a colleague's activity"
  - "apps/tablets-server/test/audit/read-authorisation.test.ts > F35: the audit viewer serves only the chains the session may read > [DI-17][DI-50] a colleague's activity across the trail (person filter) is refused to an operator; the session's own is served, from the chains it may read"
  - "apps/tablets-server/test/audit/read-authorisation.test.ts > F35: the audit viewer serves only the chains the session may read > [DI-17][DI-50] the person a DI investigation is about neither lists its chain nor reads the investigator's activity or account chain"
  - "apps/tablets-server/test/esig/read-authorisation.test.ts > F34: GET /api/esig/content and /api/esig/signatures read only what the session may read > [DI-17][DI-50] a QA reviewer may read the investigation's signatures, but its content is served by no signing flow of this installation"
  - "apps/tablets-server/test/esig/read-authorisation.test.ts > F34: GET /api/esig/content and /api/esig/signatures read only what the session may read > [DI-17][DI-50] the person a DI investigation investigates gets nothing of it, neither its content nor its signatures"
  - "apps/tablets-server/test/esig/read-authorisation.test.ts > F34: the database (tablets 0410) > [DI-17][DI-50] the application role no longer reads content, signatures or investigations around the session rule"
  - "apps/tablets-server/test/esig/read-authorisation.test.ts > F34: the database (tablets 0410) > [DI-17][DI-50] the application role sees no signing request or signature of a GOVERNANCE-class record (row-level security); the owner sees them"
  - "apps/tablets-server/test/esig/read-authorisation.test.ts > F34: the database (tablets 0410) > [DI-17][DI-50] with a session token it decides by the session's role and person (EBMR-TAB-018, EBMR-TAB-019, EBMR-TAB-020)"
expert_decision:
  status: PENDING
  pack_version: "0.9"
