id: DI-50
title: Data-integrity investigations, remediation and scoping support
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 654
  - 657
sources: "US: 211.22(a), 211.192; FDA DI Q&A Q15, Q18, Introduction | EU: Annex 11 §13 | ICH/EMA/draft: none"
behaviour: |-
  - A DI concern can be raised as an investigation linked to users, time windows and batches.
  - Linked records and audit trails go on hold until the investigation closes: no archive purge and no disposal.
  - Scoping reports list, per user and per period, all records created or changed, across batches and sites.
  - A user's GMP rights can be revoked immediately across all sites.
  - Tighter controls (e.g., added verifications) can be rolled out as CAPA through configuration under change control.
  - The documented DI risk assessment of eBMR workflows is reviewed periodically.
  - Tips and suspected falsification go into the QMS investigation route and are never handled informally.
catalog_test: Open a DI investigation for a user and date range. The system lists every record that user created or changed. The linked batches cannot be disposed of until the investigation closes.
implemented_by:
  modules:
    - "packages/kernel/src/records/investigations.ts"
    - "packages/kernel/sql/0430_records_di_investigations.sql"
    - "packages/kernel/sql/0440_records_blockers_and_purge.sql"
    - "packages/kernel/sql/0720_authorization_signatures.sql"
    - "apps/tablets-server/sql/0440_investigation_subject_reads.sql"
    - "apps/tablets-server/sql/0460_disposition_blocker_reads.sql"
    - "apps/tablets-server/sql/0470_audit_actor_readers.sql"
    - "apps/tablets-server/sql/0530_chain_verification_and_subject_answers.sql"
    - "apps/tablets-server/sql/0540_sequence_high_water_reads.sql"
  guards:
    - "records.investigation_scope / records.person_activity: every record the person created or changed in the window, from the audit trail"
    - "records.open_di_investigation: links and holds every record in scope; person investigated cannot open or lead it"
    - "records.open_blockers: linked records, and records the person touched in the window, block disposition until closure"
    - "records.close_di_investigation: conclusion, remediation and an approver who is neither investigator nor subject; releases the holds"
    - "records.close_di_investigation accepts only the approver's own valid DI_INVESTIGATION_CLOSED signature of the investigation (di_investigation:<id>; EBMR-REC-065)"
    - "tablets 0410 and 0420: a data-integrity investigation's content, signatures and audit chains are never served to the person it is about (since tablets 0530 answered as what is not there); the application role has no SELECT on the investigation tables"
    - "tablets 0430: without a session the application role executes no evidence package, chain extract, scoping report, person activity or chain list, selects no anchor, checkpoint, verification run or retention hold, and sees only RECORD-class rows of the signature seals, ID register, content changes, invalidations and signing failures (row-level security)"
    - "tab.withheld_from, tab.chain_listed, tab.audit_chains and tab.audit_events (tablets 0440, answers corrected by 0530): whatever their role, the person a data-integrity investigation is about neither lists nor reads its chains, the hold chains it creates, the hold entries on the held records' chains, or the account and person chains of the persons who opened and lead it, nor in those persons' activity anything the investigation wrote; since tablets 0530 each reads as what is not there (no entries, no length, nothing to verify), never as a refusal (0440's EBMR-TAB-020 told the person)"
    - "tablets 0450: without a session the application role selects no disposal approval, tombstone, restore or restore approval and runs neither integrity list of signatures, so it finds no id of a GOVERNANCE-class signature to ask esig.signature_state about"
    - "tablets 0460: without a session the application role asks the kernel nothing about what blocks a record (records.open_blockers, has_disposition_blockers, disposal_refusals, retention_of, lock_blocker_epoch) and selects neither the blocker counters nor the retention status view, so it cannot list the persons under investigation and their concern from what blocks a record (the chain verification and the anchor comparison still told which accounts an investigation holds until tablets 0530)"
    - "tablets 0470: without a session the application role runs none of the kernel's readers of who acted on a chain or a row (iam.chain_persons, iam.record_entry_persons), of the checkpoint of a chain (kernel.checkpoint_chain, which refused only a chain with no entries) or of the entries of a time fault, and selects no segregation evaluation; tab.audit_registry_chains names to the person an investigation is about neither the account and terminal of an entry withheld from them nor a chain withheld from them"
    - "tablets 0530: without a session the application role verifies no chain (kernel.verify_chain from a position it chose named a chain's length, records.verify_chain) and compares no external anchor with the live chains (continuity.compare_external_anchors, verify_external_anchors, external_anchor_problems), so it learns from neither whether a chain exists; the audit viewer verifies through the session-checked tab.audit_verify_chain (EBMR-TAB-018, EBMR-TAB-020), with the registry chains its view draws on"
    - "tab.record_withheld, tab.content_for_signing, tab.record_signatures, tab.chain_read_problem, tab.audit_events, tab.audit_chain_length, tab.audit_registry_chains and tab.audit_verify_chain (tablets 0530): the person a data-integrity investigation is about is answered about what is withheld from them as a colleague in the same role is about what is not there (same status, message and body shape): no entries, no length, nothing to verify, no registry chains, no signatures, the content of a record that does not exist; a person filter on its opener or lead is served from the chains the person may read"
    - "tablets 0540: without a session the application role reads no high-water mark or move of a protected sequence (continuity.sequence_high_water, continuity.sequence_bump), so the investigation and hold numbers tell it neither when nor how many investigations and holds were opened"
  db_constraints:
    - "records.di_investigation, di_investigation_link, di_investigation_closure insert-only and audited; ebmr_app has SELECT only"
    - "check investigator_person <> subject_person_id and opened_by_person <> subject_person_id"
