id: DI-24
title: "Corrections, voids and deletions: the original is always preserved"
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 1
target_phase_source: outline
requirement_rows:
  - 658
  - 145
  - 203
  - 48
sources: "US: 11.10(e); FDA DI Q&A Q1c, Q12, Q13; Background (data secure until disposition) | EU: Ch.4 4.9; Annex 11 §9, §12.4 | ICH/EMA/draft: EMA GMP DI Q&A on data risk (s)"
behaviour: |-
  - After initial commit, a GMP value can only be corrected by creating a new version linked to the original.
  - The original stays visible in the record, in review views and on printouts (DI-40).
  - A correction requires the corrector to re-authenticate (signature meaning "Corrected by"). It records user, date-time and a mandatory reason.
  - "Delete" of GMP data is implemented as void/invalidate with a reason. The data is retained and shown as voided.
  - Correcting signed content supersedes the signature (DI-37).
  - Physical purge is possible only after retention ends, through DI-47. Deletion at DB level is prevented or detected.
catalog_test: Try to delete an entry through the UI and the API. Only void-with-reason is offered. Correct a value. The original is visible in the record, in the review list and in the PDF, alongside the corrector's signature and reason.
implemented_by:
  modules:
    - packages/kernel/sql/0010_audit_trail.sql
    - "packages/recipe-core/src/engine/corrections.ts (correction paths a, b, c and dependents)"
    - "packages/recipe-core/src/engine/data.ts (data-point versions)"
  invariants:
    - INV-06
    - "INV-41"
  db_constraints:
    - "a change or removal after first entry needs a reason; the audit event keeps the original values (old) with the reason and the actor"
    - "insert-only tables refuse update, delete and truncate (EBMR-AUDIT-004); corrections are new linked rows"
  guards:
    - "CORRECT_ENTRY (path a): a new data-point version; the original stays with corrector, reason and CORRECTED signature; device-captured values cannot be corrected (ENG-CORRECT-DEVICE); critical data needs approval (S25, ENG-CORRECT-APPROVAL)"
    - "VOID_ATTEMPT (path b): only an attempt without a result, with a reason and QA approval (S28; ENG-VOID-RESULT, ENG-VOID-APPROVAL); the voided attempt stays in the record"
    - "Dependents of a correction: derived values recalculated with the old record kept, signed steps sent back for re-verification, stage sign-off invalidated"
tests:
  - "packages/kernel/test/audit/audit-trail.test.ts > [DI-22][DI-24] a change after first entry needs a reason and records old and new values"
  - "packages/kernel/test/audit/audit-trail.test.ts > [DI-24][DI-22] an entry is removed only with a reason, and the audit trail keeps the original values"
  - "packages/recipe-core/test/engine/corrections.test.ts > path (a): entry-error correction (DI-24) > [DI-24][DI-33][INV-03] a correction keeps the original, recalculates dependents keeping the old result, and sends signed steps back for re-verification"
  - "packages/recipe-core/test/engine/corrections.test.ts > path (a): entry-error correction (DI-24) > [DI-24][DI-29] a device-captured value can never be corrected, only invalidated"
  - "packages/recipe-core/test/engine/corrections.test.ts > paths (b) void and (c) invalidation; repeats (DI-29, INV-41) > [DI-29][DI-24] an attempt is voided only before a result exists, with a reason and QA approval; the attempt stays in the record"
  - "packages/recipe-core/test/engine/segregation.test.ts > verifier is never involved (INV-03) > [INV-03][DI-24] correction by a checker-role person makes them involved; the re-verification must come from someone else"
  - "packages/recipe-core/test/engine/stage.test.ts > G-02 stage frame and summary > [IN-15][DI-24] a later correction invalidates the stage sign-off and the batch is no longer execution-complete"
  - "apps/tablets-server/test/execution/db-guards-corrections.test.ts > P24: a correction carries its own signature and the approval of another person > [DI-24][DI-35][INV-10][S25] a correction of critical data without an approval, approved by the corrector or by no person, or signed with another meaning is refused; the signed and approved correction is recorded"
clauses:
  - clause: "Try to delete an entry through the UI and the API. Only void-with-reason is offered."
    deferred:
      phase: 3
      reason: "The database refuses a removal without a reason and keeps the original (kernel audit-trail tests), and the engine voids an attempt only with a reason and QA approval (recipe-core engine corrections); no screen or route offers to delete or void a batch entry yet: the correction, void and invalidation paths of execution come in Phase 3 (build outline 11)."
  - clause: "Correct a value. The original is visible in the record,"
    tests:
      - "packages/recipe-core/test/engine/corrections.test.ts > path (a): entry-error correction (DI-24) > [DI-24][DI-33][INV-03] a correction keeps the original, recalculates dependents keeping the old result, and sends signed steps back for re-verification"
      - "apps/tablets-server/test/execution/db-guards-corrections.test.ts > P24: a correction carries its own signature and the approval of another person > [DI-24][DI-35][INV-10][S25] a correction of critical data without an approval, approved by the corrector or by no person, or signed with another meaning is refused; the signed and approved correction is recorded"
      - "packages/kernel/test/audit/audit-trail.test.ts > [DI-22][DI-24] a change after first entry needs a reason and records old and new values"
  - clause: "in the review list and in the PDF, alongside the corrector's signature and reason."
    deferred:
      phase: 4
      reason: "The review list and the PDF true copy come with production and QA review and the PDF/A-3 true copy in Phase 4 (build outline 11)."
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: "US: prior information must not be obscured. EU: alteration signed and dated, original readable, reason (Annex 11 §9: for all GMP-relevant changes and deletions). The EU is stricter on the reason and the signature."
type_detail: "ENFORCED (original preserved, reason, no deletion within retention). DESIGN-CHOICE, engine-enforced: a correction needs re-authentication because EU Ch.4 4.9 asks for alterations to be signed and dated, and an e-signature ceremony is the conservative reading. Physical-deletion ban during retention: 11.10(e) tolerates audited deletion; the ban is stricter."
