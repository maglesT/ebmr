jurisdiction: Both require 3 initial runs and a semi-annual cycle. **EU is stricter:** twice a year for *each process, each line and each shift*. FDA-AP requires semi-annual runs *per line*, with each shift's activities and changeovers represented in the programme. (Row n73 overstates FDA as "per line and shift"; see Conflicts.)
scope: aseptic
type_detail: ENFORCED (gate, 3-consecutive rule). Periodic interval is CONFIGURABLE with default and maximum = 6 months after the last successful APS. Any grace period is a DESIGN-CHOICE that needs a QA decision on the record (see Open questions).
