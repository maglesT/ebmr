    tests:
      - "packages/kernel/test/records/batch-retention.test.ts > batch retention keys (D-6-5) > [IN-08] a 24-month tablet made in January 2026 for India only is kept to January 2031 (five years from manufacture beat expiry + 1 year)"
  - clause: "Same batch for EU with QP certification Mar 2026: not earlier than Mar 2031."
    tests:
