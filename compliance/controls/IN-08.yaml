id: IN-08
title: Record retention engine
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 235
  - 661
  - 678
sources: Schedule M Part I 17.2 (retention at least one year after finished-product expiry); Drugs Rules Rules 74 and 78 with Schedule U (S/U).
behaviour: 'For each batch the system computes a "retain until" date as the maximum of every rule that applies to that batch, stores which rule governed, and blocks deletion or archive-with-loss before that date. Rules: (i) Schedule M: expiry + 1 year (always). (ii) Drugs Rules conditions of licence, pending confirmation: 5 years from manufacture for Schedule U manufacturing and test records (Form 25, Rule 74); for Form 28 licences (Rule 78) test records reportedly 2 years after expiry where an expiry is labelled, otherwise 5 years from manufacture (U). (iii) US market: expiry + 1 year (3 years after distribution for exempt OTC products without expiry). (iv) EU market: the longer of expiry + 1 year or 5 years after QP certification. Audit trails and signatures are retained for the same period as the record they belong to. A legal hold (complaint, recall, litigation) suspends expiry of retention.'
catalog_test: "24-month tablet made Jan 2026, India only: retention not earlier than Jan 2031 (5 years) because expiry + 1 year is Jan 2029. Same batch for EU with QP certification Mar 2026: not earlier than Mar 2031."
implemented_by: {}
tests:
  - "apps/tablets-server/test/records/archive-routes.test.ts > archive over HTTP (slice 6b) > [IN-08][PR-59] the retention of the batch is computed by the database from its record; a deletion request is refused and logged"
  - "packages/kernel/test/records/batch-retention.test.ts > batch retention keys (D-6-5) > [IN-08] a 24-month tablet made in January 2026 for India only is kept to January 2031 (five years from manufacture beat expiry + 1 year)"
  - "packages/kernel/test/records/batch-retention.test.ts > batch retention keys (D-6-5) > [IN-08] the same batch for the EU, certified in March 2026, is kept to March 2031; before the certification it is open"
  - "packages/kernel/test/records/batch-retention.test.ts > batch retention keys (D-6-5) > [IN-08] the batch inputs always carry India, and only an EU batch carries its certification or final rejection"
  - "apps/tablets-server/test/records/archive-routes.test.ts > archive over HTTP (slice 6b) > [IN-08] the licence form of the retention is the batch's recorded licence basis: a Form 28 batch gets the Form 28 rules"
  - "apps/tablets-server/test/records/archive-retention-facts.test.ts > the retention facts of a batch (archive/facts.ts; T13) > [DI-47][IN-08] every market of the batch's market set reaches the retention inputs, an unknown market does not, and a batch without a market set is India's"
  - "apps/tablets-server/test/records/archive-retention-facts.test.ts > the retention facts of a batch (archive/facts.ts; T13) > [IN-08] the licence form is the recorded basis's: Form 25 or 25A, Form 28 or 28A, otherwise none"
  - "apps/tablets-server/test/records/archive-retention-facts.test.ts > the retention facts of a batch (archive/facts.ts; T13) > [DI-47][IN-08] the outcome is the batch's status: an aborted or cancelled batch carries its abort or cancellation date (its issue date when none is recorded); a completed or running one carries none"
  - "apps/tablets-server/test/records/archive-retention-routes.test.ts > storing a batch's retention (archive syncRetention; T13) > [DI-47][IN-08] QA stores each batch's retention from its record, a second sync updates it, and the processing record follows the packaging record packed from it, whichever is stored first"
clauses:
