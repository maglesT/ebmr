jurisdiction: "**same** as EU Annex 11 sections 4, 6, 7, 10, 12, 13 [chk] and FDA 211.68(b) (authorised changes, input/output checks, backup) [chk]. **Weaker** than Annex 11 section 9 (audit trails regularly reviewed; reason for change documented) and section 11 (periodic evaluation) [chk], and than 21 CFR 11.10(e) (secure, computer-generated, time-stamped audit trail kept at least as long as the record) [chk]. The kernel applies the stricter items for every market."
type_detail: ENFORCED; DESIGN-CHOICE for audit-trail review and periodic evaluation (not in Schedule M).
