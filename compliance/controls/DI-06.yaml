id: DI-06
title: System inventory, system description and requirements traceability
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 149
  - 193
sources: "US: 211.68(b); FDA DI Q&A Q1f | EU: Annex 11 §4.3, §4.4, §4.7 | ICH/EMA/draft: draft Annex 11 §6 requirements, traceability matrix (draft)(s)"
behaviour: |-
  - The system exports its own configuration inventory: modules, each enabled interface with endpoint and version, connected devices (balances, scanners, PLC/SCADA, printers, vision systems), and data flows.
  - The export is compared automatically with the approved system description. An undocumented interface or device raises an alarm to the system owner and becomes a periodic-review item.
  - The customer inventory lists the eBMR and each connected system with its GMP function.
  - User requirements are based on documented risk assessment and GMP impact, and they are traceable to configuration items and tests. The traceability matrix is generated from linked IDs and kept current with each release and configuration change.
  - Validation evidence includes boundary tests (just inside, on and just outside) for every critical limit, and negative tests of error handling.
catalog_test: Enable an interface that is not in the approved description. The drift alarm fires. Every critical limit shows boundary-test evidence in the matrix.
implemented_by: {}
tests: []
clauses:
  - clause: "Enable an interface that is not in the approved description. The drift alarm fires."
    deferred:
      phase: 7
      reason: "The approved system description and requirements traceability are part of the generated validation pack (URS, specifications, trace matrix) of Phase 7 (build outline 11; Phase 4 plan, slice 7: documentation-type control); the interface adapters it would describe arrive in Phase 6."
  - clause: "Every critical limit shows boundary-test evidence in the matrix."
    deferred:
      phase: 7
      reason: "The trace matrix of the validation pack, with boundary-test evidence per critical limit, is generated in Phase 7 (build outline 11; Phase 4 plan, slice 7: documentation-type control)."
expert_decision:
  status: PENDING
  pack_version: "0.9"
build_status: SPECIFIED
jurisdiction: Only the EU texts explicitly require an inventory and a system description for critical systems. That requirement is adopted for all markets.
type_detail: "ENFORCED (inventory export and drift alarm). DESIGN-CHOICE (generated traceability matrix): this makes the draft's mandatory traceability matrix cheap to keep current, and it is enforced."
