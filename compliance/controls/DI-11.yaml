id: DI-11
title: Periodic evaluation and routine checks of the eBMR itself
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: default
requirement_rows:
  - 158
  - 178
  - 7
sources: "US: 211.68(a) (routine checks under a written program, records kept) | EU: Annex 11 §11 | ICH/EMA/draft: draft Annex 11 §14 periodic review (draft)(u)"
behaviour: |-
  - For a chosen period the system generates a periodic-review pack covering:
  - software releases and configuration changes;
  - open validation gaps;
  - incidents and interface failures;
  - access changes and privileged activity;
  - audit-trail review completion;
  - backup/restore and DR test results;
  - archive fixity and readability results;
  - time-sync events;
  - alarm statistics;
  - supplier SLA performance;
  - training status of active users.
  - The approved periodic-review report and its actions are stored in the system or linked to it.
  - A written routine-check program for the eBMR as a "computer or related system" covers interface health, backup success, time sync and integrity-job results, and its check records are kept.
catalog_test: Generate the pack for a test period and trace 5 sampled entries per topic back to their source logs.
implemented_by: {}
tests:
  - "packages/kernel/test/records/evaluation-pack.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11] the pack of a test period lists every topic, read through the reporting path, and 5 sampled entries per topic trace back to their source logs"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11] the pack is stored with its SHA-256, as generated; the database refuses a pack that is not the source logs' entries of an ended period"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11] QA signs the pack off with their own signature bound to its hash; the generator, another role or another pack's signature cannot"
  - "packages/kernel/test/records/records-cli.test.ts > the records command line (Phase 7 slice 7b-2) > [DI-08][DI-11] full-export writes and registers the export; evaluation-pack stores the pack read through the reporting role; usage and refusals give exit codes 2 and 1"
  - "apps/tablets-server/test/validation/evaluation-permissions.test.ts > the periodic evaluation and the full export on the Tablets roles (kernel 1335, 1336) > [DI-11] VALIDATION.APPROVE_EVALUATION is held by the quality unit only, VALIDATION.MANAGE by the CSV and data-integrity lead"
  - "apps/tablets-server/test/validation/evaluation-permissions.test.ts > the periodic evaluation and the full export on the Tablets roles (kernel 1335, 1336) > [DI-08][DI-11] the Tablets database knows the closed batch records and every topic of the evaluation, with the source logs of each module"
  - "apps/tablets-server/test/validation/export-routes.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11][DI-44][DI-37] the CSV lead generates the pack of an ended period with its readability report; QA signs it off, never the person who generated it"
  - "apps/tablets-server/test/validation/export-routes.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11] a period that has not ended is refused by the database; nothing is stored"
  - "apps/tablets-web/test/validation/exports.test.tsx > the periodic evaluation > [DI-11][DI-44] a pack is generated for a period typed with its offset, a seed and a sample size"
  - "apps/tablets-web/test/validation/exports.test.tsx > the periodic evaluation > [DI-11][DI-37] QA signs off a stored pack; a signed-off pack is not offered again"
