id: ST-71
title: "Release gate: deviations and investigations with impact scope, yield, storage excursions"
part: C
group: "Theme 14: Batch record review dossier and release gate"
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 400
  - 360
  - 401
  - 398
sources: "EU Annex 1: 3.1(iii), 3.1(iv), 3.1(vi), 3.2 | US: 211.192 (binding); FDA-AP XII (text box)."
behaviour: |-
  - **Conditions for the release e-signature:**
    - every section is complete and every review-by-exception item is dispositioned;
    - **every linked deviation and investigation is closed**, or formally assessed as not affecting this batch;
    - yield and reconciliation (bulk, fill count, inspection, labelling) are within MPCR limits or explained.
  - **Investigation closure requires:**
    - root-cause category and product-risk statement;
    - CAPA link and residual-risk acceptance rationale;
    - an impact-scope list of batches, with an inclusion/exclusion rationale for each, propagated to every listed batch;
    - a completed "other batches/products assessed" field.

    This applies **even if the batch has already been distributed**.
  - **Post-fill handling.** Storage and transport record location and conditions. An excursion from registered storage conditions is linked to the batch and blocks release until assessed.
catalog_test: An open deviation plus a yield outside limits → release refused, listing both. Close an investigation with the "other batches" field empty → refused.
implemented_by: {}
tests:
  - "apps/tablets-server/test/injectables/unit-account-gate.test.ts > Injectables I-6.3: the release gate on an unbalanced unit accountability and an open deviation > [ST-71] units not accounted for raise a critical exception the step cannot be signed past; QA dispositions it under a deviation, and with that deviation and another one open on the batch the lot is not releasable (G2.DEVIATIONS RED)"
  - "packages/recipe-core/test/library/seed-injectables-inspection.test.ts > the Injectables catalogue (slice I-5, automated inspection and integrity testing) > [ST-71] with the 100 % integrity test and automated inspection, unit accountability reads the closing rejects from the integrity test's total and the units accepted from the last step, in either order; one unit missing is an exception"
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the Injectables catalogue (slice I-1) > [ST-71] every unit filled is accounted for: one unit missing from the counts is an exception"
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the Injectables catalogue (slice I-1) > [ST-71] unit accountability reads the units filled and rejected at the line from the filling step, the units rejected at closing from the capping or sealing total, and the units accepted and rejected at inspection from the inspection step, never typed again; one unit missing is an exception"
clauses:
  - clause: "An open deviation plus a yield outside limits → release refused,"
    tests:
      - "apps/tablets-server/test/injectables/unit-account-gate.test.ts > Injectables I-6.3: the release gate on an unbalanced unit accountability and an open deviation > [ST-71] units not accounted for raise a critical exception the step cannot be signed past; QA dispositions it under a deviation, and with that deviation and another one open on the batch the lot is not releasable (G2.DEVIATIONS RED)"
  - clause: "listing both."
    not_required:
      decision: "docs/decisions/0030-injectables-unbuilt-minimum.md (lead ruling under the owner's minimum-compliance rule, 12 November 2026)"
      reason: "listing an open deviation and a yield outside its limits as two separate items on the release screen is beyond the clause"
  - clause: "Close an investigation with the \"other batches\" field empty → refused."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Fixed investigation-closure fields; storage-excursion link"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "Existing gate and deviations; INJ-24 accountability (4.5)"
