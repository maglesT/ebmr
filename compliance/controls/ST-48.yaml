id: ST-48
title: Sterilisation-in-place and post-SIP integrity
part: C
group: "Theme 7: Components, container-closures, depyrogenation, sterilisation cycles and load traceability"
editions:
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 499
sources: "EU Annex 1: 8.63 | US: 211.113(b); FDA-AP IX.C.1."
behaviour: |-
  - The SIP record holds temperature, pressure and time at each monitored location (correlated with the slowest-heating points), plus cycle ID and result.
  - After SIP, integrity status is tracked (positive-pressure trend, or sterilising vent-filter ID), along with the maximum hold until product use.
  - Loss of pressure invalidates the SIP and blocks product transfer.
catalog_test: Import a post-SIP pressure trend that falls to ambient before use → SIP invalid, transfer blocked.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables-aseptic.test.ts > the Injectables catalogue (slice I-2, aseptic processing and EM) > [ST-48][ST-42] sterilisation in place records the cycle values from the printout as critical values with limits, checked by a second person; a temperature or exposure below the minimum is an exception"
clauses:
  - clause: "Import a post-SIP pressure trend that falls to ambient before use → SIP invalid, transfer blocked."
    not_required:
      decision: "docs/build-plan/injectables/control-decisions.md (approved by the owner via the lead, 5 November 2026)"
      reason: "Pressure-trend import; automatic invalidation"
