jurisdiction: US permits "other control systems" instead of separate areas. EU permits simultaneous or consecutive work only where it creates no mix-up or cross-contamination risk. The effect is equivalent.
type_detail: "ENFORCED (occupancy, permitted area type, maintenance and cleaning status) + CONFIGURABLE (room-condition checks). Default: ON wherever the master states conditions. Concurrent use of a room needs a configuration that cites a risk assessment; QA approval of that configuration is a design choice."
