id: PR-10
title: Batch record issuance and batch numbering
part: B
group: B. Batch record issuance and execution
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 97
  - 1
sources: "US: 211.188(a); 211.186; 211.130(c); 210.3(b) lot-number definition (s) | EU: Ch.4 4.2 (working copies from masters must not introduce errors); 4.20 and 4.21 (records based on approved instructions) | ICH/EMA/draft: none"
behaviour: |-
  - The batch record is generated programmatically from the Effective master version, with no retyping.
  - The system verifies that the instance matches the master (hash or field comparison).
  - An authorised issuer e-signs and dates the issued record, with signature meaning "issued, reproduction verified".
  - The batch number comes from a controlled sequence. It is unique per site and product and has a globally unique internal key.
  - The destination-market set is recorded at issue. Packaging orders may narrow it later under control.
  - Later master edits never change an issued record.
  - Test, simulation and training runs are segregated, watermarked and cannot become GMP records.
catalog_test: An issued record matches the master hash and carries the issuance e-signature. A duplicate batch number is rejected. A record cannot be issued from a Draft master.
implemented_by:
  modules:
    - "packages/recipe-core/src/engine/engine.ts issue(), packages/recipe-core/src/engine/batch.ts initialState()"
  guards:
    - "Issue pins the MBR content hash and requires every header and master-data input typed with its source, a batch number and the market set (ENG-ISSUE-INPUT, ENG-ISSUE-NUMBER, ENG-ISSUE-MARKETS)"
tests:
  - "packages/recipe-core/test/engine/stage.test.ts > G-01 issuance and header > [IN-52][PR-10] India is in every market set, and a batch cannot target a market the MBR is not approved for"
  - "packages/recipe-core/test/engine/stage.test.ts > G-01 issuance and header > [PR-10][DI-10] header and master-data inputs are typed at issue with their source; the MBR hash is pinned; nothing is issued without them"
  - "apps/tablets-server/test/execution/commands.test.ts > test packages and issue (DI-05, INV-18) > [DI-05][PR-10][PR-01] issue: every header input is required (a count is positive); the TEST- number, the engine version, the block registry and the policy are pinned"
  - "apps/tablets-server/test/execution/db-guards-values.test.ts > P33: TEST- batch numbers past serial 9999 > [INV-27][DI-05][PR-10] serials 10000 and 10001 are written in full and give two distinct TEST- numbers"
expert_decision:
