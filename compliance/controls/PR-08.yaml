id: PR-08
title: CPP and IPC limit model (validated, registered and internal tiers)
part: B
group: A. Master records (MBR / master formula, processing and packaging instructions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 195
  - 189
  - 90
sources: "US: 211.110(b); 211.186(b)(9); 211.100(b) | EU: Ch.4 4.18(d)-(e); Ch.5 5.43 | ICH/EMA/draft: EU Annex 15 section 5 (u); Annex 16 section 3 and EMA Q&A on Annex 16 (s)"
behaviour: 'Each CPP and IPC field stores its unit, precision, limits and source (validation report or registration). Limits are tiered: registered, internal action, and optional alert. A result outside a registered limit automatically creates a deviation flagged "registration-relevant", which appears on the QCU/QP release screen. Out-of-limit values are stored exactly as acquired. The operator cannot suppress the flag, and re-entry is a correction, not a replacement.'
catalog_test: A value outside a registered limit creates a deviation with the registration flag, and it is visible on the release screen. The operator cannot clear the flag.
implemented_by:
  modules:
    - "packages/recipe-core/src/limits (model, nesting, evaluate, all-apply)"
    - "packages/recipe-core/src/validator/rules-content.ts (GMP-LIMITS, GMP-CRITICAL-PARAMETERS)"
    - "packages/recipe-core/src/simulator/boundary.ts (limit boundary vectors)"
    - "packages/recipe-core/src/engine/data.ts (limit evaluation at recording)"
    - "packages/recipe-core/src/engine/exceptions.ts (tiers and blocking)"
    - "apps/tablets-web/src/features/designer/components/DocumentView.tsx (limit tiers, targets and time bounds edited as decimal text through DecimalField)"
    - "apps/tablets-server/src/features/designer/validation.ts (GMP-LIMITS findings located at the parameter)"
    - "apps/tablets-server/src/features/execution/views.ts (limits with tier and source reference, the stored verdict of each attempt, blocking exceptions with what to do)"
  guards:
    - "checkLimitSpec / checkNestingAfterRounding: alert inside internal action inside registered and validated, exactly and after each tier rounds"
    - "evaluateLimits: value kept as acquired; outermost breached tier decides: REGISTER_ITEM, STOP_UNTIL_DEVIATION, REGISTRATION_RELEVANT_DEVIATION (QA-only, release screen, sign-off blocked); operatorMayClear always false"
    - "evaluateAllApply: every criterion with its own rounding and sampling; sampling plan = union"
    - "At recording the value is stored as acquired and evaluated: ALERT a register item; INTERNAL_ACTION stops the step and the steps after it until a deviation is linked; REGISTERED or VALIDATED a registration-relevant deviation that only QA dispositions and that blocks the stage sign-off; the operator cannot clear it"
    - "Loop endpoint limits are judged at loop exit; every iteration is kept"
    - "Sandbox test runs: an internal-action breach is recorded as acquired, the exception blocks, and signing the step is refused (BLOCKED_BY_EXCEPTION) until a supervisor links a deviation"
