id: DI-44
title: Protection and integrity checking of stored data
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
  - DESIGN_CHOICE
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 46
  - 152
  - 44
sources: "US: 11.10(a), 11.10(c); 211.68(b) | EU: Annex 11 §7.1 | ICH/EMA/draft: none"
behaviour: |-
  - Finalised records sit on protected, redundant storage, and completed records are immutable (design: WORM/object lock).
  - A scheduled integrity check runs over hashes and DB consistency.
  - A scheduled readability check opens and renders sampled old records, including their audit trails and signatures.
  - Results are recorded, and any failure opens an incident (DI-12).
  - Access to the data is maintained for the whole retention period, including across upgrades.
catalog_test: The periodic readability report lists the sampled records, each opened with its audit trail. Deliberately corrupt a record in a test environment. The check detects it.
implemented_by: {}
tests:
  - "apps/tablets-server/test/validation/export-routes.test.ts > the periodic evaluation pack (kernel 1336) > [DI-11][DI-44][DI-37] the CSV lead generates the pack of an ended period with its readability report; QA signs it off, never the person who generated it"
  - "apps/tablets-web/test/validation/exports.test.tsx > the periodic evaluation > [DI-11][DI-44] a pack is generated for a period typed with its offset, a seed and a sample size"
  - "packages/kernel/test/audit/verification.test.ts > the verification job (DI-23) > [DI-23][INV-08][DI-03][DI-44] a chain altered in the database raises a critical alarm that names the entry, announced at once; the run record cannot be changed"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the edges of the periodic evaluation pack (kernel 1336) > [DI-11][DI-44] a pack without its text, its period ends, its topics or its readability seed and records, or with an empty period or an extra topic, is refused"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the edges of the periodic evaluation pack (kernel 1336) > [DI-44] a readability sample at its edges is stored: a 200-character seed, a size of 1000, and the size of every record closed before the period's end when there are fewer than 10"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the periodic readability report (kernel 1335, 1336) > [DI-44] a sampled record whose stored row was altered is reported UNREADABLE with the finding, and the pack records it"
  - "packages/kernel/test/records/evaluation-pack.test.ts > the periodic readability report (kernel 1335, 1336) > [DI-44] the periodic readability report lists the seeded sample of closed records, each opened and rendered with its audit trail, with its result and render hash per record"
  - "packages/kernel/test/records/full-export.test.ts > the bounds and the registration guards of the full export (kernel 1335) > [DI-08][DI-44] a page, a snapshot, a readability sample and a readability snapshot are refused outside their bounds and served at their edges"
  - "packages/kernel/test/records/full-export.test.ts > the bounds and the registration guards of the full export (kernel 1335) > [DI-08][DI-44] the owner registers only a STABLE argument-free closed-record source of the agreed columns, and only an audited table with a known permission as restricted"
  - "packages/kernel/test/records/full-export.test.ts > the closed records (kernel 1335) > [DI-08][DI-44] closed incidents and closed DI investigations are the kernel's closed records, read through the reporting path; an open one is not"
  - "packages/kernel/test/records/full-export.test.ts > the closed records (kernel 1335) > [DI-44] the readability sample is seeded: the same seed gives the same records in the same order, another seed another order, and only records closed before the given time"
  - "packages/recipe-core/test/records/closed-batch-records.test.ts > the closed batch records (recipe-core 1240) > [DI-08][DI-44] a batch record is closed when its record is locked now, or when it is aborted or cancelled now; a completed, reopened, running or amended record is not"
  - "packages/recipe-core/test/records/closed-batch-records.test.ts > the closed batch records (recipe-core 1240) > [DI-08][DI-44] a closed batch record's archive package is every chain keyed by the batch, its record lock and amendments included, and the signature chains of its parts, record-lock amendments included"
  - "packages/recipe-core/test/records/closed-batch-records.test.ts > the closed batch records (recipe-core 1240) > [DI-08][DI-44] an aborted batch is closed at its own move to ABORTED: not at a later command of the batch, nor at another batch's later abort"
  - "packages/recipe-core/test/records/closed-batch-records.test.ts > the closed batch records (recipe-core 1240) > [DI-08][DI-44][IN-53] an export or a readability read of a closed batch holding controlled-substance rows needs CONTROLLED.READ with no site or product limit: a holder without it is refused, never served a partial copy"
