jurisdiction: EU §7.1 explicitly requires stored data to be checked for accessibility, readability and accuracy. It is adopted for all markets.
type_detail: "ENFORCED (the checks exist and alarm). CONFIGURABLE for frequency: DESIGN-CHOICE default is quarterly for readability sampling and weekly for integrity jobs. Neither rule sets a frequency."
