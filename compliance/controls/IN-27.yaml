id: IN-27
title: Hazardous products (sex hormones, steroids, cytotoxics)
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
  - 666
sources: Schedule M Part III (general; 2.1-2.3 risk assessment including OELs; 4 PPE and breathing air).
behaviour: Product master data carries a hazard class set from a documented risk assessment (which stages fall under Part III). The class restricts rooms, lines and equipment to contained ones and inserts mandatory PPE, containment-check and decontamination/de-gowning steps into the MBR; the executed checks are recorded. Where breathing air is used, the room master data records the 100% back-up with automatic changeover and its status is checked at step start.
catalog_test: classify a product as cytotoxic; the MBR designer adds PPE and decontamination steps and offers only contained areas.
implemented_by: {}
tests:
  - "apps/tablets-server/test/designer/hazard-containment.test.ts > the designer for a hazardous product (IN-27) > [IN-27] a cytotoxic product's MBR gets PPE and decontamination steps and only contained areas"
  - "apps/tablets-server/test/designer/hazard-containment.test.ts > the designer for a hazardous product (IN-27) > [IN-27] a product without a hazard class keeps the template as it is"
  - "apps/tablets-server/test/india/india-route-edges.test.ts > the India routes at their edges (feature india) > [IN-27] a hazard record that names neither a product classification nor an area dedication is refused with what to do"
  - "apps/tablets-server/test/india/india-route-edges.test.ts > the India routes at their edges (feature india) > [IN-27] a product classification alone or an area dedication alone is recorded and listed with all it says"
  - "apps/tablets-server/test/india/india-routes.test.ts > the record side over HTTP (Phase 4 slice 6a) > [IN-27] a recorded hazard class waits for a second QA person: the recorder's own approval signs nothing; another QA person approves it through the ceremony (INDIA_ACT HAZARD_APPROVE)"
  - "apps/tablets-server/test/india/india-routes.test.ts > the record side over HTTP (Phase 4 slice 6a) > [PR-43][IN-27] the head of QC records a stability basis; QA records a hazard class; an operator records neither"
  - "apps/tablets-web/test/office/screen-gaps.test.tsx > shelf-life bases and hazard classes (india) > [IN-27][PR-43] QC records a shelf-life basis; QA approves a recorded hazard class and dedication under its own signature"
