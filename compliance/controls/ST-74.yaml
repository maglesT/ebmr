jurisdiction: For open isolators EU is stricter (Grade C, which is ISO 7 at rest) than FDA's "commonly ISO 8". The 17.5–50 Pa figure is FDA's.
scope: isolator, rabs (and conventional lines)
type_detail: ENFORCED (background floors, pressure monitoring). Pressure limits are CONFIGURABLE per qualification.
