id: PR-14
title: "Significant steps: performer plus checker, and the limited scope of single-person automated checking"
part: B
group: B. Batch record issuance and execution
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 4
target_phase_source: default
requirement_rows:
