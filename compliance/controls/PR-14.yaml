  guards:
    - "The verifier or witness never performed, entered data in or corrected the step (ENG-SEGREGATION)"
    - "Manual weighing with the scale offline makes the step need a second, different person"
    - "A step with neither performer nor checker cannot be defined (ENG-DEF-ZERO-HUMANS); an automated phase has a human performer unless the one-verifier mode S5a is on"
  invariants:
    - "INV-03"
