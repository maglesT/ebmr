id: DI-34
title: Operational sequencing checks
part: A
group: Controls
editions:
  - tablets
  - injectables
type:
  - ENFORCED
target_phase: 2
target_phase_source: outline
requirement_rows:
  - 49
sources: "US: 11.10(f); 211.100(b) | EU: Ch.4 4.20(h) (signed authorisation for departures); Annex 11 Principle (no loss of process control) | ICH/EMA/draft: none"
behaviour: |-
  - An execution state machine enforces:
  - MBR step order and declared parallel branches;
  - prerequisites: line clearance, equipment and material status, IPC due, timers, QA gates;
  - guarded batch lifecycle transitions: Issued, In Execution, Production Complete, Under Review, Released/Rejected, with Hold and Cancelled.
  - Out-of-sequence execution is possible only through a deviation path approved in the system. It is recorded and appears in review (design).
catalog_test: Try step N+1 before step N. Blocked. Try disposition before review is complete. Blocked.
implemented_by:
  modules:
    - "packages/recipe-core/src/flow (model, parse, expand, compile, graph, tokens)"
    - "packages/recipe-core/src/validator (rules-structure, graph-checks, rules-data, guards)"
    - "packages/recipe-core/src/engine (engine.ts step(), advance.ts, guards.ts, steps.ts, invariants.ts)"
    - "packages/recipe-core/src/blocks/generic/engine-level.ts (G-19 flow control)"
    - "packages/recipe-core/sql/0200_execution_store.sql, 0210_execution_writers.sql (one row per engine call, refusals included; hash chain; projection; execution_violations())"
    - "packages/recipe-core/src/execution (ExecutionTx, issueBatch, replayExecution)"
    - "packages/recipe-core/src/engine/replay.ts, codec.ts, actions.ts (replay at stored clocks; availableActions by dry run)"
    - "apps/tablets-server/src/features/execution (command route: lock, engine roles, intent resolution, engine.step, append; timeline; verify-replay)"
  invariants:
    - "INV-19"
    - "INV-20"
  guards:
    - "TokenGame.fire: only a node holding its tokens in the current marking fires, so no step runs before its predecessor (out-of-sequence refused)"
    - "TokenGame loop test: CONTINUE only below maxIterations; at the maximum an unmet exit is EXHAUSTED (exception)"
    - "Validator structure gates FLOW-ID-UNIQUE, FLOW-LEVELS, FLOW-CONSTRUCTS, FLOW-LIBRARY, FLOW-LOOPS, FLOW-REPLICATES, FLOW-DECISIONS"
    - "Graph gates GRAPH-START-END, GRAPH-REACHABLE, GRAPH-TERMINATES, GRAPH-DECLARED-CYCLES, GRAPH-MATCHED, GRAPH-BOUNDARIES"
    - "Data gates DATA-WRITTEN-BEFORE-READ, DATA-GUARDS (exhaustive, non-overlapping, reachable), DATA-PARALLEL (no unsequenced writes or claims)"
    - "step(state, command, clock): only a step instance holding a token is enabled and may start, record or sign (ENG-NOT-ENABLED); its token moves on only when COMPLETED or SKIPPED; control nodes fire automatically; untaken branches become NOT_APPLICABLE by the system"
    - "Data-decided branches and loop exits are decided from recorded data, never by a person; operator choices and run-time sub-lot counts need a role and a reason (ENG-DECISION-MODE, ENG-REPLICATE-COUNT, ENG-LOOP-EXIT)"
    - "Batch on hold: nothing starts, completes or advances (ENG-BATCH-ON-HOLD); stale commands are refused (ENG-STALE)"
    - "checkInvariants after every command in the model-based tests: tokens safe and matching the enabled steps; no step started before its predecessors completed; simulator paths and engine completions agree"
    - "recipe.append_execution: gapless sequence and hash chain (EBMR-EXE-023), state and events hashes recomputed in SQL, unique command id (EBMR-EXE-024); refused engine calls are rows with their refusal"
    - "replayExecution: the stored rows re-executed with the pinned engine and block versions give the stored accepted flags, events and states row by row; a batch pinned to another engine or registry is refused (EBMR-EXE-061, 062)"
    - "Screens offer only what the engine accepts (availableActions dry-runs engine.step); the command itself is decided again by the engine in the command transaction"
