jurisdiction: EU adds strength and, where appropriate, rooms. US adds the processing phase where necessary. The kernel applies the union of both.
type_detail: ENFORCED (unit ID in the record; contents and status identification) + DESIGN-CHOICE (barcode/RFID; electronic status displays in place of paper labels)
