behaviour: "- Non-biometric signatures use two distinct components: ID plus password/PIN, or badge plus PIN."
catalog_test: Sign twice in one session. The second signing needs at least the password. After a timeout, both components are needed. Try to apply the verifier's signature through the performer's session. Refused.
