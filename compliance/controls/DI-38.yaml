    - "apps/tablets-server/src/features/devices/routes.ts (live display stream: ends when its session no longer serves it)"
    - "apps/tablets-server/sql/0550_session_terminal_key.sql"
    - "apps/tablets-server/sql/0610_signature_table_plan_reads.sql (tab.session_challenge)"
    - "apps/tablets-web/src/api/page-binding.ts"
  invariants:
    - "INV-10"
  guards:
    - "esig.component_problem: two distinct components (user ID + password or badge + PIN); biometric or unknown components refused; MFA component when esig.mfa_at_signing is on (EBMR-ESIG-038)"
    - "esig.required_components: all components at every signing by default; the QA relaxation lets only the session owner, for routine types, after a first full signing in the same continuous session, use the private component; never for master-record, release or certification types; a co-signature always needs all components"
    - "esig.continuous_session_start: the continuous session restarts at every lock or unlock (an inactivity timeout ends in an unlock); a terminal change is a new session"
    - "iam.consume_auth_event (called by esig.sign): the event is the signer's own, bound to this challenge, fresh and unused; the performer's authentication never supplies another person's signature (EBMR-IAM-093)"
    - "esig.set_policy: policy values changed only by the quality unit with a reason and a change-control reference, within their allowed ranges"
    - "devices.live (SSE-SESSION): an open live display asks the session gate again every 2 s (tab.resolve_session through admitSession) and ends, naming the refusal, once the session is locked (by the person or the idle time), signed out, switched, expired or works in a role no longer granted (which ends the session too); the database decides the session's state"
    - "pageBindingRefusal (bind.ts) on tab.resolve_session's terminal key (tablets 0550): a request whose page names its terminal key or the person its session started with is served as nobody when the cookie's session was opened on another terminal (401 SESSION_OTHER_TERMINAL) or is another person's (401 SESSION_CHANGED); the SPA names both on every request (page-binding.ts, the person kept per tab) and then shows the sign-in form or says that its sign-in changed, never working in that session (review F41, round 4; residuals in decision F41.1)"
    - "tab.session_challenge (tablets 0610, HIGH-WATER round 5): the ceremony reads back the signing request it signs, the signature made for it and its correlation only for the active session bound to the token the server presents, and only a request made in that session; another session's request, an unknown token or a locked session reads as no request (the sign route then refuses EBMR-ESIG-031); the application role selects no row of esig.challenge or esig.signature itself"
  db_constraints:
    - "esig.meaning_type checks: master-record and release types are ALL_COMPONENTS"
    - "esig.policy_value: insert-only and audited"
  policies:
    - "esig.session_relaxation"
    - "esig.mfa_at_signing"
    - "esig.challenge_validity_seconds"
