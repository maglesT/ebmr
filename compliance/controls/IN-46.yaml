id: IN-46
title: Processing time limits, bioburden and endotoxin
part: D
group: Injectables edition
editions:
  - injectables
type:
  - ENFORCED
target_phase: 5
target_phase_source: outline
requirement_rows:
  - 256
sources: Schedule M Part II 5.12-5.17, 2.4.
behaviour: "The injectables MBR carries timers with product-specific maxima and hard alarms: washing/drying to sterilisation and sterilisation to use of components, containers and equipment; start of solution preparation to sterilisation or sterile filtration; (EU profile adds) start of preparation to end of aseptic filling, sterilised product hold before filling, aseptic processing time and filling time. Processing stage of components and equipment is identified. A pre-sterilisation bioburden sample is mandatory for every batch (aseptic and terminally sterilised), with result entry against working limits; scheduled intervals are allowed only for products flagged overkill-terminal; for parametric release it is an IPC on every batch. Purge/blanket gas steps require a sterilising-filter reference. Endotoxin steps on WFI, intermediates and finished product; for LVPs the water/intermediate endotoxin step cannot be removed from the MBR."
catalog_test: let the preparation-to-filtration timer exceed its maximum; a deviation is forced. Close a batch without a bioburden result; blocked.
implemented_by: {}
tests:
  - "packages/recipe-core/test/library/seed-injectables.test.ts > the master's time limits between injectables steps (slice I-6.3) > [ST-57][ST-59][IN-46] a time limit beyond its maximum (stoppering to capping 3 h against 2 h, part-stoppered vials exposed past their limit before the lyophiliser is loaded, compounding to filtration past its maximum) is an exception that needs a deviation and holds the release"
  - "packages/recipe-core/test/release/release.test.ts > the release gate on the sterile release tests and an open deviation (Injectables slice I-6.3) > [ST-54][ST-65][IN-46] release waits for every sterile release test: with sterility passed and endotoxin and bioburden pending, G3 is red and names the test that has no result, and the release is refused; the gate is green only when all have passed"
clauses:
  - clause: "let the preparation-to-filtration timer exceed its maximum; a deviation is forced."
    tests:
      - "packages/recipe-core/test/library/seed-injectables.test.ts > the master's time limits between injectables steps (slice I-6.3) > [ST-57][ST-59][IN-46] a time limit beyond its maximum (stoppering to capping 3 h against 2 h, part-stoppered vials exposed past their limit before the lyophiliser is loaded, compounding to filtration past its maximum) is an exception that needs a deviation and holds the release"
  - clause: "Close a batch without a bioburden result; blocked."
    tests:
      - "packages/recipe-core/test/release/release.test.ts > the release gate on the sterile release tests and an open deviation (Injectables slice I-6.3) > [ST-54][ST-65][IN-46] release waits for every sterile release test: with sterility passed and endotoxin and bioburden pending, G3 is red and names the test that has no result, and the release is refused; the gate is green only when all have passed"
expert_decision:
  status: MODIFY
  pack_version: "0.9"
  reviewer: owner (approved via the lead)
  date: "2026-11-05"
  comment: "DT plus CALC duration maximum; INJ-12 SAMPLE; INJ-26 TEST; gate (4.3, 4.5)"
build_status: SPECIFIED
jurisdiction: "**same** core as EU Annex 1 (2022) 8.18 and 8.93 (bioburden immediately before final sterile filtration; before the first filter where redundant) [chk] and FDA 211.110(a)(6) and 211.113(b) [chk]; EU 8.18 is **stricter**: it limits more intervals, including preparation start through to the end of aseptic filling, and the filling time itself [chk]."
notes: "Source check: P (5.12-5.16 and 2.4 re-read)."
