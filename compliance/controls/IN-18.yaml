id: IN-18
title: Batch numbering and allocation register
part: D
group: Kernel controls (both editions)
editions:
  - tablets
  - injectables
type:
  - ENFORCED
  - CONFIGURABLE
target_phase: 4
target_phase_source: outline
requirement_rows:
  - 243
  - 249
sources: Schedule M Part I 17.3.10.8-17.3.10.11 (numbering SOP, relation of processing and packaging numbers, no reuse, immediate recording of allocation); 14.32 (reworked batch gets a new number).
behaviour: "A configurable batch-number generator with a site-wide uniqueness constraint: a number is never reissued, including after cancellation or reprocessing; manual entry of an existing number is rejected. Processing and packaging batch numbers are linked by a defined rule. Every allocation writes immediately to an allocation register with at least allocation date, product identity and batch size. A reworked batch always receives a new batch number (IN-19)."
catalog_test: cancel a batch; its number is never offered again. Export the register; the three fields are present.
