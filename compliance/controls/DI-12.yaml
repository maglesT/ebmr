jurisdiction: Only the EU text explicitly requires incident management for computerised systems. It is adopted for all markets.
type_detail: 'ENFORCED for logging, batch linkage, and root cause plus CAPA on critical incidents. The disposition block is a DESIGN-CHOICE, engine-enforced by default: it puts the Ch.4 4.27 "special observations" indication into effect.'
