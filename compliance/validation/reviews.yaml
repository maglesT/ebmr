# The reviews behind the release and their findings by severity, open and fixed (Phase 7 slice 7-0, interfaces note
# section 1c). Entries are sorted by id. The open residuals themselves are in open-findings.yaml.
#
# Seeded in 7-0 from the two exit-review backlogs; the counts are read off those files:
# - 6j-c (docs/build-plan/phase-6/review-backlog.md): fixed high 6jc-R1, 6jc-R8 (raised by the lead) and 6jc-R16's
#   main part; open medium 6jc-R2, R9, R10 and the part of R16 left (so R16 counts once as fixed high and once as open
#   medium); open low R3 to R7 and R11 to R15. No critical finding is recorded.
# - 6A-7 (docs/build-plan/phase-6a/review-backlog.md): fixed high P6A7-1 to P6A7-3; open medium P6A7-4 and P6A7-5; open
#   low P6A7-6 to P6A7-9. Not counted: P6A5-2 (a lead item from slice 6A-5 fixed with them, no severity given) and
#   the item carried from 6A-3 without an id or severity. No critical finding is recorded.
#
# Phase 7 (slice 7f, 19 October 2026): one entry per review pass of docs/build-plan/phase-7/review-backlog.md, counts
# read off its tables. A severity written as a range there (low-medium, medium-high) counts at the higher one. Not
# counted: D-P7R-8 (no severity; an owner decision) and the 7b-1 and 7a residual lists of the builders (no id).
# F-6jb-g1 (medium, fail-safe) is counted open in 7b-1. The 7f exit review is the pass the VERIFIED rule (D-P7-2) rests on.
# The slice quick reviews (R-6a to R-6i, 6A-0 to 6A-6) are not seeded here; their residuals are in each slice's
# section of the phase plans.
