# The class of each control for the validation pack (Phase 7 slice 7-0, interfaces note section 1a, D-P7-0-4).
#
# core   the control falls under decision 0008 section 2's regulation-required core: audit trail, e-signatures,
#        access and segregation, record integrity, trusted time, status and release interlocks, limits and
#        calculations, market resolution. Database-enforced, full tests, control ids in the test names.
# other  everything else: application code allowed, with tests.
#
# A control NOT listed here is core (the stricter reading). So this file lists the controls that are clearly
# `other`, plus, for the record, controls an earlier plan placed in the Other column that are core after all (with
# the reason). The class lives here, not in the control files, so the pack changes no control file. Entries are
# sorted by id; `pnpm register:validate` checks the schema (compliance/schema/control-class.schema.json), the order
# and that every id is a control of the register.
classes:
  - id: DI-03
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); the Phase 7 plan's class table makes the validation-summary interlock at batch issue core (slice 7c)."
  - id: DI-06
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); the Phase 7 plan's class table makes interface drift refused and alarmed core (slice 7c)."
  - id: DI-08
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); the Phase 6 plan's class table puts the DI-08 grant in the database (slice 6f)."
  - id: DI-11
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); the Phase 7 plan's class table makes the evaluation pack's QA sign-off bound to its hash core (slice 7b-2)."
  - id: DI-48
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); its catalog test checks that counts, hashes, audit trails and signatures survive a migration (record integrity), so it stays core."
  - id: IN-12
    class: other
    basis: "Phase 4 plan slice 7 (documentation-type control) and the Phase 7 plan's class table (generators and bundle are Other): the validation package and site master file support are documents generated from the evidence, with no GMP record of their own."
  - id: PR-60
    class: core
    basis: "Phase 4 plan slice 7 listed it as documentation-type (Other); the Phase 6A plan makes the analytics role unable to write GMP data in the database, and no analytics method changes GMP data without a human e-signature."
