# The critical limits of the release and the tests that prove each at its boundary (Phase 7 slice 7-0, interfaces
# note section 1c). The validation pack shows each limit with its boundary tests in the trace matrix (DI-06).
#
# key            stable name of the limit (lowercase, hyphens); entries are sorted by key
# description    what the limit is and where the boundary falls
# controls       the controls the limit serves (each must be a control of the register)
# boundaryTests  tests named as in a control's tests list (`<file> > <describe> > ... > <title>`); each must be a test
#                the register lists, or `pnpm register:validate` refuses the file
#
# Seeded in 7-0 with limits whose boundary tests already exist; slice 7c added record-retain-until, usp-limit-rounding
# and weight-uniformity-band (boundary tests the register already lists).
limits:
  - key: batch-number-past-date
    description: "A numbering rule may be dated at most one minute before the database clock; exactly one minute is accepted, anything older is refused."
    controls: [IN-18]
    boundaryTests:
      - "packages/kernel/test/mutation/batch-number-register.test.ts > numbering rules, rendering, allocation, registration and voids (IN-18, INV-27) > [IN-18][INV-27] the past-date tolerance is one minute inclusive: a rule dated exactly one minute before the clock is accepted with that date, one microsecond older is refused (EBMR-SITE-010)"
  - key: dispensing-tolerance
    description: "Each dispensed line must lie within its tolerance of its target, both ends included; one step beyond raises DISPENSE_OUT_OF_TOLERANCE and the step closes only with it held."
    controls: [PR-08, PR-19]
    boundaryTests:
      - "apps/tablets-server/test/blocks/dispensing/tb-01-edges.test.ts > TB-01 at PERFORMED > [PR-19][PR-08] the tolerance is inclusive: a total exactly at target +/- tolerance passes, one step beyond raises DISPENSE_OUT_OF_TOLERANCE for that line only"
      - "apps/tablets-server/test/mutation/tablets-dispensing.test.ts > a TB-01 step closes within its tolerance or with the held exception (tablets 0843) > [PR-19][INV-25] each line within its tolerance of its target, the edge included; outside it, or without a target or tolerance, only with DISPENSE_OUT_OF_TOLERANCE raised and holding"
  - key: ipc-limits-and-rounding
    description: "In-process control values are judged against their limits on the side each limit states, with the alert tier inside the action tier; a value shown with decimals is rounded half away from zero, as the database rounds."
    controls: [IN-35, PR-08, PR-29]
    boundaryTests:
      - "apps/tablets-server/test/blocks/ipc/calc-edges.test.ts > IPC limits and verdicts > [IN-35][PR-29] a value shown with decimals is rounded half away from zero, as PostgreSQL round() does"
      - "apps/tablets-server/test/blocks/ipc/calc-edges.test.ts > IPC limits and verdicts > [IN-35][PR-08] one-sided limits judge only the side they state; the alert tier warns inside the action tier"
  - key: reading-maximum-age
    description: "A scale reading older than the database's maximum-age policy is refused, whatever age the server asks for; a site may only tighten the bound."
    controls: [DI-28, DI-32]
    boundaryTests:
      - "apps/tablets-server/test/devices/reading-age-policy.test.ts > F38: the maximum age of a scale reading is the database's policy (DI-28) > [DI-28][DI-32] a 10-minute-old reading pair is refused at 120 s, and still refused when the application role asks for 3600 s; nothing is recorded"
      - "apps/tablets-server/test/devices/reading-age-policy.test.ts > F38: the maximum age of a scale reading is the database's policy (DI-28) > [DI-28][DI-32] a site that tightens the policy gets the tighter maximum, whatever the server asks"
  - key: record-retain-until
    description: "A record is kept through its retain-until date; it may be disposed of only from the next site day (INV-22)."
    controls: [DI-47]
    boundaryTests:
      - "packages/kernel/test/mutation/retention-and-purge.test.ts > INV-22 retain-until boundary > [DI-47][INV-22] on its retain-until date a record is still kept (EBMR-REC-031); from the next site day it may be disposed of"
  - key: setpoint-read-back
    description: "A setpoint read back from automated equipment must match the configured value within its tolerance, ends allowed, in its unit; otherwise QA decides."
    controls: [DI-31, PR-14]
    boundaryTests:
      - "packages/recipe-core/test/blocks/g06-edges.test.ts > G-06 values > [DI-31][PR-14] a read-back of a configured setpoint matches within its tolerance (ends allowed), in its unit; otherwise QA decides"
  - key: usp-limit-rounding
    description: "A result is judged against a pharmacopoeial range after rounding to the stated places: just inside, on and just outside each end, and a missing value (USP 95.0 to 105.0)."
    controls: [DI-33]
    boundaryTests:
      - "packages/expr/test/vectors.test.ts > limit boundary values > [DI-33] USP 95.0-105.0: typical, on-limit, 94.95 just inside, 94.94 just outside, 105.04 / 105.05, and missing"
  - key: weight-uniformity-band
    description: "The weight-uniformity band follows the average weight: an inclusive limit takes its average into the band, an exclusive one does not."
    controls: [IN-34, PR-29]
    boundaryTests:
      - "apps/tablets-server/test/mutation/tablets-ipc.test.ts > weight uniformity and subdivision > [PR-29][IN-34] the band by the average weight: an inclusive limit takes its average, an exclusive one does not"
  - key: yield-limit
    description: "The forming yield is computed exactly from the net quantity against the limit times the feed, boundaries inside; the rounded display never decides."
    controls: [DI-29, PR-29]
    boundaryTests:
      - "apps/tablets-server/test/blocks/forming/tb-06-edges.test.ts > TB-06 entries > [PR-29][DI-29] the yield: exact net (granules + fines - recycled) x 100 against limit x feed; boundaries inside; the rounded display never decides"
