# The open review findings the release carries (Phase 7 slice 7-0, interfaces note section 1c); the pack's known
# issues are built from them. Each summary paraphrases its backlog entry; the full entry, with what was checked, is in
# the review subsection of the phase plan the backlog names. Entries are sorted by id (numbers compared as numbers);
# every control named must be a control of the register, and every source file must exist.
#
# Seeded in 7-0 from the 6j-c and 6A-7 backlogs; brought up to date in slice 7f (19 October 2026). An entry leaves this
# file when its fix merges: 6jc-R2, R9, R10, R16 left with slice 7a, 6jc-R3, R5, R6, R7, R11, R12, R13, R15, P6A7-6,
# -7 and -8 with 7b-1, 6jc-R4 with 7-0 (the migration-order check), P6A7-4 with 7d (the runner's own worker thread).
# Added: the Phase 7 residuals and known issues of docs/build-plan/phase-7/review-backlog.md.
# Not listed: the item carried from 6A-3 (two SPC reference sets in force for one chart), which has no id or severity.
findings:
  - id: 6jc-R14
    severity: low
    controls: [IN-10]
    summary: "The companion signature never records a DSC (it fails closed)."
    source: docs/build-plan/phase-6/review-backlog.md
  - id: F-6jb-g1
    severity: medium
    controls: [IN-05]
    summary: "A record lock still counts as a change since review (fail-safe): the epoch rows carry no cause, so a lock cannot be told apart from an evidence change without loosening other change detection."
    source: docs/build-plan/phase-7/review-backlog.md
  - id: P6A7-5
    severity: medium
    controls: []
    summary: "The flag table grows by one row per hit and run, and the flag views group the whole table on each read; measured in slice 7d at 63 ms or less at the load test's scale, to be watched at a real site."
    source: docs/build-plan/phase-6a/review-backlog.md
  - id: P6A7-9
    severity: low
    controls: []
    summary: "The audit-trail flag key leaves out the method version, so a verdict on one version's key also covers the same hit raised by a later version (intended reading; change control decides whether old verdicts carry over)."
    source: docs/build-plan/phase-6a/review-backlog.md
  - id: P7A-6
    severity: low
    controls: [DI-31]
    summary: "The v1 feed signature does not cover the envelope's sourceTimestamp and sourceRecordId; GMP times come from the signed payload, so only stored metadata is unsigned; a v2 format is an option for a later release."
    source: docs/build-plan/phase-7/review-backlog.md
  - id: P7X-1
    severity: medium
    controls: [DI-06]
    summary: "The drift interlock checks only that the adapter code is described; the described endpoint host, transport and source system are not compared with the running adapter (known issue for v1.0-rc; the comparison is listed for v1.1)."
    source: docs/build-plan/phase-7/review-backlog.md
  - id: P7X-2
    severity: low
    controls: [DI-06]
    summary: "Commands under an adapter's identity outside the inbound path (outbound ERP postings, reconciliation, mirror sync, the WMS location question) do not call the drift check; the server runs no such worker."
    source: docs/build-plan/phase-7/review-backlog.md
