# Kernel rule table, version 1 (build outline 3.3; ADR 0008; control IN-52).
#
# Format: packages/kernel/src/market/README.md. Once published, this file is frozen: a change is a
# new file kernel.v2.yaml with the full table (new rows, never edited rows) and a change record.
#
# Values are paraphrased from the cited clauses; nothing here quotes a regulation. Decimal values
# are quoted strings, never numbers. Verification: P, P~, S, U as in the India catalog
# (docs/regulatory/control-catalogs/D-india-schedule-m.md, section B); CHK = checked in the supplied
# primary text (docs/regulatory/sources-extracted); GK = general knowledge, confirm before
# validation documents cite it.
#
# Effective dates: India rows use 2023-12-28, the date of G.S.R. 922(E) (Revised Schedule M, in
# force on publication; the implementation deadlines by turnover have passed). EU and US rows use
# the date given in the supplied text (EU Chapter 4: 2011-06-30; 21 CFR 211: 43 FR 45077 of
# 1978-09-29; FDA data-integrity Q&A: December 2018). Where no date could be verified the row
# starts on 2023-12-28 and says so in its note.
table: kernel
version: 1
title: Kernel rule keys (both editions)
change:
  kind: INITIAL
  description: >-
    First kernel table, drawn from India catalog section B (B-01, B-02, B-07, B-08, B-09, B-15,
    B-20 to B-24, B-26).

keys:
  # --- Batch-record retention (B-01; IN-08). Retain-until = the latest of every component that applies.
  - key: kernel.retention.batchRecord.monthsAfterExpiry
    title: Batch record retention after expiry
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    catalogRefs: [B-01, IN-08]
    description: Months the batch record is kept after the batch's expiry date.
  - key: kernel.retention.batchRecord.monthsAfterManufacture
    title: Batch record retention after manufacture
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    catalogRefs: [B-01, IN-08]
    description: Months the batch record is kept after the date of manufacture.
  - key: kernel.retention.batchRecord.monthsAfterQpCertification
    title: Batch record retention after QP certification
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: false
    catalogRefs: [B-01, IN-08]
    description: Months the batch documentation is kept after EU QP certification; open until the certification date is received.
  - key: kernel.retention.batchRecord.monthsAfterDistributionOtcExempt
    title: Batch record retention after distribution (OTC without expiry dating)
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: false
    predicates:
      otcExpiryExempt: [true, false]
    catalogRefs: [B-01, IN-08]
    description: Months kept after distribution for an OTC product exempt from expiration dating.
  # --- Test-record retention: the licence-form predicate chooses the Drugs Rules branch (B-01; IN-08).
  - key: kernel.retention.testRecord.monthsAfterExpiry
    title: Test record retention after expiry
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    predicates:
      licenceForm: [FORM_25, FORM_28]
      expiryLabelled: [true, false]
    catalogRefs: [B-01, IN-08]
    description: Months quality-control test records of a batch are kept after its expiry date.
  - key: kernel.retention.testRecord.monthsAfterManufacture
    title: Test record retention after manufacture
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    predicates:
      licenceForm: [FORM_25, FORM_28]
      expiryLabelled: [true, false]
    catalogRefs: [B-01, IN-08]
    description: Months quality-control test records of a batch are kept after the date of manufacture.
  # --- Reference and retention samples (B-02, B-26; IN-32).
  - key: kernel.referenceSamples.monthsAfterExpiry
    title: Reference sample retention after expiry
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    catalogRefs: [B-02, IN-32]
  - key: kernel.referenceSamples.monthsAfterManufactureWithoutExpiry
    title: Reference sample retention after manufacture where no expiry is labelled
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    predicates:
      expiryLabelled: [true, false]
    catalogRefs: [B-02, IN-32]
  - key: kernel.referenceSamples.yearlyVisualExamination
    title: Yearly visual examination of representative reserve samples
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-02, IN-32]
  - key: kernel.referenceSamples.quantityMultipleOfFullTests
    title: Reference sample quantity as a multiple of the full test plan
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: '{multiple}'
    indiaGoverns: true
    catalogRefs: [B-26, IN-32]
  - key: kernel.referenceSamples.sterilityAndPyrogenTestsInQuantityBasis
    title: Sterility and pyrogen tests counted in the reference sample quantity
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-26, IN-32]
  # --- Batch numbering, self-inspection, management review.
  - key: kernel.rework.newBatchNumber
    title: A reworked batch receives a new batch number
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-07, IN-18]
  - key: kernel.selfInspection.maxIntervalMonths
    title: Maximum interval between self-inspections
    method: SMALLER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    catalogRefs: [B-08, IN-28]
  - key: kernel.managementReview.maxIntervalMonths
    title: Maximum interval between management reviews
    method: SMALLER_STRICTER
    valueType: DECIMAL
    unit: mo
    indiaGoverns: true
    catalogRefs: [B-24, IN-01]
  # --- Materials.
  - key: kernel.excipient.identityTestEachLot
    title: Identity test on every lot of an excipient (non-API starting material)
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-09, IN-24]
  # --- Documents, data and review.
  - key: kernel.masterRecord.twoPersonApproval
    title: Master record prepared by one person and independently checked by another
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-20, IN-06]
  - key: kernel.dataChange.reasonRequired
    title: Reason required for every change to recorded GMP data
    method: REQUIRED_IF_ANY
    valueType: BOOLEAN
    unit: '{flag}'
    indiaGoverns: true
    catalogRefs: [B-21, IN-06]
  - key: kernel.auditTrailReview.timing
    title: When the audit trail of a batch is reviewed
    method: ORDERED
    valueType: CATEGORY
    unit: '{category}'
    orderedValues: [NOT_REQUIRED, PERIODIC, BEFORE_BATCH_RELEASE]
    indiaGoverns: true
    catalogRefs: [B-22, IN-09]
  - key: kernel.release.requiredAuthorities
    title: Release decisions required before a batch reaches each market
    method: SET_UNION
    valueType: SET
    unit: '{set}'
    indiaGoverns: true
    catalogRefs: [B-23, IN-05]
  # --- Labelling: not comparable across markets; resolved per pack destination.
  - key: kernel.label.manufacturingDate
    title: Date of manufacture on the pack label
    method: NOT_COMPARABLE
    statedMethod: PER_DESTINATION
    valueType: ANY
    unit: '{text}'
    indiaGoverns: true
    catalogRefs: [B-15, IN-31]

