# Sterile rule table, version 1 (build outline 3.3.6; ADR 0008; controls IN-52, IN-40, IN-42,
# IN-43, IN-45, IN-48).
#
# Format and conventions: see kernel/kernel.v1.yaml and packages/kernel/src/market/README.md.
# Values are paraphrased; decimals are quoted strings. India rows start on 2023-12-28
# (G.S.R. 922(E)); EU Annex 1 (2022) rows on 2023-08-25, its date for coming into operation; FDA
# 2004 aseptic-processing guidance rows on 2004-09-01 (issued September 2004; the day is not given).
# FDA guidance values are GUIDANCE, or EXAMPLE where the guidance gives the number as an example.
table: sterile
version: 1
title: Injectables (sterile) edition rule keys
change:
  kind: INITIAL
  description: First sterile table, drawn from India catalog section B (B-10, B-12, B-13, B-16, B-17).

keys:
  # --- Non-viable particles (B-13; IN-40), particles per cubic metre.
  - {key: sterile.particles.gradeA.max0_5um, title: 'Grade A maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeA.max5_0um, title: 'Grade A maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeB.atRest.max0_5um, title: 'Grade B at rest, maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeB.atRest.max5_0um, title: 'Grade B at rest, maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeB.inOperation.max0_5um, title: 'Grade B in operation, maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeB.inOperation.max5_0um, title: 'Grade B in operation, maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeC.atRest.max0_5um, title: 'Grade C at rest, maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeC.atRest.max5_0um, title: 'Grade C at rest, maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeC.inOperation.max0_5um, title: 'Grade C in operation, maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeC.inOperation.max5_0um, title: 'Grade C in operation, maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeD.atRest.max0_5um, title: 'Grade D at rest, maximum particles of 0.5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - {key: sterile.particles.gradeD.atRest.max5_0um, title: 'Grade D at rest, maximum particles of 5 micrometre or more', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{particles}/m3', indiaGoverns: true, catalogRefs: [B-13, IN-40]}
  - key: sterile.particles.gradeA.monitoringMode
    title: How Grade A particle counts are monitored
    method: ORDERED
    valueType: CATEGORY
    unit: '{category}'
    orderedValues: [PERIODIC, CONTINUOUS]
    indiaGoverns: true
    catalogRefs: [B-13, IN-40]
  - key: sterile.particles.gradeA.minSampleFlow
    title: Minimum sample flow of the Grade A particle counter
    method: LARGER_STRICTER
    valueType: DECIMAL
    unit: L/min
    indiaGoverns: false
    catalogRefs: [B-13, IN-40]
  # --- Grade A viable monitoring (B-12; IN-42).
  - key: sterile.viable.gradeA.acceptance
    title: Grade A viable monitoring acceptance
    method: ORDERED
    valueType: CATEGORY
    unit: '{category}'
    orderedValues: [BELOW_1_CFU_PER_SAMPLE, NO_GROWTH]
    indiaGoverns: true
    catalogRefs: [B-12, IN-42]
  # --- HEPA leak tests (B-16; IN-43).
  - {key: sterile.hepa.gradeAB.leakTestMaxInterval, title: 'Maximum interval between HEPA leak tests in Grade A/B areas', method: SMALLER_STRICTER, valueType: DECIMAL, unit: mo, indiaGoverns: true, catalogRefs: [B-16, IN-43]}
  - {key: sterile.hepa.gradeCD.leakTestMaxInterval, title: 'Maximum interval between HEPA leak tests in Grade C/D areas', method: SMALLER_STRICTER, valueType: DECIMAL, unit: mo, indiaGoverns: true, catalogRefs: [B-16, IN-43]}
  # --- Sterilising filters (B-17; IN-48).
  - {key: sterile.filter.preUseIntegrityTest, title: 'Sterilising filter integrity tested before use', method: REQUIRED_IF_ANY, valueType: BOOLEAN, unit: '{flag}', indiaGoverns: true, catalogRefs: [B-17, IN-48]}
  - {key: sterile.filter.preUseTestAfterSterilisation, title: 'Pre-use integrity test after filter sterilisation (PUPSIT)', method: REQUIRED_IF_ANY, valueType: BOOLEAN, unit: '{flag}', indiaGoverns: true, catalogRefs: [B-17, IN-48]}
  - {key: sterile.filter.postUseIntegrityTest, title: 'Sterilising filter integrity tested after use', method: REQUIRED_IF_ANY, valueType: BOOLEAN, unit: '{flag}', indiaGoverns: true, catalogRefs: [B-17, IN-48]}
  - {key: sterile.filter.singleBatchUse, title: 'A liquid sterilising filter serves a single batch', method: REQUIRED_IF_ANY, valueType: BOOLEAN, unit: '{flag}', indiaGoverns: true, catalogRefs: [B-17, IN-48]}
  - {key: sterile.filter.maxContinuousUse, title: 'Maximum continuous use of one sterilising filter unless validated', method: SMALLER_STRICTER, valueType: DECIMAL, unit: '{workingDay}', indiaGoverns: true, catalogRefs: [B-17, IN-48]}
  # --- Aseptic process simulation acceptance (B-10; IN-45; Decision 2).
  - key: sterile.aps.acceptance
    title: Aseptic process simulation (media fill) acceptance
    method: ORDERED
    valueType: CATEGORY
    unit: '{category}'
    orderedValues: [TIERED_BY_RUN_SIZE, ANY_CONTAMINATED_UNIT_FAILS]
    indiaGoverns: true
    catalogRefs: [B-10, IN-45]

